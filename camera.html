<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Terooka | Cultural Camera</title>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #5724a3;
      --pink: #d842a0;
      --ink: #32204b;
      --gradient: linear-gradient(115deg, #5724a3, #a448b7, #d842a0);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: #ede4f5;
      display: grid;
      place-items: center;
    }

    button {
      font: inherit;
      cursor: pointer;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #ffc6ef;
      outline-offset: 3px;
    }

    .stage {
      position: relative;
      width: 414px;
      height: 868px;
      transform-origin: center center;
    }

    .phone {
      position: absolute;
      inset: 0;
      background: #14101a;
      border-radius: 59px;
      padding: 12px;
      box-shadow: 0 24px 65px #28113838;
    }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 48px;
      overflow: hidden;
      background: #23152f;
      color: white;
    }

    .island {
      position: absolute;
      z-index: 21;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: 115px;
      height: 32px;
      background: #130e17;
      border-radius: 25px;
    }

    /* SIMULATED CAMERA BACKGROUND */

    .scene {
      position: absolute;
      inset: 0;
      overflow: hidden;
      background: #39254d;
    }

    .scene img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .scene::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(
        to bottom,
        #180d2888,
        transparent 29%,
        transparent 54%,
        #1a0c2cbd 100%
      );
    }

    /* CARTOON POSE GUIDE */

    .pose-image {
      position: absolute !important;
      z-index: 2;

      top: 60% !important;
      left: 50% !important;

      width: 85% !important;
      height: 85% !important;

      object-fit: contain !important;
      transform: translate(-50%, -50%);

      opacity: 0.65;
      filter: drop-shadow(0 3px 10px #0005);
      pointer-events: none;
    }

    /* TOP BAR */

    .top {
      position: absolute;
      z-index: 8;
      top: 62px;
      left: 20px;
      right: 20px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
    }

    .top h1 {
      font: 600 20px 'Fraunces', serif;
      margin: 0;
      text-shadow: 0 2px 8px #0007;
      white-space: nowrap;
    }

    .glass {
      border: 1px solid #ffffff65;
      background: #21152ca8;
      color: white;
      border-radius: 13px;
      backdrop-filter: blur(12px);
    }

    .back {
      width: 40px;
      height: 40px;
      padding: 0;

      display: flex;
      justify-content: center;
      align-items: center;

      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 30px;
      line-height: 1;
      font-weight: 800;
    }

    /* MODE SWITCH */

    .tabs {
      position: absolute;
      z-index: 8;
      top: 119px;
      left: 50%;
      transform: translateX(-50%);

      display: flex;
      gap: 4px;
      padding: 5px;

      border: 1px solid #ffffff55;
      border-radius: 17px;
      background: #22152fae;
      backdrop-filter: blur(14px);
      white-space: nowrap;
    }

    .tabs button {
      border: 0;
      border-radius: 12px;
      padding: 11px 15px;
      color: #ffffffb6;
      background: transparent;
      font-size: 11px;
      font-weight: 800;
    }

    .tabs button.active {
      background: white;
      color: var(--purple);
    }

    /* TOP RIGHT HELP BUTTON */
    .help-btn {
      width: 40px;
      height: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 20px;
      font-weight: 800;
      border-radius: 13px;
    }

    /* WHY THIS POSE - separate from the camera help icon */
    .about-pose {
      position: absolute;
      z-index: 9;
      top: 175px;
      right: 20px;
      display: none;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: white;
      color: var(--purple);
      font-size: 11px;
      font-weight: 800;
      box-shadow: 0 5px 20px #0005;
    }
    .about-pose.before-capture { top: 225px; }
    .pose-info-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      border: 2px solid currentColor;
      border-radius: 50%;
      font-size: 10px;
      line-height: 1;
    }
    @media (max-width: 500px) {
      .about-pose, .about-pose.before-capture {
        top: calc(185px + env(safe-area-inset-top));
        right: 20px;
      }
    }

    /* CAMERA INSTRUCTIONS */

    .hint {
      position: absolute;
      z-index: 5;
      top: 188px;
      left: 30px;
      right: 30px;

      text-align: center;
      font-size: 11px;
      line-height: 1.6;
      text-shadow: 0 2px 8px #000c;
    }

    .pose-picker {
      position: absolute;
      z-index: 7;
      bottom: 192px;
      left: 20px;
      right: 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .pose-label {
      font-size: 11px;
      font-weight: 800;
      padding: 11px 13px;
    }

    .arrows {
      display: flex;
      gap: 8px;
    }

    .arrows button {
      width: 39px;
      height: 39px;
      font-size: 23px;
    }

    .caption {
      position: absolute;
      z-index: 5;

      bottom: 140px;
      left: 24px;
      right: 24px;

      text-align: center;
      font-size: 11px;
      line-height: 1.7;
      text-shadow: 0 2px 9px #000b;
    }

    /* CAPTURE BUTTON */

    .camera-actions {
      position: absolute;
      z-index: 7;

      bottom: 60px;
      left: 0;
      right: 0;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .shutter {
      width: 78px;
      height: 78px;

      border: 4px solid white;
      background: #ffffff3b;
      border-radius: 50%;

      padding: 5px;
      box-shadow: 0 4px 22px #0007;
    }

    .shutter::after {
      content: '';
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      background: white;
    }

    /* AFTER CAPTURE */

    .result-actions {
      position: absolute;
      z-index: 9;

      bottom: 47px;
      left: 20px;
      right: 20px;

      display: none;
      gap: 10px;
    }

    .result-actions button {
      flex: 1;
      min-height: 51px;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 800;
    }

    .retake {
      color: white;
      border: 1px solid #ffffff70;
      background: #21152cce;
    }

    .save {
      border: 0;
      color: white;
      background: var(--gradient);
    }

    .save:disabled {
      opacity: 0.7;
    }

    /* CULTURE LENS SCANNING */

    .scan {
      position: absolute;
      z-index: 10;
      inset: 0;

      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 18px;

      background: #180a3080;
      backdrop-filter: blur(3px);
    }

    .scan-frame {
      width: 230px;
      height: 260px;
      border: 2px solid #ffffffba;
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }

    .scan-line {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;

      height: 3px;
      background: #ffb8ed;
      box-shadow: 0 0 17px #ffc5f1;

      animation: scan 1.8s infinite alternate linear;
    }

    @keyframes scan {
      to {
        top: 100%;
      }
    }

    .scan span {
      font-size: 12px;
      font-weight: 700;
    }

    /* CULTURE LENS MARKERS */

    .markers {
      position: absolute;
      z-index: 7;
      inset: 0;
      display: none;
      pointer-events: none;
    }

    .marker {
      position: absolute;
      transform: translate(-50%, -50%);

      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: 3px solid white;

      background: var(--gradient);
      color: white;

      font-size: 18px;
      font-weight: 800;

      box-shadow: 0 0 0 7px #ffffff40, 0 4px 14px #0008;
      pointer-events: auto;
    }

    /* BOTTOM INFORMATION SHEET */

    .sheet-dim {
      position: absolute;
      z-index: 15;
      inset: 0;

      background: #160a2780;
      opacity: 0;
      pointer-events: none;

      transition: opacity 0.25s;
    }

    .sheet-dim.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      position: absolute;
      z-index: 16;

      bottom: 0;
      left: 0;
      right: 0;

      max-height: 74%;
      overflow-y: auto;
      overscroll-behavior: contain;

      background: linear-gradient(145deg, #fbf4ff, #fff8fa);
      color: var(--ink);

      border-radius: 29px 29px 0 0;
      padding: 13px 23px 34px;

      transform: translateY(105%);
      transition: transform 0.28s ease;

      box-shadow: 0 -12px 35px #1b0c2c55;
    }

    .sheet.open {
      transform: translateY(0);
    }

    .handle {
      height: 5px;
      width: 44px;
      border-radius: 10px;
      background: #d7c5e3;
      margin: 0 auto 18px;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: start;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      color: var(--pink);
    }

    .sheet h2 {
      font: 600 24px/1.22 'Fraunces', serif;
      margin: 7px 0 14px;
    }

    .info-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      width: 16px;
      height: 16px;

      border: 2px solid var(--purple);
      border-radius: 50%;

      font-size: 10px;
      font-weight: 800;
      line-height: 1;
    }

    .sheet p {
      font-size: 12px;
      line-height: 1.85;
      color: #6c5b79;
      margin: 0 0 13px;
      white-space: pre-line;
    }

    .close {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 10px;
      background: #eee1f7;
      color: var(--purple);
      font-size: 23px;
      flex-shrink: 0;
    }

    .note {
      padding: 13px;
      border-radius: 14px;
      background: #f0e4f8;
      color: #64477b;
      font-size: 11px;
      line-height: 1.75;
      margin: 12px 0;
    }
    #helpBtn {
      left: auto;
      right: 18px;
    }
    .source {
      border-top: 1px solid #e8dbea;
      padding-top: 12px;
      font-size: 10px;
      line-height: 1.6;
      color: #9987a7;
    }

    .story {
      display: none;
      margin-top: 14px;
      padding: 12px 14px;
      border-radius: 13px;
      background: var(--gradient);
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      padding: 16px 18px;
      border-radius: 15px;
    }


    /* Read Full Story and saved-story bookmark */
    .story-action-row {
      display: none;
      align-items: stretch;
      gap: 10px;
      margin-top: 14px;
    }
    .story-action-row .story {
      display: flex;
      flex: 1;
      align-items: center;
      justify-content: center;
      margin: 0;
      min-height: 51px;
      padding: 13px 15px;
    }
    .story-bookmark {
      width: 51px;
      min-width: 51px;
      height: 51px;
      display: grid;
      place-items: center;
      border: 1px solid #e4d2ef;
      border-radius: 15px;
      background: white;
      color: var(--purple);
    }
    .story-bookmark svg { width: 21px; height: 21px; }
    .story-bookmark.saved {
      background: #f0e4f8;
      border-color: #b58cda;
    }
    .story-bookmark.saved svg { fill: var(--purple); }

    /* NOTIFICATION */

    .toast {
      position: absolute;
      z-index: 25;
      top: 57px;
      left: 50%;
      transform: translateX(-50%);

      max-width: 86%;
      width: max-content;
      padding: 11px 14px;

      background: white;
      color: var(--purple);

      border-radius: 12px;
      box-shadow: 0 5px 20px #0003;

      text-align: center;
      font-size: 11px;
      font-weight: 800;

      display: none;
    }

    /* MOBILE */

    @media (max-width: 500px) {
      body {
        display: block;
      }

      .stage,
      .phone {
        width: 100%;
        height: 100dvh;
        transform: none !important;
      }

      .phone {
        padding: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .screen {
        border-radius: 0;
      }

      .island {
        display: none;
      }

      .top {
        top: calc(20px + env(safe-area-inset-top));
      }

      .tabs {
        top: calc(78px + env(safe-area-inset-top));
      }

      .hint {
        top: calc(145px + env(safe-area-inset-top));
      }

      .camera-actions {
        bottom: calc(28px + env(safe-area-inset-bottom));
      }

      .result-actions {
        bottom: calc(25px + env(safe-area-inset-bottom));
      }

      .pose-picker {
        bottom: calc(164px + env(safe-area-inset-bottom));
      }

      .caption {
        bottom: calc(120px + env(safe-area-inset-bottom));
      }

      .toast {
        top: calc(18px + env(safe-area-inset-top));
      }

      .sheet {
        padding-bottom: calc(28px + env(safe-area-inset-bottom));
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sheet,
      .sheet-dim {
        transition: none;
      }

      .scan-line {
        animation: none;
      }
    }

    /* Exact outer frame and status bar shared with Home */
    body { min-height: 100dvh; overflow: hidden; }
    .stage { flex-shrink: 0; transform-origin: center; }
    .phone {
      position: relative; inset: auto;
      width: 414px; height: 868px; padding: 12px;
      background: #111015; border-radius: 62px;
      box-shadow: 0 24px 70px rgba(54,25,88,.23), 0 0 0 2px #343039;
    }
    .phone::before, .phone::after {
      content: ''; position: absolute; left: -5px; width: 4px;
      background: #302b35; border-radius: 4px;
    }
    .phone::before { top: 155px; height: 52px; }
    .phone::after { top: 228px; height: 69px; }
    .screen { width: 390px; height: 844px; border-radius: 50px; }
    .island {
      z-index: 30; top: 11px; width: 118px; height: 34px;
      background: #08070a; border-radius: 30px;
    }
    .status {
      position: absolute; top: 18px; left: 34px; right: 30px;
      z-index: 29; display: flex; justify-content: space-between;
      align-items: center; color: #fff; font-size: 14px; font-weight: 800;
      text-shadow: 0 1px 4px rgba(0,0,0,.45);
      pointer-events: none;
    }
    .homebar {
      position: absolute; bottom: 8px; left: 50%; z-index: 30;
      transform: translateX(-50%); width: 126px; height: 5px;
      background: rgba(255,255,255,.9); border-radius: 20px;
      pointer-events: none;
    }
    @media (max-width: 500px) {
      body { overflow: auto; }
      .phone { width: 100%; height: 100dvh; }
      .phone::before, .phone::after, .status, .homebar { display: none; }
      .screen { width: 100%; height: 100%; min-height: 650px; }
    }
  </style>
</head>

<body>

<div class="stage" id="stage">
  <div class="phone">
    <main class="screen">

      <div class="island"></div>
      <!-- iPhone-style status bar (matches Home layout) -->
      <div class="status" aria-label="Phone status">
        <span>9:41</span>
        <svg width="70" height="15" viewBox="0 0 70 15" fill="none" aria-hidden="true">
          <g fill="white">
            <rect x="0" y="10" width="3" height="5" rx="1"/>
            <rect x="5" y="7" width="3" height="8" rx="1"/>
            <rect x="10" y="4" width="3" height="11" rx="1"/>
            <rect x="15" y="1" width="3" height="14" rx="1"/>
          </g>
          <g stroke="white" stroke-width="1.8" stroke-linecap="round">
            <path d="M27 5Q34-1 41 5"/>
            <path d="M30 9Q34 5 38 9"/>
          </g>
          <circle cx="34" cy="12" r="1.5" fill="white"/>
          <rect x="48" y="2" width="19" height="11" rx="3" stroke="white" stroke-width="1.3"/>
          <rect x="50" y="4" width="15" height="7" rx="1.6" fill="white"/>
          <path d="M69 5v5" stroke="white" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>
      <div class="homebar"></div>


      <!-- SIMULATED CAMERA SCENE -->

      <div class="scene" id="scene">
        <img
          id="background"
          src="img/sarawak-longhouse-bg.png"
          alt="Sarawak longhouse demo background"
        >

        <img
          id="poseImage"
          class="pose-image"
          src="img/ngajat-pose1.png"
          alt="Ngajat-inspired illustrated pose"
          style="display:none"
        >
      </div>

      <!-- HEADER -->

      <header class="top">
        <button
          class="glass back"
          id="backBtn"
          aria-label="Back"
        ><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg></button>

        <h1>Terooka Camera</h1>

        <button class="glass back" id="helpBtn" aria-label="Help">
          <svg viewBox="0 0 24 24" width="22" height="22"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M9.5 9a2.5 2.5 0 1 1 4.3 1.7c-1.1 1-1.8 1.5-1.8 3"/>
            <path d="M12 17h.01"/>
          </svg>
        </button>
      </header>

      <!-- MODE TABS -->

      <div class="tabs" id="tabs">
        <button
          type="button"
          class="active"
          data-mode="lens"
        >Culture Lens</button>

        <button
          type="button"
          data-mode="pose"
        >Photo Guide</button>
      </div>

      <!-- PHOTO GUIDE -->

      <div
        class="hint"
        id="hint"
        style="display:none"
      >
        Match your pose with the illustration
      </div>

      <button type="button" class="about-pose" id="aboutPose">
        <span class="pose-info-icon" aria-hidden="true">i</span> Why This Pose?
      </button>

      <div
        class="pose-picker"
        id="posePicker"
        style="display:none"
      >
        <span
          class="glass pose-label"
          id="poseLabel"
        >
          Pose 1 of 2
        </span>

        <div class="arrows">
          <button
            class="glass"
            id="prevPose"
            aria-label="Previous pose"
          >&#8249;</button>

          <button
            class="glass"
            id="nextPose"
            aria-label="Next pose"
          >&#8250;</button>
        </div>
      </div>

      <!-- CAPTION -->

      <p class="caption" id="caption">
        Capture a cultural moment to discover the stories behind it.
      </p>

      <!-- CAPTURE -->

      <div class="camera-actions" id="cameraActions">
        <button
          class="shutter"
          id="captureBtn"
          aria-label="Capture simulated photo"
        ></button>
      </div>

      <!-- SCANNING -->

      <div class="scan" id="scan">
        <div class="scan-frame">
          <div class="scan-line"></div>
        </div>

        <span>Discovering cultural details...</span>
      </div>

      <!-- INFORMATION MARKERS -->

      <div class="markers" id="markers"></div>

      <!-- AFTER CAPTURE -->

      <div class="result-actions" id="resultActions">
        <button class="retake" id="retakeBtn">
          Retake
        </button>

        <button class="save" id="saveBtn">
          Save to Journey
        </button>
      </div>

      <!-- INFORMATION BOTTOM SHEET -->

      <div class="sheet-dim" id="sheetDim"></div>

      <section
        class="sheet"
        id="sheet"
        role="dialog"
        aria-modal="true"
        aria-label="Cultural information"
      >
        <div class="handle"></div>

        <div class="sheet-header">
          <div>
            <div class="eyebrow" id="sheetCategory"></div>
            <h2 id="sheetTitle"></h2>
          </div>

          <button
            class="close"
            id="closeSheet"
            aria-label="Close information"
          >&times;</button>
        </div>

        <p id="sheetText"></p>

        <div class="story-action-row" id="storyActionRow">
          <a class="story" id="storyLink" href="#">
            Read Full Story
          </a>
          <button type="button" class="story-bookmark" id="storyBookmark"
                  aria-label="Save cultural story" aria-pressed="false"
                  title="Save Story">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 stroke-width="2" stroke-linecap="round"
                 stroke-linejoin="round" aria-hidden="true">
              <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
            </svg>
          </button>
        </div>
      </section>

      <div
        class="toast"
        id="toast"
        role="status"
      ></div>

    </main>
  </div>
</div>

<script>
  (() => {
    'use strict';

    const $ = id => document.getElementById(id);

    const BACKGROUND = 'img/sarawak-longhouse-bg.png';

    // Opacity before capture
    const OPACITY = 0.65;

    // Cartoon positioning
    const POSE_SIZE = 0.85;
    const POSE_Y = 0.60;

    const poses = [
      {
        id: 'ngajat-pose1',
        title: 'Ngajat-Inspired Pose 1',
        image: 'img/ngajat-pose1.png',

        description:
          'This illustrated pose draws inspiration from expressive movements associated with Ngajat, a traditional dance of Iban communities in Sarawak.\n\n' +
          'Follow the illustration as a creative guide to the positioning of your arms and body.',

        note:
          'This is a simplified, artistic pose for photography, not a representation of a complete or authentic ceremonial performance.',

        storyUrl: 'cultural-story.html?id=ngajat'
      },

      {
        id: 'ngajat-pose2',
        title: 'Ngajat-Inspired Pose 2',
        image: 'img/ngajat-pose2.png',

        description:
          'This second illustrated pose is inspired by expressive Ngajat movements.\n\n' +
          'Try following the different arm positions shown in the illustration.',

        note:
          'This pose is an artistic interpretation for a travel photo. It is not formal instruction in traditional dance.',

        storyUrl: 'cultural-story.html?id=ngajat'
      }
    ];

    const discoveries = [
      {
        id: 'beadwork',
        title: 'Traditional Beadwork Decoration',
        category: 'Traditional Craft',
        x: 35,
        y: 23,

        description:
          'Beadwork is an important traditional craft among several Indigenous communities in Sarawak. Colourful beads are arranged into decorative patterns and can be used in accessories, clothing and ornaments.',

        note:
          'Beadwork patterns and their cultural meanings vary between communities. The specific decoration shown should be verified with local cultural experts.',

        source:
          'Terooka demo cultural record · Verification pending',

        storyUrl:
          'cultural-story.html?id=beadwork'
      },
      {
        id: 'carving',
        title: 'Decorative Wood Carving',
        category: 'Craftsmanship',
        x: 15,
        y: 45,

        description:
          'Decorative wood carvings can reflect artistic traditions and craftsmanship. The meaning of a particular motif depends on its cultural context.',

        note:
          'This is a prototype marker. The specific motif in a real photograph would need confirmation from a knowledgeable local source.',

        source:
          'Terooka demo record · Specific motif unverified',

        storyUrl:
          'cultural-story.html?id=carving'
      }
    ];

    let mode = 'lens';
    let poseIndex = 0;

    let captured = false;
    let scanning = false;
    let photoData = null;

    let scanTimer = null;
    let saved = false;

    let activeDiscoveries = [];

    /* LOCAL STORAGE */

    function sessionUid() {
      try {
        const session = JSON.parse(
          localStorage.getItem('terooka_session') || 'null'
        );

        return session?.username || session?.email || 'guest';
      } catch {
        return 'guest';
      }
    }

    const uid = sessionUid();

    const journeyKey = 'terooka_journeys_' + uid;
    const photoKey = 'terooka_journey_photos_' + uid;

    function read(key) {
      try {
        const value = JSON.parse(
          localStorage.getItem(key) || '[]'
        );

        return Array.isArray(value) ? value : [];
      } catch {
        return [];
      }
    }

    /* TOAST */

    function toast(message) {
      $('toast').textContent = message;
      $('toast').style.display = 'block';

      clearTimeout(toast.timer);

      toast.timer = setTimeout(() => {
        $('toast').style.display = 'none';
      }, 2700);
    }

    /* RESPONSIVE PHONE FRAME */

    function resize() {
      if (window.matchMedia('(max-width:500px)').matches) {
        $('stage').style.transform = 'none';
        return;
      }

      const scale = Math.min(
        (innerWidth - 28) / 414,
        (innerHeight - 28) / 868,
        1
      );

      $('stage').style.transform =
        'scale(' + scale + ')';
    }

    addEventListener('resize', resize);
    resize();

    /* RENDER UI */

    function render() {
      document.querySelectorAll('[data-mode]').forEach(button => {
        button.classList.toggle(
          'active',
          button.dataset.mode === mode
        );
      });

      $('tabs').style.display =
        captured ? 'none' : 'flex';

      $('cameraActions').style.display =
        captured ? 'none' : 'flex';

      $('caption').style.display =
        captured ? 'none' : 'block';

      $('resultActions').style.display =
        captured && !scanning ? 'flex' : 'none';

      $('aboutPose').style.display =
        mode === 'pose' && !scanning ? 'flex' : 'none';
      $('aboutPose').classList.toggle('before-capture', !captured);

      const guide = mode === 'pose' && !captured;

      $('posePicker').style.display =
        guide ? 'flex' : 'none';

      $('hint').style.display =
        guide ? 'block' : 'none';

      $('poseImage').style.display =
        guide ? 'block' : 'none';

      $('poseImage').src =
        poses[poseIndex].image;

      $('poseImage').style.opacity = OPACITY;

      $('poseLabel').textContent =
        `Pose ${poseIndex + 1} of ${poses.length}`;

      $('caption').textContent =
        mode === 'lens'
          ? 'Capture a cultural moment to discover the stories behind it.'
          : 'Choose a pose and capture a photo.';
    }

    /* BOTTOM SHEET */

    function closeSheet() {
      $('sheet').classList.remove('open');
      $('sheetDim').classList.remove('open');
    }

    const cultureSavedKey = 'terooka_culture_saved_' + uid;
    let currentStoryId = null;

    function updateStoryBookmark() {
      const isSaved = Boolean(
        currentStoryId && read(cultureSavedKey).includes(currentStoryId)
      );
      $('storyBookmark').classList.toggle('saved', isSaved);
      $('storyBookmark').setAttribute('aria-pressed', String(isSaved));
      $('storyBookmark').setAttribute('aria-label',
        isSaved ? 'Remove saved story' : 'Save cultural story');
      $('storyBookmark').title = isSaved ? 'Remove Saved Story' : 'Save Story';
    }

    $('storyBookmark').onclick = () => {
      if (!currentStoryId) return;
      const savedStories = read(cultureSavedKey);
      const alreadySaved = savedStories.includes(currentStoryId);
      const next = alreadySaved
        ? savedStories.filter(id => id !== currentStoryId)
        : [currentStoryId, ...savedStories];
      try {
        localStorage.setItem(cultureSavedKey, JSON.stringify(next));
        updateStoryBookmark();
        toast(alreadySaved
          ? 'Story removed from saved collection'
          : 'Story saved to your collection!');
      } catch (error) {
        toast('Unable to save story');
      }
    };

    function openSheet(data) {
      $('sheetCategory').textContent =
        data.category || 'Cultural information';

      $('sheetTitle').textContent = data.title || '';
      $('sheetText').textContent = data.description || '';

      currentStoryId = null;
      if (data.storyUrl) {
        const url = new URL(data.storyUrl, location.href);
        currentStoryId = url.searchParams.get('id');
        url.searchParams.set('from', 'camera');
        $('storyLink').href = url.href;
        $('storyActionRow').style.display = 'flex';
        updateStoryBookmark();
      } else {
        $('storyActionRow').style.display = 'none';
      }

      $('sheetDim').classList.add('open');
      $('sheet').classList.add('open');
    }

    $('closeSheet').onclick = closeSheet;
    $('sheetDim').onclick = closeSheet;

    addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        closeSheet();
      }
    });

    /* MODE-SPECIFIC CAMERA HELP */
    $('helpBtn').onclick = () => {
      if (mode === 'lens') {
        openSheet({
          category: 'Camera Guide',
          title: 'How to Use Culture Lens',
          description: '1. Point towards a cultural feature.\n\n2. Tap the capture button.\n\n3. Wait for the information markers to appear.\n\n4. Tap a marker to explore its cultural story.\n\n5. Save your photo to your active journey.'
        });
      } else {
        openSheet({
          category: 'Camera Guide',
          title: 'How to Use Photo Guide',
          description: '1. Choose an illustrated pose using the arrows.\n\n2. Match your pose with the illustration.\n\n3. Tap the capture button.\n\n4. Save your photo to your active journey.\n\nThese illustrated poses are creative photo inspirations.'
        });
      }
    };

    /* CULTURAL CONTEXT FOR THE SELECTED POSE */
    $('aboutPose').onclick = () => {
      const pose = poses[poseIndex];
      openSheet({
        category: 'Photo Guide · Cultural Inspiration',
        title: pose.title,
        description: pose.description + (pose.note ? '\n\n' + pose.note : ''),
        storyUrl: pose.storyUrl
      });
    };

    /* MODE SWITCHING */

    document.querySelectorAll('[data-mode]').forEach(button => {
      button.onclick = () => {
        if (captured) return;

        closeSheet();

        mode = button.dataset.mode;
        render();
      };
    });

    /* POSE SWITCHING */

    $('prevPose').onclick = () => {
      poseIndex =
        (poseIndex - 1 + poses.length) % poses.length;

      render();
    };

    $('nextPose').onclick = () => {
      poseIndex =
        (poseIndex + 1) % poses.length;

      render();
    };

    /* IMAGE LOADING */

    function loadImage(src) {
      return new Promise((resolve, reject) => {
        const image = new Image();

        image.onload = () => resolve(image);

        image.onerror = () => {
          reject(new Error('Cannot load ' + src));
        };

        image.src = src;
      });
    }

    /* DRAW IMAGE TO COVER CANVAS */

    function cover(ctx, image, width, height) {
      const scale = Math.max(
        width / image.naturalWidth,
        height / image.naturalHeight
      );

      const sourceWidth = width / scale;
      const sourceHeight = height / scale;

      ctx.drawImage(
        image,

        (image.naturalWidth - sourceWidth) / 2,
        (image.naturalHeight - sourceHeight) / 2,

        sourceWidth,
        sourceHeight,

        0,
        0,

        width,
        height
      );
    }

    /* COMPOSE SIMULATED PHOTO */

    async function compose() {
      const background = await loadImage(BACKGROUND);

      const canvas = document.createElement('canvas');

      canvas.width = 780;
      canvas.height = 1688;

      const ctx = canvas.getContext('2d');

      cover(
        ctx,
        background,
        canvas.width,
        canvas.height
      );

      if (mode === 'pose') {
        const overlay = await loadImage(
          poses[poseIndex].image
        );

        const maxWidth = canvas.width * POSE_SIZE;
        const maxHeight = canvas.height * POSE_SIZE;

        const factor = Math.min(
          maxWidth / overlay.naturalWidth,
          maxHeight / overlay.naturalHeight
        );

        const width = overlay.naturalWidth * factor;
        const height = overlay.naturalHeight * factor;

        const x = (canvas.width - width) / 2;

        const y =
          canvas.height * POSE_Y - height / 2;

        // Cartoon becomes fully opaque after capture
        ctx.globalAlpha = 1;

        ctx.drawImage(
          overlay,
          x,
          y,
          width,
          height
        );

        ctx.globalAlpha = 1;
      }

      return canvas.toDataURL(
        'image/jpeg',
        0.92
      );
    }

    /* CULTURAL MARKERS */

    function renderMarkers() {
      $('markers').replaceChildren();

      for (const discovery of activeDiscoveries) {
        const button = document.createElement('button');

        button.className = 'marker';
        button.textContent = 'i';

        button.style.left = discovery.x + '%';
        button.style.top = discovery.y + '%';

        button.setAttribute(
          'aria-label',
          'Learn about ' + discovery.title
        );

        button.onclick = () => {
          openSheet(discovery);
        };

        $('markers').appendChild(button);
      }

      $('markers').style.display =
        activeDiscoveries.length ? 'block' : 'none';
    }

    /* CAPTURE */

    async function capture() {
      if (captured) return;

      $('captureBtn').disabled = true;

      try {
        photoData = await compose();

        captured = true;
        saved = false;
        activeDiscoveries = [];

        $('background').src = photoData;

        render();

        if (mode === 'lens') {
          scanning = true;

          $('scan').style.display = 'flex';

          render();

          scanTimer = setTimeout(() => {
            scanning = false;

            $('scan').style.display = 'none';

            // Predefined prototype cultural markers
            activeDiscoveries = discoveries.map(
              discovery => ({ ...discovery })
            );

            renderMarkers();
            render();
          }, 1800);

        } else {
          toast('Cartoon pose included in your photo');
        }

      } catch (error) {
        toast(
          'Could not prepare demo photo. Check the image files.'
        );

        console.error(error);

      } finally {
        $('captureBtn').disabled = false;
      }
    }

    $('captureBtn').onclick = capture;

    /* RETAKE */

    function retake() {
      clearTimeout(scanTimer);

      closeSheet();

      captured = false;
      scanning = false;

      photoData = null;
      activeDiscoveries = [];
      saved = false;

      $('background').src = BACKGROUND;

      $('scan').style.display = 'none';
      $('markers').style.display = 'none';

      $('markers').replaceChildren();

      $('saveBtn').textContent = 'Save to Journey';
      $('saveBtn').disabled = false;

      render();
    }

    $('retakeBtn').onclick = retake;

    /* BACK BUTTON */

    $('backBtn').onclick = () => {
      location.href = 'home.html';
    };

    /* SAVE TO JOURNEY */

    $('saveBtn').onclick = () => {
      if (!captured || !photoData || scanning) {
        return;
      }

      if (saved) {
        toast('Photo already saved');
        return;
      }

      const journey = read(journeyKey).find(item =>
        item.status === 'active' ||
        item.status === 'ongoing' ||
        item.isActive === true
      );

      if (!journey) {
        toast('Please start a journey first.');
        return;
      }

      const now = new Date().toISOString();

      const record = {
        id: Date.now(),

        journeyId: journey.id,

        src: photoData,
        image: photoData,

        mode: mode,

        pose:
          mode === 'pose'
            ? poses[poseIndex].title
            : null,

        poseInfo:
          mode === 'pose'
            ? {
              ...poses[poseIndex],
              opacity: OPACITY
            }
            : null,

        discoveries:
          mode === 'lens'
            ? activeDiscoveries.map(
              discovery => ({ ...discovery })
            )
            : [],

        createdAt: now,
        takenAt: now
      };

      const photos = read(photoKey);

      photos.push(record);

      try {
        localStorage.setItem(
          photoKey,
          JSON.stringify(photos)
        );

        saved = true;

        $('saveBtn').textContent = 'Saved to Journey';
        $('saveBtn').disabled = true;

        toast('Photo and cultural information saved!');

      } catch (error) {
        toast(
          'Unable to save. Browser storage may be full.'
        );
      }
    };

    /* INITIALISE */

    render();

  })();
</script>

</body>
</html>
