<script>

// Fictional demo venues with illustrative pin coordinates around Sarawak. NOT actual businesses or verified locations.
    const places=[
      {id:'riverstory',name:'Riverfront Heritage Walk',city:'Kuching',cat:'Heritage',lat:1.5583,lng:110.3477,desc:'Demo cultural walking experience inspired by Sarawak’s riverside history and storytelling. This is not a verified venue.',photo:'img/sarawak-riverfront.jpg',demo:true},

    const cats=['All Places','Heritage','Food','Crafts','Museum'];const colors={Heritage:'#8a49c6',Food:'#e46b94',Crafts:'#ed9b45',Museum:'#4b9e95'};const symbols={Heritage:'H',Food:'F',Crafts:'C',Museum:'M'};

    function markerIcon(p,active){

      const svg='<svg xmlns="http://www.w3.org/2000/svg" width="52" height="62" viewBox="0 0 52 62" aria-hidden="true"><path d="M26 3C13 3 4 13 4 26c0 17 22 33 22 33s22-16 22-33C48 13 39 3 26 3Z" fill="'+color+'" stroke="white" stroke-width="4"/><circle cx="26" cy="25" r="12" fill="white"/><circle cx="26" cy="25" r="6" fill="'+color+'"/></svg>';
      return L.divIcon({className:'terooka-pin'+(active?' is-selected':''),html:svg,iconSize:[52,62],iconAnchor:[26,59],popupAnchor:[0,-50]});
    }
    function updatePins(){markers.forEach(m=>map.removeLayer(m));markers=[];const matches=filtered();$('#empty-map').classList.toggle('show',matches.length===0);if(selected&&!matches.some(p=>p.id===selected.id))closePreview();matches.forEach(p=>{const marker=L.marker([p.lat,p.lng],{icon:markerIcon(p,selected&&selected.id===p.id)}).addTo(map).on('click',()=>showPreview(p));markers.push(marker)});$('#map-label').textContent=(city==='All'?'Kuching, Sarawak':city+', Sarawak')+' · '+matches.length+' places';}

    function showPreview(p){selected=p;$('#preview-category').textContent=p.cat+(p.demo?' · Demo listing':'');$('#preview-title').textContent=p.name;$('#preview-location').textContent='📍 '+p.city+', Sarawak · Demo';$('#preview-rating').innerHTML=ratingHTML(p);$('#preview-image').src=p.photo;$('#preview-image').onerror=function(){this.onerror=null;this.src='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220"><defs><linearGradient id="g"><stop stop-color="#e0c7f4"/><stop offset="1" stop-color="#f6c6da"/></linearGradient></defs><rect width="220" height="220" fill="url(#g)"/><text x="110" y="126" font-size="64" text-anchor="middle">'+(symbols[p.cat]||'📍')+'</text></svg>')};$('#save').textContent=saved.includes(p.id)?'♥':'♡';$('#save').setAttribute('aria-label',saved.includes(p.id)?'Remove saved place':'Save place');$('#preview').classList.add('show');$('#map-hint').classList.add('hidden');updatePins()}
    function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#overlay').classList.add('open')}
    function closeSheet(){$('#overlay').classList.remove('open')}
    function dist(a,b){const R=6371,rad=n=>n*Math.PI/180,dLat=rad(b.lat-a.lat),dLon=rad(b.lng-a.lng);const x=Math.sin(dLat/2)**2+Math.cos(rad(a.lat))*Math.cos(rad(b.lat))*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x))}
    function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function openDetails(p){const r=ratingFor(p);const nearby=places.filter(x=>x.id!==p.id&&x.city===p.city).map(x=>({p:x,d:dist(p,x)})).sort((a,b)=>a.d-b.d).slice(0,3);openSheet('<div class="sheet-head"><h2>'+escapeHTML(p.name)+'</h2><button class="close" id="sheet-close">×</button></div><div class="detail-category">'+escapeHTML(p.cat)+(p.demo?' · Prototype example':'')+'</div><img class="detail-photo" id="detail-photo" src="'+escapeHTML(p.photo)+'" alt="Place photograph"><div class="rating">'+ratingHTML(p)+'</div><p>'+escapeHTML(p.desc)+'</p><h2 style="font-size:19px;margin-top:17px">Nearby places</h2><div class="nearby-list">'+nearby.map(x=>'<button class="nearby-row" data-near="'+x.p.id+'"><span>'+escapeHTML(x.p.name)+'</span><small>'+x.d.toFixed(1)+' km ↗</small></button>').join('')+'</div><h2 style="font-size:19px;margin-top:19px">Visitor reviews</h2><div class="review-list">'+(r.count?(reviews[p.id]||[]).map(x=>'<div class="review"><b>★ '+x.stars+'/5 · '+escapeHTML(x.name)+'</b><p>'+escapeHTML(x.text||'Rating only')+'</p></div>').join(''):'<p>No reviews yet. Be the first to share your demo experience!</p>')+'</div><button class="primary" id="write-review">Write a Review</button>');$('#sheet-close').onclick=closeSheet;const img=$('#detail-photo');img.onerror=()=>{img.style.display='none'};$$('[data-near]').forEach(b=>b.onclick=()=>{const q=places.find(x=>x.id===b.dataset.near);closeSheet();map.setView([q.lat,q.lng],16);showPreview(q)});$('#write-review').onclick=()=>openReview(p)}
    function openReview(p){let stars=0;openSheet('<div class="sheet-head"><h2>Review this place</h2><button class="close" id="sheet-close">×</button></div><p>'+escapeHTML(p.name)+'</p><label class="filter-label">Your rating</label><div class="stars-picker" id="stars">'+[1,2,3,4,5].map(n=>'<button type="button" data-star="'+n+'" aria-label="'+n+' stars">★</button>').join('')+'</div><label class="filter-label" for="review-text">Your experience (optional)</label><textarea id="review-text" maxlength="500" placeholder="What did you enjoy about this place?"></textarea><button class="primary" id="submit-review">Submit Review</button><p style="font-size:10px">Reviews are stored locally in this browser for prototype testing only.</p>');$('#sheet-close').onclick=closeSheet;$$('[data-star]').forEach(b=>b.onclick=()=>{stars=+b.dataset.star;$$('[data-star]').forEach(x=>x.classList.toggle('on',+x.dataset.star<=stars))});$('#submit-review').onclick=()=>{if(!stars){toast('Choose a star rating first');return}if(!reviews[p.id])reviews[p.id]=[];reviews[p.id].push({stars,name:session.name||session.username||'Explorer',text:$('#review-text').value.trim()});persist(reviewKey,reviews);showPreview(p);openDetails(p);toast('Review saved on this device!')}}
    function openFilters(){openSheet('<div class="sheet-head"><h2>Filter discoveries</h2><button class="close" id="sheet-close">×</button></div><p>Choose what you want to see on the map.</p><label class="filter-label" for="city-select">Destination</label><select id="city-select"><option value="All">All Sarawak demo places</option><option value="Kuching">Kuching</option><option value="Bau">Bau</option><option value="Serian">Serian</option></select><label class="filter-label">Minimum visitor rating</label><div class="filter-options" id="rating-options">'+[0,3,4,4.5].map(n=>'<button class="filter-opt '+(minRating===n?'on':'')+'" data-rating="'+n+'">'+(n===0?'Any rating':n+'★ & up')+'</button>').join('')+'</div><label class="filter-label">Saved places</label><div class="filter-options"><button class="filter-opt '+(onlySaved?'on':'')+'" id="saved-filter">♡ Saved only</button></div><button class="primary" id="apply-filters">Apply Filters</button><button class="secondary" style="width:100%;margin-top:9px" id="clear-filters">Clear Filters</button>');$('#city-select').value=city;$('#sheet-close').onclick=closeSheet;let tmpRating=minRating,tmpSaved=onlySaved;$$('[data-rating]').forEach(b=>b.onclick=()=>{tmpRating=+b.dataset.rating;$$('[data-rating]').forEach(x=>x.classList.toggle('on',+x.dataset.rating===tmpRating))});$('#saved-filter').onclick=()=>{tmpSaved=!tmpSaved;$('#saved-filter').classList.toggle('on',tmpSaved)};$('#apply-filters').onclick=()=>{city=$('#city-select').value;minRating=tmpRating;onlySaved=tmpSaved;closeSheet();updatePins();if(city!=='All'){const target=places.find(p=>p.city===city);map.setView([target.lat,target.lng],city==='Kuching'?14:12)}else map.setView(mapStart,12)};$('#clear-filters').onclick=()=>{city='All';minRating=0;onlySaved=false;category='All Places';query='';$('#search').value='';renderChips();closeSheet();map.setView(mapStart,12);updatePins()}}
    function init(){renderChips();if(typeof L==='undefined'){$('#map').innerHTML='<p style="padding:30px;text-align:center">Map library could not load. Please connect to the internet and refresh.</p>';return}map=L.map('map',{zoomControl:false,preferCanvas:true}).setView(mapStart,12);
      // CARTO Voyager provides a clearer, higher-contrast street map than the previous tile layer.
      // Fall back to standard OpenStreetMap tiles if CARTO cannot load.
      let fallbackActivated=false;
      const tiles=L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
        subdomains:'abcd',maxZoom:19,attribution:'&copy; OpenStreetMap contributors &copy; CARTO',
        keepBuffer:3,updateWhenIdle:false
      }).addTo(map);
      let failedTiles=0;
      tiles.on('tileerror',()=>{
        if(++failedTiles<3||fallbackActivated)return;
        fallbackActivated=true;
        map.removeLayer(tiles);
        const backup=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
          maxZoom:19,attribution:'&copy; OpenStreetMap contributors',updateWhenIdle:false
        }).addTo(map);
        backup.bringToBack();
        backup.on('tileerror',()=>{$('#map-hint').textContent='Map needs internet access · location pins are still available';});
      });L.control.zoom({position:'bottomright'}).addTo(map);updatePins();setTimeout(()=>map.invalidateSize({pan:false}),200);setTimeout(()=>map.invalidateSize({pan:false}),850);setTimeout(()=>map.invalidateSize({pan:false}),1800);setTimeout(()=>map.invalidateSize({pan:false}),3200)}
    $('#search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();updatePins()});$('#filter-open').onclick=openFilters;$('#close-preview').onclick=closePreview;$('#explore').onclick=()=>selected&&openDetails(selected);$('#save').onclick=()=>{if(!selected)return;const i=saved.indexOf(selected.id);if(i<0)saved.push(selected.id);else saved.splice(i,1);persist(savedKey,saved);showPreview(selected);toast(i<0?'Place saved!':'Removed from saved places')};$('#reset-view').onclick=()=>{map.setView(mapStart,12);toast('Map centred on Kuching')};$('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeSheet()};$('#locate').onclick=()=>{if(!navigator.geolocation){toast('Location is not supported');return}navigator.geolocation.getCurrentPosition(pos=>{const lat=pos.coords.latitude,lng=pos.coords.longitude;if(userMarker)map.removeLayer(userMarker);userMarker=L.circleMarker([lat,lng],{radius:9,color:'#fff',weight:3,fillColor:'#3885ef',fillOpacity:1}).addTo(map).bindPopup('You are here');map.setView([lat,lng],14);userMarker.openPopup();toast('Location found')},()=>toast('Allow location access to show where you are'),{enableHighAccuracy:false,timeout:10000})};
    const stage=$('#stage');function fit(){if(innerWidth<=500){stage.style.transform='';return}const s=Math.min(1,(innerWidth-28)/414,(innerHeight-28)/868);stage.style.transform='scale('+s+')'}fit();addEventListener('resize',()=>{fit();if(map){requestAnimationFrame(()=>map.invalidateSize({pan:false}));setTimeout(()=>map.invalidateSize({pan:false}),350)}});init();
  })();
</script>
