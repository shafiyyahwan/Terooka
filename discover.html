
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#eee3f8">
  <title>Discover — Terooka</title>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

  <style>
    :root{
      --purple:#5724a3;
      --pink:#d842a0;
      --ink:#32204b;
      --muted:#806d91;
      --serif:'Fraunces',Georgia,serif;
      --sans:'Plus Jakarta Sans',sans-serif;
      --grad:linear-gradient(115deg,#5724a3,#9339b5,#d842a0);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%}
    body{
      background:#ede4f5;color:var(--ink);font-family:var(--sans);
      display:grid;place-items:center;min-height:100dvh;overflow:hidden
    }
    button,input,select{font:inherit}
    button{cursor:pointer}
    .stage{width:414px;height:868px;transform-origin:center}
    .phone{
      height:868px;width:414px;padding:12px;background:#111015;
      border-radius:62px;box-shadow:0 24px 70px #36195838;
      position:relative
    }
    .screen{
      position:relative;width:390px;height:844px;
      border-radius:50px;overflow:hidden;
      background:linear-gradient(160deg,#F0E4FB 0%,#F9EAF5 35%,#FFF9F7 70%,#FFECE5 100%)
    }
    .island{
      position:absolute;z-index:900;top:11px;left:50%;
      transform:translateX(-50%);width:118px;height:34px;
      border-radius:30px;background:#08070a
    }
    .status{
      position:absolute;z-index:800;top:18px;left:34px;right:30px;
      display:flex;justify-content:space-between;font-size:14px;font-weight:800
    }
    .status-icons{letter-spacing:2px}
    .homebar{
      position:absolute;bottom:8px;left:50%;transform:translateX(-50%);
      width:126px;height:5px;background:#302738;border-radius:8px;z-index:800
    }
    .app{
      position:absolute;inset:0;display:flex;flex-direction:column;
      padding-top:63px
    }
    .header{padding:0 20px;flex-shrink:0}
    .top{display:flex;align-items:center;justify-content:space-between}
    .top h1{font:600 32px var(--serif);margin:0;letter-spacing:-1px}
    .top-actions{display:flex;gap:8px}
    .circle{
      height:39px;width:39px;display:grid;place-items:center;
      border:1px solid #fff;background:#ffffffbd;border-radius:14px;
      color:var(--purple);box-shadow:0 4px 15px #5724a312
    }
    .circle svg{width:19px;height:19px}
    .intro{margin:4px 0 13px;color:var(--muted);font-size:11px}
    .search{
      height:42px;border:1px solid #fff;background:#ffffffb8;
      border-radius:14px;display:flex;align-items:center;padding:0 13px;
      gap:8px;box-shadow:0 4px 14px #5724a30a
    }
    .search svg{width:18px;height:18px;color:#8a72a2;flex-shrink:0}
    .search input{
      width:100%;background:none;border:0;outline:0;
      font-size:12px;color:var(--ink)
    }
    .search input::placeholder{color:#a594b3}
    .chips{
      display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;
      padding:13px 20px;margin:0 -20px
    }
    .chips::-webkit-scrollbar{display:none}
    .chip{
      flex-shrink:0;border:1px solid #ffffffdd;background:#ffffffa8;
      border-radius:30px;padding:9px 13px;color:#6e597f;
      font-size:11px;font-weight:800
    }
    .chip.active{
      background:var(--grad);color:white;border-color:transparent;
      box-shadow:0 5px 14px #5724a32e
    }

    /* MAP */
    .map-wrap{
      position:relative;flex:1;min-height:0;margin:0 12px 12px;
      border-radius:23px;overflow:hidden;border:2px solid #fff;
      box-shadow:0 8px 28px #5724a31a;background:#f5f1e9
    }
    .map{height:100%;width:100%;z-index:1}
    .leaflet-container{font-family:var(--sans);background:#f5f1e9}
    .leaflet-control-attribution{font-size:8px!important}
    .leaflet-control-zoom{
      border:0!important;box-shadow:0 3px 12px #36204b20!important
    }
    .leaflet-control-zoom a{color:var(--purple)!important}
    .leaflet-marker-pane{z-index:650!important}
    .leaflet-control-container .leaflet-bottom{bottom:4px}
    .map-top{
      position:absolute;z-index:410;top:13px;left:12px;right:12px;
      display:flex;justify-content:space-between;align-items:flex-start;
      pointer-events:none
    }
    .map-label{
      background:#ffffffec;border-radius:12px;padding:8px 10px;
      box-shadow:0 3px 12px #33204622;font-size:10px;
      font-weight:800;color:var(--purple)
    }
    .map-tools{display:flex;flex-direction:column;gap:8px;pointer-events:auto}
    .map-tool{
      width:37px;height:37px;border:0;border-radius:13px;
      background:#fffffff2;color:var(--purple);
      box-shadow:0 4px 14px #33204625;display:grid;place-items:center
    }
    .map-tool svg{width:19px;height:19px}

    /* PINS */
    .terooka-pin{
      background:transparent!important;border:0!important;
      filter:drop-shadow(0 4px 5px rgba(35,15,64,.55))
    }
    .terooka-pin svg{display:block;width:52px;height:62px;overflow:visible}
    .terooka-pin.is-selected{
      filter:drop-shadow(0 0 8px #d842a0)
      drop-shadow(0 3px 5px #30133d)
    }
    .terooka-pin.is-selected svg{
      transform:scale(1.12);
      transform-origin:50% 90%;
    }

    /* PREVIEW CARD */
    .preview{
      position:absolute;z-index:500;bottom:14px;left:20px;right:20px;
      background:#fff;border-radius:19px;padding:11px 14px;
      box-shadow:0 8px 30px #30144836;
      display:none;gap:10px;align-items:stretch;
      overflow:visible
    }
    .preview.show{display:flex}
    .preview-image{
      width:83px;min-width:83px;min-height:109px;
      border-radius:13px;object-fit:cover;
      background:linear-gradient(130deg,#d7b4ef,#f6bfd9)
    }
    .preview-main{
      min-width:0;flex:1;display:flex;flex-direction:column;gap:4px
    }
    .preview-category{
      font-size:9px;font-weight:800;letter-spacing:.09em;
      color:var(--pink);text-transform:uppercase
    }
    .preview-title{
      font:600 15px var(--serif);line-height:1.18;
      margin:0;padding-right:17px
    }
    .preview-location{font-size:10px;color:var(--muted);line-height:1.35}
    .rating{display:flex;align-items:center;gap:4px;font-size:10px;color:var(--muted)}
    .rating strong{color:var(--ink)}
    .rating .star{color:#f0ac30;font-size:14px}
    .preview-actions{display:flex;gap:6px;margin-top:auto}
    .small-btn{
      border:0;border-radius:10px;padding:8px;
      background:var(--grad);color:white;font-size:10px;
      font-weight:800;flex:1
    }
    .save-btn{
      width:32px;border:1px solid #ecdaf4;border-radius:10px;
      background:#f9f0ff;color:var(--purple);font-size:16px
    }
    .close-preview{
      position:absolute;right:9px;top:8px;background:none;
      border:0;color:#9684a6;font-size:20px;line-height:1
    }

    /* ARROWS ON LEFT AND RIGHT SIDES */
    .preview-switch{
      position:absolute;inset:0;pointer-events:none;
    }
    .preview-switch button{
      position:absolute;top:50%;transform:translateY(-50%);
      width:32px;height:43px;display:grid;place-items:center;
      border:1px solid #e9d8f2;background:#fff;
      color:var(--purple);border-radius:12px;
      box-shadow:0 4px 14px #30144835;
      pointer-events:auto;z-index:3
    }
    .preview-switch button svg{width:18px;height:18px}
    #prev-place{left:-17px}
    #next-place{right:-17px}
    #preview-position{display:none}

    .map-hint{
      position:absolute;bottom:15px;left:50%;
      transform:translateX(-50%);z-index:400;white-space:nowrap;
      border-radius:20px;background:#ffffffef;padding:9px 12px;
      color:#715a85;font-size:10px;box-shadow:0 3px 13px #0002
    }
    .map-hint.hidden{display:none}
    .empty-map{
      position:absolute;z-index:450;top:50%;left:16px;right:16px;
      transform:translateY(-50%);background:#fffffff2;
      padding:20px;text-align:center;border-radius:18px;
      display:none;font-size:12px;color:var(--muted)
    }
    .empty-map.show{display:block}

    /* BOTTOM NAVBAR */
    .nav{
      height:66px;margin:0 16px 22px;flex-shrink:0;
      background:rgba(255,255,255,.62);
      border:1px solid rgba(255,255,255,.9);
      border-radius:24px;display:grid;
      grid-template-columns:repeat(5,1fr);
      padding:6px;gap:2px;
      box-shadow:0 14px 34px rgba(87,36,163,.16);
      backdrop-filter:blur(24px)
    }
    .nav a{
      display:flex;flex-direction:column;align-items:center;
      justify-content:center;gap:3px;text-decoration:none;
      color:#9886ab;font-size:9px;font-weight:700;
      border-radius:18px
    }
    .nav a.active{background:rgba(216,66,160,.10);color:var(--purple)}
    .nav svg{
      height:21px;width:21px;stroke:currentColor;fill:none;
      stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round
    }
    .nav a.camera-link svg{width:23px;height:23px}

    /* SHEETS */
    .overlay{
      position:absolute;inset:0;z-index:1000;background:#2b164d77;
      display:none;align-items:flex-end
    }
    .overlay.open{display:flex}
    .sheet{
      width:100%;max-height:85%;overflow-y:auto;
      background:linear-gradient(165deg,#fbf3ff,#fff9f6);
      border-radius:28px 28px 0 0;padding:13px 23px 36px;
      box-shadow:0 -10px 35px #25113c30
    }
    .grab{
      width:42px;height:4px;background:#d5c1e4;
      border-radius:8px;margin:0 auto 15px
    }
    .sheet-head{
      display:flex;align-items:center;justify-content:space-between;gap:10px
    }
    .sheet h2{font:600 25px var(--serif);margin:0 0 5px}
    .sheet p{font-size:12px;line-height:1.65;color:var(--muted)}
    .sheet .close{
      border:0;background:#efe1f6;color:var(--purple);
      border-radius:10px;height:31px;width:31px;font-size:19px
    }
    .filter-label{
      font-size:11px;font-weight:800;display:block;margin:19px 0 9px
    }
    .filter-options{display:flex;gap:7px;flex-wrap:wrap}
    .filter-opt{
      border:1px solid #e8d8f2;background:white;border-radius:20px;
      padding:9px 13px;color:#675279;font-size:11px;font-weight:700
    }
    .filter-opt.on{
      background:var(--purple);color:white;border-color:var(--purple)
    }
    .sheet select,.sheet textarea{
      width:100%;border:1px solid #e6d4f0;border-radius:13px;
      padding:12px;background:white;color:var(--ink);font:12px var(--sans)
    }
    .sheet textarea{min-height:72px;resize:vertical}
    .primary{
      background:var(--grad);border:0;border-radius:14px;color:#fff;
      font-weight:800;font-size:12px;width:100%;padding:15px;margin-top:16px
    }
    .secondary{
      background:#f0e3f7;color:var(--purple);border:0;
      border-radius:13px;padding:12px;font-size:11px;font-weight:800
    }
    .detail-photo{
      height:148px;width:100%;object-fit:cover;
      border-radius:17px;margin:9px 0
    }
    .detail-category{
      font-size:10px;color:var(--pink);font-weight:800;
      letter-spacing:.1em;text-transform:uppercase
    }
    .nearby-list,.review-list{
      display:flex;flex-direction:column;gap:8px
    }
    .nearby-row{
      width:100%;text-align:left;display:flex;justify-content:space-between;
      align-items:center;gap:8px;padding:12px;background:white;
      border:1px solid #f0e5f4;border-radius:12px;color:var(--ink)
    }
    .nearby-row span{font-size:11px;font-weight:700}
    .nearby-row small{color:var(--muted);font-size:10px}
    .review{padding:10px;background:white;border-radius:12px}
    .review b{font-size:11px}
    .review p{margin:4px 0 0}
    .stars-picker{display:flex;gap:8px}
    .stars-picker button{
      background:none;border:0;color:#c8b9ce;font-size:29px;padding:2px
    }
    .stars-picker button.on{color:#f0ac30}
    .toast{
      position:absolute;z-index:1100;top:54px;left:50%;
      transform:translateX(-50%);background:#32204b;color:#fff;
      border-radius:12px;padding:10px 13px;font-size:11px;
      display:none;max-width:85%;text-align:center
    }
    .toast.show{display:block}

    @media(max-width:500px){
      body{display:block;overflow:auto}
      .stage,.phone{width:100%;height:100dvh;transform:none!important}
      .phone{padding:0;border-radius:0;box-shadow:none}
      .screen{height:100%;width:100%;border-radius:0}
      .island,.status,.homebar{display:none}
      .app{padding-top:27px}
      .nav{margin-bottom:13px}
      .map-wrap{margin-bottom:10px}
    }
    @media(max-height:720px){
      .intro{display:none}
      .chips{padding:8px 20px}
      .nav{height:61px}
    }
  </style>
</head>

<body>
<div class="stage" id="stage">
  <div class="phone">
    <div class="screen">

      <div class="island"></div>
      <div class="status">
        <span>9:41</span>
        <span class="status-icons">▂▅ ▰ ◼</span>
      </div>

      <div class="app">

        <header class="header">
          <div class="top">
            <h1>Discover</h1>

            <div class="top-actions">
              <button class="circle" id="locate" aria-label="Find my location">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="7"/>
                  <circle cx="12" cy="12" r="2"/>
                  <path d="M12 1v4m0 14v4M1 12h4m14 0h4"/>
                </svg>
              </button>

              <button class="circle" id="filter-open" aria-label="Advanced filters">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M4 7h16M4 12h16M4 17h16"/>
                  <circle cx="9" cy="7" r="2" fill="#fff"/>
                  <circle cx="16" cy="12" r="2" fill="#fff"/>
                  <circle cx="11" cy="17" r="2" fill="#fff"/>
                </svg>
              </button>
            </div>
          </div>

          <p class="intro">Tap a pin to uncover the stories around you.</p>

          <label class="search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"/>
              <path d="m20 20-3.5-3.5"/>
            </svg>
            <input id="search" type="search" placeholder="Search places, food, crafts...">
          </label>

          <div class="chips" id="chips"></div>
        </header>

        <!-- MAP -->
        <div class="map-wrap">

          <div id="map" class="map"></div>

          <div class="map-top">
            <div class="map-label" id="map-label">
              Kuching, Sarawak · Cultural places
            </div>

            <div class="map-tools">
              <button class="map-tool" id="reset-view" title="Reset map">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="8"/>
                  <path d="M12 2v4m0 12v4M2 12h4m12 0h4"/>
                </svg>
              </button>
            </div>
          </div>

          <div class="map-hint" id="map-hint">
            Tap a coloured pin to explore
          </div>

          <div class="empty-map" id="empty-map">
            No places match these filters.
          </div>

          <!-- PLACE PREVIEW -->
          <div class="preview" id="preview">

            <img class="preview-image" id="preview-image" alt="Place photograph">

            <div class="preview-main">
              <div class="preview-category" id="preview-category"></div>
              <h3 class="preview-title" id="preview-title"></h3>
              <div class="preview-location" id="preview-location"></div>
              <div class="rating" id="preview-rating"></div>

              <div class="preview-actions">
                <button class="small-btn" id="explore">Explore Place</button>
                <button class="save-btn" id="save" aria-label="Save place">♡</button>
              </div>
            </div>

            <button class="close-preview" id="close-preview" aria-label="Close preview">
              ×
            </button>

            <!-- SIDE ARROWS -->
            <div class="preview-switch">

              <button id="prev-place" type="button" aria-label="Previous place">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="m15 18-6-6 6-6"/>
                </svg>
              </button>

              <span id="preview-position">1 / 8</span>

              <button id="next-place" type="button" aria-label="Next place">
                <svg viewBox="0 0 24 24" fill="none"
                     stroke="currentColor" stroke-width="2.5"
                     stroke-linecap="round" stroke-linejoin="round">
                  <path d="m9 18 6-6-6-6"/>
                </svg>
              </button>

            </div>
          </div>

        </div>

        <!-- NAVBAR -->
        <nav class="nav" aria-label="Main navigation">

          <a href="home.html">
            <svg viewBox="0 0 24 24">
              <path d="m3 11 9-8 9 8M5 10v10h14V10"/>
            </svg>
            Home
          </a>

          <a href="discover.html" class="active" aria-current="page">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="9"/>
              <path d="m15 9-2 4-4 2 2-4z"/>
            </svg>
            Discover
          </a>

          <a href="camera.html" class="camera-link">
            <svg viewBox="0 0 24 24">
              <rect x="3" y="6" width="18" height="15" rx="3"/>
              <circle cx="12" cy="13.5" r="3.5"/>
              <path d="M8 6l1.5-3h5L16 6"/>
            </svg>
            Camera
          </a>

          <a href="journal.html">
            <svg viewBox="0 0 24 24">
              <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5Z"/>
              <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/>
            </svg>
            Journal
          </a>

          <a href="profile.html">
            <svg viewBox="0 0 24 24">
              <circle cx="12" cy="8" r="4"/>
              <path d="M4 21c0-5 16-5 16 0"/>
            </svg>
            Profile
          </a>

        </nav>
      </div>

      <div class="overlay" id="overlay">
        <div class="sheet" id="sheet"></div>
      </div>

      <div class="toast" id="toast"></div>
      <div class="homebar"></div>

    </div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
  (function(){
    'use strict';

    const $ = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));

    let session = null;
    try {
      session = JSON.parse(localStorage.getItem('terooka_session'));
    } catch(e) {}

    /* Demo can run without login */
    const uid = session?.username || session?.email || 'guest';
    const savedKey = 'terooka_saved_places_' + uid;
    const reviewKey = 'terooka_reviews_' + uid;

    function load(key, fallback) {
      try {
        return JSON.parse(localStorage.getItem(key)) ?? fallback;
      } catch(e) {
        return fallback;
      }
    }

    let saved = load(savedKey, []);
    let reviews = load(reviewKey, {});

    function persist(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch(e) {
        toast('Unable to save to browser storage');
      }
    }

    /*
      DEMO LOCATIONS:
      These venues and pin coordinates are illustrative.
      They are not verified real businesses.
    */
    const places = [
      {
        id:'riverstory',
        name:'Riverfront Heritage Walk',
        city:'Kuching',cat:'Heritage',
        lat:1.5583,lng:110.3477,
        desc:'Cultural walking experience inspired by Sarawak riverside history.',
        photo:'img/sarawak-riverfront.jpg'
      },
      {
        id:'laksa',
        name:'Rasa Sarawak Kitchen',
        city:'Kuching',cat:'Food',
        lat:1.5547,lng:110.3532,
        desc:'Food stop inspired by Sarawak laksa and local culinary traditions.',
        photo:'img/sarawak-food.jpg'
      },
      {
        id:'beads',
        name:'Borneo Bead Studio',
        city:'Kuching',cat:'Crafts',
        lat:1.5625,lng:110.3445,
        desc:'Hands-on beadwork workshop inspired by Sarawak craft traditions.',
        photo:'img/sarawak-beads.jpg'
      },
      {
        id:'culturehouse',
        name:'Stories of Borneo Gallery',
        city:'Kuching',cat:'Museum',
        lat:1.5505,lng:110.3490,
        desc:'Gallery concept featuring cultural stories, music and traditional objects.',
        photo:'img/sarawak-gallery.jpg'
      },
      {
        id:'weaving',
        name:'Anyaman Heritage Workshop',
        city:'Kuching',cat:'Crafts',
        lat:1.5573,lng:110.3587,
        desc:'Weaving experience inspired by Sarawak handicrafts.',
        photo:'img/sarawak-weaving.jpg'
      },
      {
        id:'keklapis',
        name:'Kek Lapis Corner',
        city:'Kuching',cat:'Food',
        lat:1.5514,lng:110.3436,
        desc:'Stop highlighting Sarawak layered cake traditions.',
        photo:'img/sarawak-kek-lapis.jpg'
      },
      {
        id:'baucraft',
        name:'Bau Heritage Craft House',
        city:'Bau',cat:'Crafts',
        lat:1.4166,lng:110.1551,
        desc:'Cultural craft experience in the Bau area.',
        photo:'img/sarawak-bau.jpg'
      },
      {
        id:'serian',
        name:'Serian Cultural Stories',
        city:'Serian',cat:'Heritage',
        lat:1.1737,lng:110.5681,
        desc:'Storytelling stop inspired by the cultural diversity of Serian.',
        photo:'img/sarawak-serian.jpg'
      }
    ];

    const cats = ['All Places','Heritage','Food','Crafts','Museum'];

    const colors = {
      Heritage:'#8a49c6',
      Food:'#e46b94',
      Crafts:'#ed9b45',
      Museum:'#4b9e95'
    };

    const symbols = {
      Heritage:'H',
      Food:'F',
      Crafts:'C',
      Museum:'M'
    };

    let category = 'All Places';
    let minRating = 0;
    let city = 'All';
    let onlySaved = false;
    let query = '';
    let selected = null;
    let userMarker = null;
    let map;
    let markers = [];

    const mapStart = [1.557,110.35];

    function toast(message) {
      $('#toast').textContent = message;
      $('#toast').classList.add('show');

      setTimeout(() => {
        $('#toast').classList.remove('show');
      }, 2300);
    }

    function ratingFor(p) {
      const r = reviews[p.id] || [];

      return {
        count:r.length,
        avg:r.length
          ? r.reduce((a,b) => a+b.stars,0)/r.length
          : null
      };
    }

    function ratingHTML(p) {
      const r = ratingFor(p);

      return r.count
        ? '<span class="star">★</span><strong>' +
        r.avg.toFixed(1) + '</strong><span>(' +
        r.count + ' reviews)</span>'
        : '<span class="star">☆</span><span>No reviews yet</span>';
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, c => ({
        '&':'&amp;',
        '<':'&lt;',
        '>':'&gt;',
        '"':'&quot;',
        "'":'&#39;'
      }[c]));
    }

    function filtered() {
      return places.filter(p =>
        (category === 'All Places' || p.cat === category) &&
        (city === 'All' || p.city === city) &&
        (!onlySaved || saved.includes(p.id)) &&
        (!minRating || (
          ratingFor(p).avg !== null &&
          ratingFor(p).avg >= minRating
        )) &&
        (!query || (
          p.name+' '+p.city+' '+p.cat+' '+p.desc
        ).toLowerCase().includes(query))
      );
    }

    function renderChips() {
      const root = $('#chips');
      root.innerHTML = '';

      cats.forEach(c => {
        const button = document.createElement('button');
        button.className = 'chip' + (category === c ? ' active' : '');
        button.textContent = c;

        button.onclick = () => {
          category = c;
          renderChips();
          updatePins();
        };

        root.appendChild(button);
      });
    }

    /* MAP PINS */

    function markerIcon(p, active) {
      const color = colors[p.cat] || '#5724a3';

      const svg = `
    <svg xmlns="http://www.w3.org/2000/svg"
         width="52" height="62" viewBox="0 0 52 62">
      <path
        d="M26 3C13 3 4 13 4 26c0 17 22 33 22 33s22-16 22-33C48 13 39 3 26 3Z"
        fill="${color}" stroke="white" stroke-width="4"/>
      <circle cx="26" cy="25" r="12" fill="white"/>
      <circle cx="26" cy="25" r="6" fill="${color}"/>
    </svg>
  `;

      return L.divIcon({
        className:'terooka-pin' + (active ? ' is-selected' : ''),
        html:svg,
        iconSize:[52,62],
        iconAnchor:[26,59]
      });
    }

    function updatePins() {
      if (!map) return;

      markers.forEach(marker => map.removeLayer(marker));
      markers = [];

      const matches = filtered();

      $('#empty-map').classList.toggle('show', matches.length === 0);

      if (selected && !matches.some(p => p.id === selected.id)) {
        selected = null;
        $('#preview').classList.remove('show');
        $('#map-hint').classList.remove('hidden');
      }

      matches.forEach(p => {
        const active = selected?.id === p.id;

        const marker = L.marker(
          [p.lat,p.lng],
          {
            icon:markerIcon(p,active),
            zIndexOffset:active ? 1000 : 0
          }
        ).addTo(map);

        marker.on('click', () => showPreview(p,true));

        markers.push(marker);
      });

      $('#map-label').textContent =
        (city === 'All' ? 'Kuching, Sarawak' : city+', Sarawak') +
        ' · ' + matches.length + ' places';
    }

    /* PREVIEW AND ARROW NAVIGATION */

    function cyclePreview(direction) {
      const matches = filtered();
      if (!matches.length) return;

      const current = selected
        ? matches.findIndex(p => p.id === selected.id)
        : -1;

      const next = (current + direction + matches.length) % matches.length;

      showPreview(matches[next],true);
    }

    function closePreview() {
      selected = null;

      $('#preview').classList.remove('show');
      $('#map-hint').classList.remove('hidden');

      updatePins();
    }

    function showPreview(p,moveMap=true) {
      selected = p;

      $('#preview-category').textContent = p.cat;
      $('#preview-title').textContent = p.name;
      $('#preview-location').textContent = p.city+', Sarawak';
      $('#preview-rating').innerHTML = ratingHTML(p);

      $('#preview-image').src = p.photo;

      $('#preview-image').onerror = function() {
        this.onerror = null;

        this.src = 'data:image/svg+xml,' + encodeURIComponent(
          '<svg xmlns="http://www.w3.org/2000/svg" width="220" height="220">' +
          '<rect width="220" height="220" fill="#e8d5f3"/>' +
          '<text x="110" y="125" font-size="60" text-anchor="middle" fill="#5724a3">' +
          (symbols[p.cat] || 'P') +
          '</text></svg>'
        );
      };

      $('#save').textContent =
        saved.includes(p.id) ? '♥' : '♡';

      $('#save').setAttribute(
        'aria-label',
        saved.includes(p.id)
          ? 'Remove saved place'
          : 'Save place'
      );

      $('#preview').classList.add('show');
      $('#map-hint').classList.add('hidden');

      const matches = filtered();
      const index = matches.findIndex(place => place.id === p.id);

      $('#preview-position').textContent =
        (index+1)+' / '+matches.length;

      updatePins();

      /* Automatically focus map on selected pin */
      if (moveMap && map) {
        map.stop();

        const zoom = p.city === 'Kuching' ? 14 : 12;

        map.flyTo(
          [p.lat,p.lng],
          zoom,
          {
            animate:true,
            duration:0.85
          }
        );
      }
    }

    /* BOTTOM SHEETS */

    function openSheet(html) {
      $('#sheet').innerHTML =
        '<div class="grab"></div>' + html;

      $('#overlay').classList.add('open');
    }

    function closeSheet() {
      $('#overlay').classList.remove('open');
    }

    function distance(a,b) {
      const R = 6371;
      const rad = n => n*Math.PI/180;

      const dLat = rad(b.lat-a.lat);
      const dLon = rad(b.lng-a.lng);

      const x =
        Math.sin(dLat/2)**2 +
        Math.cos(rad(a.lat))*Math.cos(rad(b.lat)) *
        Math.sin(dLon/2)**2;

      return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
    }

    function openDetails(p) {
      const r = ratingFor(p);

      const nearby = places
        .filter(x => x.id !== p.id && x.city === p.city)
        .map(x => ({p:x,d:distance(p,x)}))
        .sort((a,b) => a.d-b.d)
        .slice(0,3);

      openSheet(`
    <div class="sheet-head">
      <h2>${escapeHTML(p.name)}</h2>
      <button class="close" id="sheet-close">×</button>
    </div>

    <div class="detail-category">${escapeHTML(p.cat)}</div>

    <img class="detail-photo"
         id="detail-photo"
         src="${escapeHTML(p.photo)}"
         alt="Place photograph">

    <div class="rating">${ratingHTML(p)}</div>

    <p>${escapeHTML(p.desc)}</p>

    <p style="font-size:10px">
      Prototype venue · Illustrative location
    </p>

    <h2 style="font-size:19px;margin-top:17px">Nearby Places</h2>

    <div class="nearby-list">
      ${nearby.map(x => `
        <button class="nearby-row" data-near="${x.p.id}">
          <span>${escapeHTML(x.p.name)}</span>
          <small>${x.d.toFixed(1)} km</small>
        </button>
      `).join('')}
    </div>

    <h2 style="font-size:19px;margin-top:19px">Visitor Reviews</h2>

    <div class="review-list">
      ${
        r.count
          ? (reviews[p.id]||[]).map(x => `
              <div class="review">
                <b>★ ${x.stars}/5 · ${escapeHTML(x.name)}</b>
                <p>${escapeHTML(x.text || 'Rating only')}</p>
              </div>
            `).join('')
          : '<p>No reviews yet. Be the first to share your experience!</p>'
      }
    </div>

    <button class="primary" id="write-review">
      Write a Review
    </button>
  `);

      $('#sheet-close').onclick = closeSheet;

      $('#detail-photo').onerror = function() {
        this.style.display = 'none';
      };

      $$('[data-near]').forEach(button => {
        button.onclick = () => {
          const next = places.find(x => x.id === button.dataset.near);
          closeSheet();
          if(next) showPreview(next,true);
        };
      });

      $('#write-review').onclick = () => openReview(p);
    }

    function openReview(p) {
      let stars = 0;

      openSheet(`
    <div class="sheet-head">
      <h2>Review this place</h2>
      <button class="close" id="sheet-close">×</button>
    </div>

    <p>${escapeHTML(p.name)}</p>

    <label class="filter-label">Your rating</label>
    <div class="stars-picker" id="stars">
      ${[1,2,3,4,5].map(n => `
        <button data-star="${n}">★</button>
      `).join('')}
    </div>

    <label class="filter-label">Your experience</label>
    <textarea id="review-text"
              maxlength="500"
              placeholder="What did you enjoy?"></textarea>

    <button class="primary" id="submit-review">
      Submit Review
    </button>

    <p style="font-size:10px">
      Reviews are stored locally for prototype testing.
    </p>
  `);

      $('#sheet-close').onclick = closeSheet;

      $$('[data-star]').forEach(button => {
        button.onclick = () => {
          stars = Number(button.dataset.star);

          $$('[data-star]').forEach(item => {
            item.classList.toggle(
              'on',
              Number(item.dataset.star) <= stars
            );
          });
        };
      });

      $('#submit-review').onclick = () => {
        if(!stars) {
          toast('Choose a star rating first');
          return;
        }

        if(!reviews[p.id]) reviews[p.id] = [];

        reviews[p.id].push({
          stars,
          name:session?.name || session?.username || 'Explorer',
          text:$('#review-text').value.trim()
        });

        persist(reviewKey,reviews);
        showPreview(p,false);
        openDetails(p);
        toast('Review saved!');
      };
    }

    /* FILTERS */

    function openFilters() {
      openSheet(`
    <div class="sheet-head">
      <h2>Filter Discoveries</h2>
      <button class="close" id="sheet-close">×</button>
    </div>

    <p>Choose what you want to see on the map.</p>

    <label class="filter-label">Destination</label>

    <select id="city-select">
      <option value="All">All Sarawak places</option>
      <option value="Kuching">Kuching</option>
      <option value="Bau">Bau</option>
      <option value="Serian">Serian</option>
    </select>

    <label class="filter-label">Minimum visitor rating</label>

    <div class="filter-options" id="rating-options">
      ${[0,3,4,4.5].map(n => `
        <button class="filter-opt ${minRating===n?'on':''}"
                data-rating="${n}">
          ${n===0?'Any rating':n+'★ & up'}
        </button>
      `).join('')}
    </div>

    <label class="filter-label">Saved places</label>

    <div class="filter-options">
      <button class="filter-opt ${onlySaved?'on':''}"
              id="saved-filter">
        ♡ Saved only
      </button>
    </div>

    <button class="primary" id="apply-filters">
      Apply Filters
    </button>

    <button class="secondary"
            style="width:100%;margin-top:9px"
            id="clear-filters">
      Clear Filters
    </button>
  `);

      $('#city-select').value = city;
      $('#sheet-close').onclick = closeSheet;

      let tempRating = minRating;
      let tempSaved = onlySaved;

      $$('[data-rating]').forEach(button => {
        button.onclick = () => {
          tempRating = Number(button.dataset.rating);

          $$('[data-rating]').forEach(item => {
            item.classList.toggle(
              'on',
              Number(item.dataset.rating) === tempRating
            );
          });
        };
      });

      $('#saved-filter').onclick = () => {
        tempSaved = !tempSaved;
        $('#saved-filter').classList.toggle('on',tempSaved);
      };

      $('#apply-filters').onclick = () => {
        city = $('#city-select').value;
        minRating = tempRating;
        onlySaved = tempSaved;

        closeSheet();
        updatePins();

        if(city !== 'All') {
          const target = places.find(p => p.city === city);

          if(target) {
            map.flyTo(
              [target.lat,target.lng],
              city === 'Kuching' ? 14 : 12,
              {duration:0.8}
            );
          }
        } else {
          map.flyTo(mapStart,13,{duration:0.8});
        }
      };

      $('#clear-filters').onclick = () => {
        city = 'All';
        minRating = 0;
        onlySaved = false;
        category = 'All Places';
        query = '';

        $('#search').value = '';

        renderChips();
        closeSheet();
        updatePins();

        map.flyTo(mapStart,13,{duration:0.8});
      };
    }

    /* MAP INITIALISATION */

    function init() {
      renderChips();

      if(typeof L === 'undefined') {
        $('#map').innerHTML =
          '<p style="padding:30px">Map library could not load. Please connect to the internet.</p>';
        return;
      }

      map = L.map('map',{
        zoomControl:false,
        preferCanvas:true
      }).setView(mapStart,13);

      /* Illustrated prototype map */
      const svgMap = `
  <svg xmlns="http://www.w3.org/2000/svg"
       width="1200" height="1100"
       viewBox="0 0 1200 1100">

    <rect width="1200" height="1100" fill="#f5f1e9"/>

    <g fill="#e0eddb" opacity=".95">
      <path d="M0 0H520L435 290 170 330 0 240Z"/>
      <path d="M850 0h350v360l-245-85-125-150Z"/>
      <path d="M0 730l245-85 240 145-65 310H0Z"/>
      <path d="M780 720l420-125v505H925Z"/>
    </g>

    <g fill="none" stroke="#fff"
       stroke-linecap="round" stroke-linejoin="round">
      <path stroke-width="29"
            d="M-30 350Q240 300 440 415T890 405 1250 285"/>
      <path stroke-width="25"
            d="M125 1120Q260 815 440 630T785 120 -10"/>
      <path stroke-width="22"
            d="M-30 860Q360 780 620 720T1230 865"/>
      <path stroke-width="18"
            d="M800 -50Q710 290 805 550T1040 1140"/>
      <path stroke-width="17"
            d="M-40 165Q245 225 405 135T825 95 1240 155"/>
    </g>

    <path
      d="M-60 530Q170 405 370 500T700 535 1260 435"
      fill="none" stroke="#c1e3ec"
      stroke-width="82" stroke-linecap="round"/>

    <path
      d="M-60 530Q170 405 370 500T700 535 1260 435"
      fill="none" stroke="#a9d8e5"
      stroke-width="55" stroke-linecap="round"/>

    <g font-family="Arial" fill="#8c8193"
       font-weight="700" letter-spacing="3">
      <text x="420" y="290" font-size="24">KUCHING</text>
      <text x="95" y="690" font-size="17">HERITAGE DISTRICT</text>
      <text x="830" y="705" font-size="18">CULTURAL QUARTER</text>
      <text x="440" y="565" font-size="16"
            fill="#5f9db0">SARAWAK RIVER</text>
    </g>

    <g font-family="Arial" fill="#a99bae" font-size="14">
      <text x="125" y="295">Craft Lane</text>
      <text x="760" y="340">Museum Walk</text>
      <text x="515" y="890">Market Street</text>
    </g>

  </svg>`;

      const mapImage =
        'data:image/svg+xml;charset=utf-8,' +
        encodeURIComponent(svgMap);

      L.imageOverlay(
        mapImage,
        [[1.05,110.05],[1.72,110.75]],
        {interactive:false,opacity:1}
      ).addTo(map);

      L.control.zoom({position:'bottomright'}).addTo(map);

      updatePins();

      const first = filtered()[0];

      if(first) {
        showPreview(first,false);
      }

      [200,850,1800].forEach(delay => {
        setTimeout(() => {
          map.invalidateSize({pan:false});
        },delay);
      });
    }

    /* EVENT LISTENERS */

    $('#search').addEventListener('input',event => {
      query = event.target.value.trim().toLowerCase();
      updatePins();
    });

    $('#filter-open').onclick = openFilters;
    $('#close-preview').onclick = closePreview;

    $('#prev-place').onclick = () => cyclePreview(-1);
    $('#next-place').onclick = () => cyclePreview(1);

    $('#explore').onclick = () => {
      if(!selected) return;

      location.href =
        'place.html?id=' + encodeURIComponent(selected.id);
    };

    $('#save').onclick = () => {
      if(!selected) return;

      const index = saved.indexOf(selected.id);

      if(index < 0) {
        saved.push(selected.id);
      } else {
        saved.splice(index,1);
      }

      persist(savedKey,saved);
      showPreview(selected,false);

      toast(index < 0 ? 'Place saved!' : 'Removed from saved places');
    };

    $('#reset-view').onclick = () => {
      map.flyTo(mapStart,13,{duration:0.8});
      toast('Map centred on Kuching');
    };

    $('#overlay').onclick = event => {
      if(event.target === $('#overlay')) closeSheet();
    };

    $('#locate').onclick = () => {
      if(!navigator.geolocation) {
        toast('Location is not supported');
        return;
      }

      navigator.geolocation.getCurrentPosition(
        position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;

          if(userMarker) map.removeLayer(userMarker);

          userMarker = L.circleMarker([lat,lng],{
            radius:9,
            color:'#fff',
            weight:3,
            fillColor:'#3885ef',
            fillOpacity:1
          }).addTo(map).bindPopup('You are here');

          map.flyTo([lat,lng],14,{duration:0.8});
          userMarker.openPopup();
        },
        () => toast('Allow location access to find your position'),
        {enableHighAccuracy:false,timeout:10000}
      );
    };

    /* RESPONSIVE PHONE */

    const stage = $('#stage');

    function fit() {
      if(innerWidth <= 500) {
        stage.style.transform = '';
        return;
      }

      const scale = Math.min(
        1,
        (innerWidth-28)/414,
        (innerHeight-28)/868
      );

      stage.style.transform = 'scale('+scale+')';
    }

    fit();

    addEventListener('resize',() => {
      fit();

      if(map) {
        requestAnimationFrame(() => {
          map.invalidateSize({pan:false});
        });
      }
    });

    init();

  })();
</script>
</body>
</html>
