<!doctype html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Terooka | Scan QR</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--purple:#5724a3;--pink:#d842a0;--ink:#32204b;--gradient:linear-gradient(115deg,#5724a3,#a448b7,#d842a0)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:'Plus Jakarta Sans',sans-serif}body{background:#ede4f5;display:grid;place-items:center}button{font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #ffc6ef;outline-offset:3px}.stage{position:relative;width:414px;height:868px;transform-origin:center center;flex-shrink:0}.phone{position:absolute;inset:0;padding:12px;background:#111015;border-radius:62px;box-shadow:0 24px 70px #3619583b,0 0 0 2px #343039}.phone:before,.phone:after{content:'';position:absolute;left:-5px;width:4px;background:#302b35;border-radius:4px}.phone:before{top:155px;height:52px}.phone:after{top:228px;height:69px}.screen{position:relative;width:100%;height:100%;border-radius:50px;overflow:hidden;background:#23152f;color:#fff}.island{position:absolute;z-index:30;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:30px;background:#08070a}.status{position:absolute;z-index:29;top:18px;left:34px;right:30px;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800;pointer-events:none}.homebar{position:absolute;z-index:30;bottom:8px;left:50%;transform:translateX(-50%);width:126px;height:5px;border-radius:20px;background:#fffe}.scene{position:absolute;inset:0;background:#39254d}.scene img{width:100%;height:100%;object-fit:cover}.scene:after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,#180d2888,transparent 29%,transparent 54%,#1a0c2cbd)}.top{position:absolute;z-index:8;top:62px;left:20px;right:20px;display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{font:600 20px 'Fraunces',serif;margin:0;text-shadow:0 2px 8px #0007}.glass{border:1px solid #ffffff65;background:#21152ca8;color:#fff;border-radius:13px;backdrop-filter:blur(12px)}.square{width:40px;height:40px;padding:0;display:grid;place-items:center}.scan-frame{position:absolute;top:48%;left:50%;transform:translate(-50%,-50%);width:244px;height:244px;border-radius:18px;background:#ffffff0b;box-shadow:0 0 0 200px #160a271c;pointer-events:none}.corner{position:absolute;width:46px;height:46px;border:4px solid #ffcfef}.tl{top:0;left:0;border-right:0;border-bottom:0;border-radius:17px 0 0 0}.tr{top:0;right:0;border-left:0;border-bottom:0;border-radius:0 17px 0 0}.bl{bottom:0;left:0;border-right:0;border-top:0;border-radius:0 0 0 17px}.br{bottom:0;right:0;border-left:0;border-top:0;border-radius:0 0 17px 0}.scan-line{position:absolute;left:16px;right:16px;top:50%;height:2px;background:#ffb8ed;box-shadow:0 0 14px #ffc5f1}.hint{position:absolute;z-index:6;left:25px;right:25px;top:177px;text-align:center;font-size:12px;line-height:1.6;font-weight:700;text-shadow:0 2px 7px #000}.caption{position:absolute;z-index:6;bottom:157px;left:24px;right:24px;text-align:center;font-size:11px;line-height:1.7;font-weight:700;text-shadow:0 2px 7px #000}.camera-actions{position:absolute;z-index:7;bottom:60px;left:0;right:0;display:flex;justify-content:center}.shutter{width:78px;height:78px;border:4px solid white;background:#ffffff3b;border-radius:50%;padding:5px;box-shadow:0 4px 22px #0007}.shutter:after{content:'';display:block;width:100%;height:100%;border-radius:50%;background:white}.dim{position:absolute;z-index:15;inset:0;background:#160a2780;opacity:0;pointer-events:none;transition:opacity .25s}.dim.open{opacity:1;pointer-events:auto}.sheet{position:absolute;z-index:16;bottom:0;left:0;right:0;max-height:75%;overflow-y:auto;overscroll-behavior:contain;background:linear-gradient(145deg,#fbf4ff,#fff8fa);color:var(--ink);border-radius:29px 29px 0 0;padding:13px 23px 34px;transform:translateY(105%);transition:transform .28s ease;box-shadow:0 -12px 35px #1b0c2c55}.sheet.open{transform:translateY(0)}.handle{height:5px;width:44px;border-radius:10px;background:#d7c5e3;margin:0 auto 18px}.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:start}.eyebrow{font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.09em;color:var(--pink)}h2{font:600 24px/1.22 'Fraunces',serif;margin:7px 0 14px}.close{width:34px;height:34px;display:flex;align-items:center;justify-content:center;padding:0;line-height:0;border:0;border-radius:10px;background:#eee1f7;color:var(--purple);font-size:23px;flex-shrink:0}.sheet p{font-size:12px;line-height:1.8;color:#6c5b79}.option{display:block;width:100%;padding:13px;margin:9px 0;border:1px solid #e8daf0;border-radius:13px;background:white;color:var(--ink);text-align:left}.option strong{display:block;font-size:12px}.option small{display:block;margin-top:5px;color:#796b85;font-size:10px}.btn{display:block;width:100%;min-height:50px;border:0;border-radius:14px;padding:12px 15px;background:var(--gradient);color:white;font-size:12px;font-weight:800;margin-top:14px}.secondary{background:white;color:var(--purple);border:1px solid #e8daf0}.stamp-preview{display:grid;place-items:center;gap:8px;padding:17px;background:#f0e4f8;border-radius:18px;text-align:center}.stamp-preview img{height:105px;max-width:130px;object-fit:contain}.stamp-preview strong{font-size:13px}.stamp-preview small{color:#796b85}.note{padding:11px 13px;background:#f0e4f8;border-radius:12px;font-size:11px;color:#64477b;line-height:1.6}.toast{position:absolute;z-index:25;top:58px;left:50%;transform:translateX(-50%);width:max-content;max-width:86%;padding:11px 14px;border-radius:12px;background:white;color:var(--purple);font-size:11px;font-weight:800;display:none;text-align:center;box-shadow:0 5px 20px #0003}
    @media(max-width:500px){html,body{width:100%;min-height:100%;overflow:hidden}body{display:block;background:#23152f}.stage,.phone{width:100%!important;height:100dvh!important;transform:none!important}.phone{position:relative;inset:auto;padding:0!important;border:0;border-radius:0;box-shadow:none;background:transparent}.phone:before,.phone:after,.island,.status,.homebar{display:none}.screen{border-radius:0}.top{top:calc(20px + env(safe-area-inset-top))}.hint{top:calc(145px + env(safe-area-inset-top))}.camera-actions{bottom:calc(28px + env(safe-area-inset-bottom))}.caption{bottom:calc(120px + env(safe-area-inset-bottom))}.sheet{padding-bottom:calc(28px + env(safe-area-inset-bottom))}.toast{top:calc(18px + env(safe-area-inset-top))}}@media(prefers-reduced-motion:reduce){.dim,.sheet{transition:none}}
    .close svg{display:block;width:20px;height:20px;flex-shrink:0}
  </style></head><body><div class="stage" id="stage"><div class="phone"><main class="screen"><div class="island"></div><div class="status"><span>9:41</span><svg width="70" height="15" viewBox="0 0 70 15" fill="none" aria-hidden="true"><g fill="white"><rect x="0" y="10" width="3" height="5" rx="1"/><rect x="5" y="7" width="3" height="8" rx="1"/><rect x="10" y="4" width="3" height="11" rx="1"/><rect x="15" y="1" width="3" height="14" rx="1"/></g><g stroke="white" stroke-width="1.8" stroke-linecap="round"><path d="M27 5Q34-1 41 5"/><path d="M30 9Q34 5 38 9"/></g><circle cx="34" cy="12" r="1.5" fill="white"/><rect x="48" y="2" width="19" height="11" rx="3" stroke="white" stroke-width="1.3"/><rect x="50" y="4" width="15" height="7" rx="1.6" fill="white"/><path d="M69 5v5" stroke="white" stroke-width="2" stroke-linecap="round"/></svg></div><div class="homebar"></div>
  <div class="scene"><img src="img/qr-demo.png" alt="Sarawak longhouse scanner demonstration"></div>
  <header class="top"><button type="button" class="glass square" id="back" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button><h1>Scan & Collect</h1><button type="button" class="glass square" id="help" aria-label="Scanner help"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9.5 9a2.5 2.5 0 1 1 4.3 1.7c-1.1 1-1.8 1.5-1.8 3M12 17h.01"/></svg></button></header>
  <p class="hint">Position the cultural QR code inside the frame</p><div class="scan-frame" aria-hidden="true"><i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i><div class="scan-line"></div></div><p class="caption">Tap the shutter to scan a QR code.</p><div class="camera-actions"><button type="button" class="shutter" id="shutter" aria-label="Simulate QR scan"></button></div>
  <div class="dim" id="dim"></div><section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="QR scanner information"><div class="handle"></div><div class="sheet-head"><div><div class="eyebrow" id="eyebrow">Scan QR</div><h2 id="sheetTitle">Choose a place</h2></div><button type="button" class="close" id="close" aria-label="Close"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div><div id="sheetBody"></div></section><div class="toast" id="toast" role="status"></div>
</main></div></div><script src="places.js"></script><script>
  (()=>{'use strict';const $=id=>document.getElementById(id);function getUid(){try{const s=JSON.parse(localStorage.getItem('terooka_session')||'null');return s?.username||s?.email||'guest'}catch{return 'guest'}}const uid=getUid(),stampKey='terooka_stamps_'+uid,journeyKey='terooka_journeys_'+uid;const demoPlaces=[{id:'weaving',name:'Anyaman Heritage Workshop',city:'Kuching, Sarawak'},{id:'beads',name:'Borneo Bead Studio',city:'Kuching, Sarawak'},{id:'riverstory',name:'Riverfront Heritage Walk',city:'Kuching, Sarawak'},{id:'laksa',name:'Rasa Sarawak Kitchen',city:'Kuching, Sarawak'}];const places=Array.isArray(window.TerookaData?.places)&&window.TerookaData.places.length?window.TerookaData.places:demoPlaces;const images={riverstory:'riverfront_heritage_walk.png',laksa:'rasa_sarawak_kitchen.png',beads:'borneo_bead_studio.png',culturehouse:'stories_of_borneo_gallery.png',weaving:'anyaman_heritage_workshop.png',keklapis:'kek_lapis_corner.png',baucraft:'bau_heritage_craft_house.png',serian:'serian_cultural_stories.png'};let chosen=null;function read(k){try{const a=JSON.parse(localStorage.getItem(k)||'[]');return Array.isArray(a)?a:[]}catch{return []}}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function active(){return read(journeyKey).find(j=>j.status==='active'||j.status==='ongoing'||j.isActive===true||(!j.status&&!j.endedAt))}function collected(id){return read(stampKey).some(s=>String(s.placeId||s.id)===String(id))}function open(title,eyebrow,body){$('sheetTitle').textContent=title;$('eyebrow').textContent=eyebrow;$('sheetBody').innerHTML=body;$('dim').classList.add('open');$('sheet').classList.add('open')}function close(){$('dim').classList.remove('open');$('sheet').classList.remove('open')}function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').style.display='none',2600)}function selection(){open('Choose a location','Prototype QR scan','<p>Select the cultural location whose QR code you are scanning. This demo simulates QR recognition.</p>'+places.map(p=>`<button type="button" class="option" data-place="${esc(p.id)}"><strong>${esc(p.name)}${collected(p.id)?' · Collected':''}</strong><small>${esc(p.city||p.location||'Sarawak')}</small></button>`).join(''))}function result(id){chosen=places.find(p=>String(p.id)===String(id));if(!chosen)return;const already=collected(id);const image=images[id];const preview=image?`<img src="img/${image}" alt="${esc(chosen.name)} stamp" onerror="this.style.display='none'">`:'<span style="font-size:38px">✦</span>';open(already?'Stamp Already Collected':'Cultural Location Found','QR scan result',`<div class="stamp-preview">${preview}<strong>${esc(chosen.name)}</strong><small>${esc(chosen.city||chosen.location||'Sarawak')}</small></div><p>${already?'You already have this digital stamp in your collection.':'You have discovered this cultural location. Collect its digital stamp to remember your visit.'}</p>${already?'':`<button type="button" class="btn" id="collect">Collect Digital Stamp</button>`}<button type="button" class="btn secondary" id="again">Scan Another QR</button>`);$('again').onclick=selection;if(!already)$('collect').onclick=collect}function collect(){if(!chosen||collected(chosen.id)){toast('Stamp already collected');return}const list=read(stampKey),j=active();list.push({placeId:chosen.id,placeName:chosen.name,city:chosen.city||chosen.location||'Sarawak',journeyId:j?.id??null,collectedAt:new Date().toISOString(),verification:'prototype-collection'});try{localStorage.setItem(stampKey,JSON.stringify(list));open('Stamp Collected!','Collection updated',`<div class="stamp-preview"><span style="font-size:43px">✦</span><strong>${esc(chosen.name)}</strong><small>${j?'Added to your active journey and stamp collection':'Added to your stamp collection'}</small></div><p>Your cultural stamp has been saved successfully.</p><button type="button" class="btn" id="done">Done</button><button type="button" class="btn secondary" id="more">Scan Another QR</button>`);$('done').onclick=close;$('more').onclick=selection}catch{toast('Unable to save stamp. Check browser storage.')}}$('shutter').onclick=selection;$('close').onclick=close;$('dim').onclick=close;$('help').onclick=()=>open('How to Scan','Scanner guide','<p>1. Visit a participating cultural attraction.<br>2. Position its QR code inside the scanner frame.<br>3. Tap the shutter to scan.<br>4. Collect the digital stamp for that location.</p><div class="note">Prototype mode: the shutter opens a list of demonstration locations. No real QR code is read.</div>');$('back').onclick=()=>{location.href='journey.html'};$('sheetBody').addEventListener('click',e=>{const b=e.target.closest('[data-place]');if(b)result(b.dataset.place)});function resize(){if(matchMedia('(max-width:500px)').matches){$('stage').style.transform='none';return}const s=Math.min((innerWidth-28)/414,(innerHeight-28)/868,1);$('stage').style.transform='scale('+s+')'}addEventListener('resize',resize);resize();addEventListener('keydown',e=>{if(e.key==='Escape')close()});})();
</script></body></html>
