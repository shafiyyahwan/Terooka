<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#EDE4F5"><title>My Journeys — Terooka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--purple:#5724A3;--pink:#D842A0;--ink:#32204B;--muted:#796B85;--serif:'Fraunces',Georgia,serif;--sans:'Plus Jakarta Sans',sans-serif;--grad:linear-gradient(105deg,#5724A3,#8834B9 52%,#D842A0)}*{box-sizing:border-box}html,body{margin:0;min-height:100%}body{background:#EDE4F5;color:var(--ink);font-family:var(--sans);min-height:100dvh;display:grid;place-items:center;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.stage{width:414px;height:868px;transform-origin:center}.phone{width:414px;height:868px;padding:12px;background:#111015;border-radius:62px;position:relative;box-shadow:0 24px 70px #36195838,0 0 0 2px #343039}.phone:before,.phone:after{content:"";position:absolute;left:-5px;width:4px;background:#302b35;border-radius:4px}.phone:before{top:155px;height:52px}.phone:after{top:228px;height:69px}.screen{width:390px;height:844px;border-radius:50px;position:relative;overflow:hidden;background:linear-gradient(160deg,#F0E4FB,#F9EAF5 35%,#FFF9F7 70%,#FFECE5)}.glow{position:absolute;border-radius:50%;filter:blur(55px);pointer-events:none}.glow.one{width:240px;height:240px;top:-70px;right:-80px;background:#d842a033}.glow.two{width:260px;height:260px;top:430px;left:-120px;background:#8834b924}.island{position:absolute;z-index:30;top:11px;left:50%;transform:translateX(-50%);height:34px;width:118px;background:#08070a;border-radius:30px}.status{position:absolute;top:18px;left:34px;right:30px;z-index:29;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:800}.homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:126px;height:5px;background:#2F2837;border-radius:20px;z-index:30}.scroll{position:absolute;inset:0;z-index:2;overflow-y:auto;scrollbar-width:none;padding:67px 0 117px}.scroll::-webkit-scrollbar,.sheet::-webkit-scrollbar{display:none}.pad{padding:0 22px}svg{width:20px;height:20px;flex-shrink:0}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--pink);margin:0 0 5px}h1{font:600 32px/1.1 var(--serif);color:#32145B;margin:0}h2{font:600 21px var(--serif);color:#32145B;margin:0 0 10px}h3{font:600 17px var(--serif);color:#32145B;margin:0}p{font-size:11px;line-height:1.65;color:#685677;margin:0}.icon-button{width:40px;height:40px;display:grid;place-items:center;background:#ffffffba;border:1px solid #fff;border-radius:13px;color:var(--purple)}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:5px;padding:5px;background:#ffffffb5;border:1px solid white;border-radius:16px;margin-bottom:17px}.tabs button{border:0;border-radius:12px;padding:11px 5px;background:transparent;color:#9482a2;font-size:11px;font-weight:800}.tabs button.active{background:#f1e3f8;color:var(--purple);box-shadow:0 3px 10px #5724a314}.card{background:#ffffffa1;border:1px solid #ffffffe6;border-radius:21px;padding:17px;margin-bottom:15px;box-shadow:0 7px 20px #5724a30d;backdrop-filter:blur(12px)}.hero{border-radius:17px;padding:20px;color:white;min-height:139px;display:flex;flex-direction:column;justify-content:space-between;background:radial-gradient(circle at 90% 0,#ffffff3c,transparent 42%),linear-gradient(115deg,#55239f,#9940b5 60%,#d842a0)}.hero small{font-size:10px;font-weight:800;letter-spacing:.1em;color:#fff9}.hero h2{font-size:26px;color:white;margin:6px 0}.hero p{color:#fffde;font-size:11px}.badge{display:inline-block;border-radius:20px;background:#e5f5e9;color:#31834d;font-size:9px;font-weight:800;padding:6px 9px}.badge.complete{background:#f1e8f7;color:#765393}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{color:var(--muted);font-size:10px}.section-heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.section-heading h2{margin:0}.progress{height:8px;background:#eaddf0;border-radius:20px;overflow:hidden;margin:11px 0 7px}.progress>div{height:100%;background:var(--grad);border-radius:20px;transition:width .3s}.primary{width:100%;border:0;background:var(--grad);color:white;border-radius:14px;padding:13px;font-size:11px;font-weight:800;box-shadow:0 8px 18px #5724a324}.outline{width:100%;background:#fff;color:var(--purple);border:1px solid #e4d2ed;border-radius:14px;padding:12px;font-size:11px;font-weight:800}.plain{background:transparent;border:0;color:var(--purple);font-size:10px;font-weight:800;padding:5px}.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:14px 0}.quick button{background:#ffffffb5;border:1px solid #fff;border-radius:17px;min-height:92px;padding:10px 5px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;color:var(--purple)}.quick svg{width:25px;height:25px}.quick span{font-size:10px;font-weight:800}.stamp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px 7px}.stamp{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}.stamp-circle{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;border:2px dashed #d8c5e4;background:#f6f0fa;color:#bca9c9}.stamp-circle svg{width:30px;height:30px}.stamp.earned .stamp-circle{border:2px solid #b387d8;background:linear-gradient(135deg,#e6d4f6,#ffe7f4);color:var(--purple);box-shadow:0 4px 12px #5724a315}.stamp span{font-size:9px;font-weight:700;color:#806f8e;line-height:1.4}.stamp.earned span{color:#50366a}.place-row{display:flex;align-items:center;gap:11px;padding:12px 0;border-top:1px solid #eadff0}.place-row:first-child{border-top:0;padding-top:0}.place-icon{width:38px;height:38px;flex-shrink:0;display:grid;place-items:center;background:#f2e6fa;border-radius:12px;color:var(--purple)}.place-info{flex:1;min-width:0}.place-info strong{display:block;font-size:11px;margin-bottom:4px}.place-info small{display:block;color:var(--muted);font-size:9px}.place-row .plain{flex-shrink:0}.empty{text-align:center;padding:25px 12px}.empty svg{width:42px;height:42px;color:#ac8ac7;margin-bottom:12px}.empty h2{margin-bottom:8px}.history-card{cursor:pointer}.history-card h3{margin:0 0 5px}.history-meta{display:flex;gap:13px;margin-top:12px;flex-wrap:wrap}.history-meta span{font-size:10px;color:#705d84}.field-label{font-size:11px;font-weight:800;display:block;margin:15px 0 7px}.field{width:100%;border:1px solid #e4d4ed;background:#fff;border-radius:12px;padding:12px;font-size:12px;color:var(--ink)}.overlay{position:absolute;inset:0;z-index:40;background:#28124270;display:none;align-items:flex-end}.overlay.open{display:flex}.sheet{width:100%;max-height:85%;overflow-y:auto;scrollbar-width:none;background:linear-gradient(170deg,#fbf4ff,#fff7f5);border-radius:30px 30px 0 0;padding:18px 22px 36px}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.sheet-head h2{margin:0}.close{width:34px;height:34px;border:0;background:#efe1f6;color:var(--purple);border-radius:10px}.scan{width:186px;height:186px;margin:20px auto;border:3px solid #a87bce;border-radius:22px;display:grid;place-items:center;background:repeating-linear-gradient(45deg,#ffffffa8,#ffffffa8 10px,#f6ebfb 10px,#f6ebfb 20px);color:var(--purple)}.scan svg{width:85px;height:85px}.success-icon{width:74px;height:74px;margin:18px auto;border-radius:50%;display:grid;place-items:center;background:#e3f6e9;color:#31824d}.success-icon svg{width:38px;height:38px}.detail{background:#fff;border:1px solid #e8d9ee;border-radius:15px;padding:13px;margin:16px 0}.detail .row{padding:7px 0;font-size:11px}.detail .row span{color:var(--muted)}.detail .row strong{text-align:right}.danger{width:100%;border:1px solid #f0c8d3;background:#fff;color:#b94769;border-radius:14px;padding:12px;font-size:11px;font-weight:800}.toast{position:absolute;z-index:50;left:50%;top:58px;transform:translateX(-50%);background:#32204b;color:#fff;font-size:11px;font-weight:700;padding:11px 16px;border-radius:14px;display:none;max-width:86%;text-align:center}.toast.show{display:block}.nav{position:absolute;z-index:20;left:16px;right:16px;bottom:22px;height:66px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:#ffffff9e;border:1px solid #ffffffe6;border-radius:24px;backdrop-filter:blur(24px);box-shadow:0 14px 34px #5724a329}.nav a{color:#9886ab;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:18px;font-size:9px;font-weight:700}.nav a.active{background:#d842a01a;color:var(--purple)}.nav svg{width:21px;height:21px;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}@media(max-width:500px){body{display:block;overflow:auto}.stage,.phone{width:100%;height:100dvh;transform:none!important}.phone{padding:0;border-radius:0;box-shadow:none}.phone:before,.phone:after,.island,.status,.homebar{display:none}.screen{width:100%;height:100%;min-height:650px;border-radius:0}.scroll{padding-top:30px}.nav{bottom:13px}.toast{top:24px}}
  </style>
</head>
<body><div class="stage" id="stage"><div class="phone"><div class="screen">
  <div class="glow one"></div><div class="glow two"></div><div class="island"></div><div class="status"><span>9:41</span><svg style="width:70px;height:15px" viewBox="0 0 70 15" fill="none"><g fill="#32204B"><rect x="0" y="10" width="3" height="5" rx="1"/><rect x="5" y="7" width="3" height="8" rx="1"/><rect x="10" y="4" width="3" height="11" rx="1"/><rect x="15" y="1" width="3" height="14" rx="1"/></g><g stroke="#32204B" stroke-width="1.8" stroke-linecap="round"><path d="M27 5Q34-1 41 5"/><path d="M30 9Q34 5 38 9"/></g><circle cx="34" cy="12" r="1.5" fill="#32204B"/><rect x="48" y="2" width="19" height="11" rx="3" stroke="#32204B" stroke-width="1.3"/><rect x="50" y="4" width="15" height="7" rx="1.6" fill="#32204B"/><path d="M69 5v5" stroke="#32204B" stroke-width="2"/></svg></div>
  <main class="scroll" id="scroll"><div class="pad"><header class="top"><div><p class="eyebrow">TEROOKA · YOUR ADVENTURES</p><h1>My Journeys</h1></div><button class="icon-button" id="home-button" aria-label="Go home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 9-8 9 8M5 10v10h14V10"/></svg></button></header><div class="tabs"><button id="tab-active" class="active" type="button">Active Journey</button><button id="tab-past" type="button">Past Journeys</button></div><div id="content"></div></div></main>
  <nav class="nav" aria-label="Main navigation"><a href="home.html"><svg viewBox="0 0 24 24" stroke="currentColor"><path d="m3 11 9-8 9 8M5 10v10h14V10"/></svg>Home</a><a href="discover.html"><svg viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4z"/></svg>Discover</a><a href="camera.html"><svg viewBox="0 0 24 24" stroke="currentColor"><rect x="3" y="6" width="18" height="15" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 6l1.5-3h5L16 6"/></svg>Camera</a><a href="journal.html"><svg viewBox="0 0 24 24" stroke="currentColor"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5Z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></svg>Journal</a><a href="profile.html"><svg viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 16-5 16 0"/></svg>Profile</a></nav>
  <div class="overlay" id="overlay"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast" role="status"></div><div class="homebar"></div></div></div></div>
<script>
  (()=>{'use strict';
    const $=s=>document.querySelector(s);
    const icons={scan:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zm7 0v3m-7 4h3m4 0v-2"/>',stamp:'<path d="M7 15h10v5H7zM9 15v-3c-2-1-3-3-3-5a6 6 0 0 1 12 0c0 2-1 4-3 5v3M5 21h14"/>',map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15m6-12v15"/>',pin:'<path d="M12 21s7-5.5 7-12a7 7 0 0 0-14 0c0 6.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2"/>',lock:'<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>',check:'<path d="m5 12 5 5L20 7"/>',plus:'<path d="M12 5v14M5 12h14"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>'};
    function svg(name,size=20){return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`}
    function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    function get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}}
    function save(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch{toast('Could not save browser data');return false}}
    function today(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
    function niceDate(d){if(!d)return '—';const a=new Date(d.length===10?d+'T12:00:00':d);return isNaN(a)?d:a.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'})}
    function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),2200)}
    function sheet(html){$('#sheet').innerHTML=`<div class="sheet-head"><h2>${html.title}</h2><button class="close" id="close-sheet" aria-label="Close">×</button></div>${html.body}`;$('#overlay').classList.add('open');$('#close-sheet').onclick=closeSheet}
    function closeSheet(){$('#overlay').classList.remove('open')}
    $('#overlay').onclick=e=>{if(e.target===$('#overlay'))closeSheet()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});$('#home-button').onclick=()=>location.href='home.html';
    const places=[{id:'riverstory',name:'Riverfront Heritage Walk',city:'Kuching',cat:'Heritage'},{id:'laksa',name:'Rasa Sarawak Kitchen',city:'Kuching',cat:'Food'},{id:'beads',name:'Borneo Bead Studio',city:'Kuching',cat:'Crafts'},{id:'culturehouse',name:'Stories of Borneo Gallery',city:'Kuching',cat:'Museum'},{id:'weaving',name:'Anyaman Heritage Workshop',city:'Kuching',cat:'Crafts'},{id:'keklapis',name:'Kek Lapis Corner',city:'Kuching',cat:'Food'},{id:'baucraft',name:'Bau Heritage Craft House',city:'Bau',cat:'Crafts'},{id:'serian',name:'Serian Cultural Stories',city:'Serian',cat:'Heritage'}];
    let session=get('terooka_session',null);const uid=session?.username||session?.email||'guest';const journeyKey='terooka_journeys_'+uid,stampKey='terooka_stamps_'+uid,bookingKey='terooka_bookings_'+uid;
    let journeys=get(journeyKey,[]),stamps=get(stampKey,[]),bookings=get(bookingKey,[]),tab='active';if(!Array.isArray(journeys))journeys=[];if(!Array.isArray(stamps))stamps=[];
    function active(){return journeys.find(j=>j.status==='active')}
    function earned(j){return stamps.filter(s=>j.placeIds.includes(s.placeId)&&(!s.journeyId||s.journeyId===j.id))}
    function earnedIds(j){return new Set(earned(j).map(s=>s.placeId))}
    function render(){ $('#tab-active').classList.toggle('active',tab==='active');$('#tab-past').classList.toggle('active',tab==='past');$('#content').innerHTML=tab==='active'?renderActive():renderPast();wire()}
    $('#tab-active').onclick=()=>{tab='active';render()};$('#tab-past').onclick=()=>{tab='past';render()};
    function renderActive(){const j=active();if(!j)return `<div class="card empty">${svg('map',42)}<h2>Your next adventure awaits</h2><p>Start a journey to track cultural places, collect digital stamps and save your trip progress.</p><button class="primary" id="start" style="margin-top:20px">Start New Journey</button></div><div class="card"><h2>How it works</h2><p>1. Create a journey and add places.<br>2. Visit participating venues and scan their QR codes.<br>3. Collect stamps and end your journey whenever you're ready.</p></div>`;
      const count=j.placeIds.length,done=earnedIds(j).size,pct=count?Math.round(done/count*100):0;
      return `<div class="hero"><div><small>YOUR CURRENT ADVENTURE</small><h2>${esc(j.name)}</h2><p>${esc(j.destination)} · Started ${niceDate(j.startedAt)}</p></div><div><span class="badge">ACTIVE JOURNEY</span></div></div>
<div class="card" style="margin-top:15px"><div class="row"><h2 style="margin:0">Journey Progress</h2><strong style="font-size:11px">${done} / ${count} places</strong></div><div class="progress"><div style="width:${pct}%"></div></div><div class="row"><span class="muted">${done} stamp${done===1?'':'s'} collected</span><span class="muted">${pct}%</span></div></div>
<div class="quick"><button id="scan">${svg('scan',25)}<span>Scan QR</span></button><button id="go-stamps">${svg('stamp',25)}<span>My Stamps</span></button><button id="add-place">${svg('plus',25)}<span>Add Place</span></button></div>
<div class="card" id="stamp-section"><div class="section-heading"><h2>Digital Stamps</h2><span class="muted">${done} / ${count}</span></div>${stampGrid(j)}<p style="margin-top:15px;font-size:10px">Demo stamps are unlocked using simulated QR verification.</p></div>
<div class="card"><div class="section-heading"><h2>Places in Your Journey</h2><button class="plain" id="add-place-inline">+ Add</button></div>${j.placeIds.length?j.placeIds.map(id=>placeRow(j,id)).join(''):'<div class="empty"><p>No places yet. Add a place to start exploring.</p></div>'}</div>
<div class="card"><h2>Ready to wrap up?</h2><p>End your trip when you are ready. Your stamps and visited places will remain available in Past Journeys.</p><button class="danger" id="end-journey" style="margin-top:14px">End Journey</button></div>`}
    function stampGrid(j){if(!j.placeIds.length)return '<p>No places added yet.</p>';const done=earnedIds(j);return `<div class="stamp-grid">${j.placeIds.map(id=>{const p=places.find(x=>x.id===id);return `<div class="stamp ${done.has(id)?'earned':''}"><div class="stamp-circle">${svg(done.has(id)?'stamp':'lock',30)}</div><span>${esc(p?.name||id)}</span></div>`}).join('')}</div>`}
    function placeRow(j,id){const p=places.find(x=>x.id===id),done=earnedIds(j).has(id);return `<div class="place-row"><div class="place-icon">${svg(done?'check':'pin')}</div><div class="place-info"><strong>${esc(p?.name||id)}</strong><small>${done?'Stamp collected':esc(p?.cat||'Place')+' · Not collected'}</small></div><button class="plain" data-place="${esc(id)}">View</button></div>`}
    function renderPast(){const past=journeys.filter(j=>j.status==='completed').slice().reverse();if(!past.length)return `<div class="card empty">${svg('stamp',42)}<h2>No past journeys yet</h2><p>When you end an active journey, its recap and collected stamps will appear here.</p><button class="outline" id="view-active" style="margin-top:20px">Go to Active Journey</button></div>`;return `<p style="margin:0 0 14px">Relive your cultural adventures and view your collected stamps.</p>${past.map(j=>`<div class="card history-card" data-recap="${esc(j.id)}"><div class="row"><h3>${esc(j.name)}</h3><span class="badge complete">Completed</span></div><p>${esc(j.destination)} · ${niceDate(j.startedAt)} – ${niceDate(j.endedAt)}</p><div class="history-meta"><span>${svg('pin',15)} ${j.placeIds.length} planned places</span><span>${svg('stamp',15)} ${earnedIds(j).size} stamps</span></div><button class="outline" data-recap="${esc(j.id)}" style="margin-top:14px">View Journey Recap →</button></div>`).join('')}`}
    function wire(){const on=(id,fn)=>{const el=$('#'+id);if(el)el.onclick=fn};on('start',startSheet);on('scan',scanSheet);on('go-stamps',()=>$('#stamp-section')?.scrollIntoView({behavior:'smooth',block:'center'}));on('add-place',addPlaceSheet);on('add-place-inline',addPlaceSheet);on('end-journey',endSheet);on('view-active',()=>{tab='active';render()});document.querySelectorAll('[data-place]').forEach(b=>b.onclick=()=>location.href='place.html?id='+encodeURIComponent(b.dataset.place));document.querySelectorAll('[data-recap]').forEach(b=>b.onclick=()=>recap(b.dataset.recap))}
    function startSheet(){sheet({title:'Start New Journey',body:`<p>Create an adventure and start collecting cultural memories.</p><label class="field-label" for="journey-name">Journey Name</label><input id="journey-name" class="field" maxlength="60" placeholder="e.g. Kuching Cultural Trail"><label class="field-label" for="destination">Destination</label><select id="destination" class="field"><option value="Kuching, Sarawak">Kuching, Sarawak</option><option value="Bau, Sarawak">Bau, Sarawak</option><option value="Serian, Sarawak">Serian, Sarawak</option><option value="Sarawak, Malaysia">Across Sarawak</option></select><button class="primary" id="create" style="margin-top:20px">Start Journey</button>`});$('#create').onclick=()=>{if(active()){toast('End your current journey first');return}const name=$('#journey-name').value.trim(),destination=$('#destination').value;if(!name){toast('Enter a journey name');return}const j={id:'J-'+Date.now().toString(36),name,destination,startedAt:new Date().toISOString(),endedAt:null,status:'active',placeIds:[]};const next=[...journeys,j];if(!save(journeyKey,next))return;journeys=next;closeSheet();render();toast('Journey started!')}}
    function addPlaceSheet(){const j=active();if(!j)return;const available=places.filter(p=>!j.placeIds.includes(p.id));sheet({title:'Add Places',body:`<p>Choose cultural places to include in your current journey.</p><div style="margin-top:15px">${available.length?available.map(p=>`<div class="place-row"><div class="place-icon">${svg('pin')}</div><div class="place-info"><strong>${esc(p.name)}</strong><small>${esc(p.city)} · ${esc(p.cat)}</small></div><button class="plain" data-add="${esc(p.id)}">+ Add</button></div>`).join(''):'<p>All available demo places have been added.</p>'}</div>`});document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const next=journeys.map(x=>x.id===j.id?{...x,placeIds:[...x.placeIds,b.dataset.add]}:x);if(!save(journeyKey,next))return;journeys=next;closeSheet();render();toast('Place added to journey')})}
    function scanSheet(){const j=active();if(!j)return;if(!j.placeIds.length){toast('Add a place to your journey first');return}const pending=j.placeIds.filter(id=>!earnedIds(j).has(id));sheet({title:'Scan Venue QR',body:`<p style="text-align:center">Scan the official QR code at a participating cultural venue to unlock its stamp.</p><div class="scan">${svg('scan',85)}</div><p style="text-align:center">Camera scanning is not connected in this hackathon prototype.</p>${pending.length?`<label class="field-label" for="demo-venue">Demo venue to verify</label><select id="demo-venue" class="field">${pending.map(id=>`<option value="${esc(id)}">${esc(places.find(p=>p.id===id)?.name||id)}</option>`).join('')}</select><button class="primary" id="simulate" style="margin-top:16px">Simulate QR Verification</button>`:'<div class="empty"><p>All planned places already have stamps!</p></div>'}<p style="margin-top:12px;text-align:center;font-size:9px">Demo only — does not verify a real visit or workshop completion.</p>`});const b=$('#simulate');if(b)b.onclick=()=>{const id=$('#demo-venue').value;if(earnedIds(j).has(id))return;const item={placeId:id,placeName:places.find(p=>p.id===id)?.name||id,journeyId:j.id,collectedAt:new Date().toISOString(),verification:'demo-simulated'};const next=[...stamps,item];if(!save(stampKey,next))return;stamps=next;stampSuccess(item)}}
    function stampSuccess(item){sheet({title:'Digital Stamp',body:`<div class="success-icon">${svg('stamp',38)}</div><h2 style="text-align:center;font-size:25px">Stamp Unlocked!</h2><p style="text-align:center">${esc(item.placeName)} is now in your stamp collection.</p><div class="detail"><div class="row"><span>Collected</span><strong>${niceDate(item.collectedAt)}</strong></div><div class="row"><span>Verification</span><strong>Demo simulation</strong></div></div><button class="primary" id="done-stamp">Continue Journey</button>`});$('#done-stamp').onclick=()=>{closeSheet();render()}}
    function endSheet(){const j=active();if(!j)return;sheet({title:'End Journey?',body:`<p>Are you sure you want to end <strong>${esc(j.name)}</strong>?</p><div class="detail"><div class="row"><span>Planned places</span><strong>${j.placeIds.length}</strong></div><div class="row"><span>Collected stamps</span><strong>${earnedIds(j).size}</strong></div></div><p>Your trip recap and stamps will remain in Past Journeys. Your Journal is separate and will not be deleted.</p><button class="danger" id="confirm-end" style="margin-top:18px">Yes, End Journey</button><button class="outline" id="cancel-end" style="margin-top:9px">Keep Exploring</button>`});$('#cancel-end').onclick=closeSheet;$('#confirm-end').onclick=()=>{const next=journeys.map(x=>x.id===j.id?{...x,status:'completed',endedAt:new Date().toISOString()}:x);if(!save(journeyKey,next))return;journeys=next;closeSheet();tab='past';render();recap(j.id);toast('Journey completed!')}}
    function recap(id){const j=journeys.find(x=>x.id===id);if(!j)return;sheet({title:'Journey Recap',body:`<div class="hero" style="min-height:110px"><div><small>COMPLETED ADVENTURE</small><h2>${esc(j.name)}</h2><p>${esc(j.destination)}</p></div></div><div class="detail"><div class="row"><span>Started</span><strong>${niceDate(j.startedAt)}</strong></div><div class="row"><span>Completed</span><strong>${niceDate(j.endedAt)}</strong></div><div class="row"><span>Places planned</span><strong>${j.placeIds.length}</strong></div><div class="row"><span>Stamps collected</span><strong>${earnedIds(j).size}</strong></div></div><h2>Collected Stamps</h2>${stampGrid(j)}<h2 style="margin-top:20px">Places in This Journey</h2>${j.placeIds.length?j.placeIds.map(pid=>placeRow(j,pid)).join(''):'<p>No places were added.</p>'}<button class="outline" id="journal-link" style="margin-top:17px">Open Journal Library →</button><p style="margin-top:10px;font-size:9px">Journal books are managed separately from journey history.</p>`});document.querySelectorAll('#sheet [data-place]').forEach(b=>b.onclick=()=>location.href='place.html?id='+encodeURIComponent(b.dataset.place));$('#journal-link').onclick=()=>location.href='journal.html'}
    const stage=$('#stage');function fit(){if(innerWidth<=500){stage.style.transform='';return}stage.style.transform='scale('+Math.min(1,(innerWidth-28)/414,(innerHeight-28)/868)+')'}fit();addEventListener('resize',fit);if(new URLSearchParams(location.search).get('tab')==='past')tab='past';render();
  })();
</script>
</body></html>
