
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Journeys — Terooka</title>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #5724a3;
      --pink: #d842a0;
      --ink: #32204b;
      --muted: #796b85;
      --line: #e8daf0;
      --gradient: linear-gradient(110deg,#5724a3,#a448b7,#d842a0);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #ede4f5;
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }

    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--pink);
      outline-offset: 3px;
    }

    /* PHONE FRAME */
    .stage {
      position: relative;
      width: 414px;
      height: 868px;
      margin: auto;
      transform-origin: center center;
    }

    .phone {
      position: absolute;
      inset: 0;
      padding: 12px;
      background: #111015;
      border-radius: 62px;
      box-shadow: 0 24px 70px #3619583b, 0 0 0 2px #343039;
    }

    .phone::before,
    .phone::after {
      content: "";
      position: absolute;
      left: -5px;
      width: 4px;
      background: #302b35;
      border-radius: 4px;
    }

    .phone::before { top: 155px; height: 52px; }
    .phone::after { top: 228px; height: 69px; }

    .screen {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 50px;
      background: linear-gradient(160deg,#f3e8fc,#fff8fb 65%,#fff4ee);
    }

    .island {
      position: absolute;
      z-index: 10;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 34px;
      border-radius: 30px;
      background: #100c15;
    }

    .status {
      position: absolute;
      z-index: 9;
      top: 18px;
      left: 34px;
      right: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 800;
    }

    .homebar {
      position: absolute;
      z-index: 9;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 5px;
      border-radius: 20px;
      background: #2f2837;
    }

    .scroll {
      height: 100%;
      overflow-y: auto;
      padding: 67px 20px 118px;
      scrollbar-width: none;
    }

    .scroll::-webkit-scrollbar { display: none; }

    h1, h2 {
      font-family: 'Fraunces', Georgia, serif;
      margin: 0;
    }

    h1 { font-size: 29px; }
    h2 { font-size: 23px; }

    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .linkbtn {
      flex-shrink: 0;
      border: 0;
      border-radius: 13px;
      padding: 11px 14px;
      background: #f0e4f8;
      color: var(--purple);
      font-size: 11px;
      font-weight: 800;
    }

    /* JOURNEY CARD */
    .hero {
      padding: 22px;
      border-radius: 24px;
      background: var(--gradient);
      color: white;
      box-shadow: 0 12px 24px #6b2b9830;
    }

    .hero h2 {
      margin: 14px 0 6px;
      font-size: 25px;
    }

    .hero .sub { color: #ffffffdb; }

    .pill {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 30px;
      background: #ffffff32;
      font-size: 10px;
      font-weight: 800;
    }

    .destinations {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 18px;
    }

    .destination {
      padding: 8px 11px;
      border: 1px solid #ffffff50;
      border-radius: 30px;
      background: #ffffff25;
      font-size: 10px;
      font-weight: 700;
    }

    /* BUTTONS */
    .btn {
      min-height: 48px;
      padding: 0 16px;
      border: 0;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 800;
    }

    .primary {
      background: var(--gradient);
      color: white;
    }

    .secondary {
      border: 1px solid var(--line);
      background: white;
      color: var(--purple);
    }

    .full { width: 100%; }

    .action-area { margin-top: 15px; }

    .scan-btn {
      width: 100%;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1.5px solid var(--purple);
      border-radius: 15px;
      background: white;
      color: var(--purple);
      font-size: 12px;
      font-weight: 800;
    }

    .scan-btn svg {
      width: 19px;
      height: 19px;
    }

    /* TABS */
    .tabs {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      margin: 24px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 3px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: #9c8bac;
      font-size: 11px;
      font-weight: 700;
    }

    .tab svg {
      width: 20px;
      height: 20px;
    }

    .tab.active {
      color: var(--purple);
      border-bottom-color: var(--pink);
    }

    /* EMPTY STATE */
    .empty {
      padding: 29px 18px;
      border: 1px dashed #d9c4e9;
      border-radius: 20px;
      background: #ffffffaa;
      text-align: center;
    }

    .empty svg {
      width: 35px;
      height: 35px;
      margin-bottom: 12px;
      color: var(--purple);
    }

    .empty strong {
      display: block;
      font-size: 14px;
    }

    .empty p {
      margin: 9px 0 17px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    /* PHOTOS */
    .day {
      display: flex;
      justify-content: space-between;
      margin: 20px 0 10px;
      font-size: 12px;
    }

    .day span { color: var(--muted); }

    .photos {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 5px;
    }

    .photo {
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #eee1f3;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* STAMPS — THREE PER ROW */
    .stamps {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 18px 8px;
      align-items: start;
    }

    .stamp {
      min-width: 0;
      text-align: center;
    }

    .stamp img {
      display: block;
      width: 100%;
      height: 112px;
      object-fit: contain;
    }

    .stamp strong {
      display: block;
      margin-top: 5px;
      font-size: 9px;
      line-height: 1.4;
    }

    .stamp span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 8px;
    }

    /* BOOKINGS AND PAST JOURNEYS */
    .listcard,
    .pastitem {
      display: block;
      width: 100%;
      margin-bottom: 11px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: white;
      color: var(--ink);
      text-align: left;
      text-decoration: none;
    }

    .listcard strong,
    .pastitem strong {
      font-size: 13px;
    }

    .listcard p,
    .pastitem p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .cardrow {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cardrow > div:nth-child(2) {
      flex: 1;
      min-width: 0;
    }

    .cardicon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #f2e8f9;
      color: var(--purple);
      flex-shrink: 0;
    }

    .cardicon svg {
      width: 24px;
      height: 24px;
    }

    .chevron {
      color: var(--purple);
      font-size: 22px;
    }

    .back {
      margin-bottom: 18px;
      padding: 5px 0;
      border: 0;
      background: transparent;
      color: var(--purple);
      font-size: 12px;
      font-weight: 800;
    }

    .danger {
      width: 100%;
      margin-top: 25px;
      border: 1px solid #f5d6e0;
      background: #fff0f3;
      color: #b33361;
    }

    .delete-journey {
      display: block;
      margin: 15px auto 4px;
      padding: 9px 14px;
      border: 0;
      background: transparent;
      color: #b33361;
      font-size: 11px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* BOTTOM NAVIGATION */
    .nav {
      position: absolute;
      z-index: 5;
      bottom: 22px;
      left: 16px;
      right: 16px;
      height: 66px;
      display: grid;
      grid-template-columns: repeat(5,1fr);
      gap: 2px;
      padding: 6px;
      border: 1px solid #ffffffe6;
      border-radius: 24px;
      background: #ffffffae;
      box-shadow: 0 14px 34px #5724a329;
      backdrop-filter: blur(24px);
    }

    .nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border-radius: 18px;
      color: #9886ab;
      text-decoration: none;
      font-size: 9px;
      font-weight: 700;
    }

    .nav svg {
      width: 21px;
      height: 21px;
    }

    .nav a.active {
      background: #d842a01a;
      color: var(--purple);
    }

    /* MODAL */
    .overlay {
      position: absolute;
      z-index: 20;
      inset: 0;
      display: none;
      align-items: flex-end;
      background: #1c0d2c99;
    }

    .overlay.show { display: flex; }

    .sheet {
      width: 100%;
      max-height: 85%;
      overflow-y: auto;
      padding: 25px 22px 35px;
      border-radius: 28px 28px 0 0;
      background: #fff9fd;
    }

    .sheet h2 { margin-bottom: 9px; }

    .field {
      width: 100%;
      margin: 9px 0;
      padding: 13px;
      border: 1px solid #e4d4ef;
      border-radius: 13px;
      background: white;
      font-size: 13px;
    }

    .form-label {
      display: block;
      margin-top: 13px;
      font-size: 11px;
      font-weight: 800;
    }

    .option {
      width: 100%;
      margin: 5px 0;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      text-align: left;
      color: var(--ink);
      font-size: 12px;
    }

    .option strong { display: block; }

    .option small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
    }

    .preview {
      position: absolute;
      z-index: 30;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #180d25ed;
    }

    .preview.show { display: flex; }

    .preview img {
      max-width: 100%;
      max-height: 75%;
      object-fit: contain;
      border-radius: 10px;
    }

    .preview button {
      align-self: flex-end;
      margin-bottom: 20px;
      padding: 9px 15px;
      border: 0;
      border-radius: 30px;
      background: white;
    }

    .preview p {
      margin-top: 15px;
      color: white;
      font-size: 12px;
    }

    /* MOBILE */
    @media (max-width:500px) {
      body {
        display: block;
        background: white;
      }

      .stage,
      .phone {
        width: 100%;
        height: 100dvh;
        transform: none !important;
      }

      .phone {
        padding: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .phone::before,
      .phone::after,
      .island,
      .status,
      .homebar {
        display: none;
      }

      .screen { border-radius: 0; }
      .scroll { padding-top: 30px; }
      .nav { bottom: 13px; }
    }
  </style>
</head>

<body>

<div class="stage" id="stage">
  <div class="phone">
    <div class="screen">

      <div class="island"></div>

      <div class="status">
        <span>9:41</span>
        <svg width="70" height="15" viewBox="0 0 70 15" fill="none">
          <g fill="#32204B">
            <rect x="0" y="10" width="3" height="5" rx="1"/>
            <rect x="5" y="7" width="3" height="8" rx="1"/>
            <rect x="10" y="4" width="3" height="11" rx="1"/>
            <rect x="15" y="1" width="3" height="14" rx="1"/>
          </g>
          <g stroke="#32204B" stroke-width="1.8" stroke-linecap="round">
            <path d="M27 5Q34-1 41 5"/>
            <path d="M30 9Q34 5 38 9"/>
          </g>
          <circle cx="34" cy="12" r="1.5" fill="#32204B"/>
          <rect x="48" y="2" width="19" height="11" rx="3" stroke="#32204B" stroke-width="1.3"/>
          <rect x="50" y="4" width="15" height="7" rx="1.6" fill="#32204B"/>
          <path d="M69 5v5" stroke="#32204B" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>

      <div class="homebar"></div>

      <main class="scroll" id="main"></main>

      <nav class="nav" aria-label="Main navigation">
        <a href="home.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 11 9-8 9 8M5 10v10h14V10"/>
          </svg>
          Home
        </a>

        <a href="discover.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <path d="m15 9-2 4-4 2 2-4z"/>
          </svg>
          Discover
        </a>

        <a href="camera.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="6" width="18" height="15" rx="3"/>
            <circle cx="12" cy="13.5" r="3.5"/>
            <path d="M8 6l1.5-3h5L16 6"/>
          </svg>
          Camera
        </a>

        <a href="journal.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5Z"/>
            <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/>
          </svg>
          Journal
        </a>

        <a href="profile.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c0-5 16-5 16 0"/>
          </svg>
          Profile
        </a>
      </nav>

      <div class="overlay" id="overlay">
        <div class="sheet" id="sheet"></div>
      </div>

      <div class="preview" id="preview">
        <button id="closePreview">Close</button>
        <img id="previewImg" alt="Journey photo">
        <p id="previewText"></p>
      </div>

    </div>
  </div>
</div>

<input type="file" id="photoInput" accept="image/*" multiple hidden>

<script src="places.js"></script>

<script>
  (() => {
    'use strict';

    const $ = selector => document.querySelector(selector);

    const icon = (name, size = 24) => {
      const paths = {
        camera: '<rect x="3" y="6" width="18" height="15" rx="3"/><circle cx="12" cy="13.5" r="3.5"/><path d="M8 6l1.5-3h5L16 6"/>',
        stamp: '<path d="M7 14h10l2 3v3H5v-3zM9 14v-3c-2-2-2-6 3-6s5 4 3 6v3M4 22h16"/>',
        bookings: '<path d="M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4z"/><path d="M12 6v12" stroke-dasharray="2 2"/>',
        map: '<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15"/>',
        book: '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5Z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/>'
      };

      return `<svg width="${size}" height="${size}" viewBox="0 0 24 24"
      fill="none" stroke="currentColor" stroke-width="1.8"
      stroke-linecap="round" stroke-linejoin="round">
      ${paths[name] || paths.map}
    </svg>`;
    };

    const qrIcon = `
    <svg viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/>
      <rect x="7" y="7" width="4" height="4"/>
      <path d="M15 7h2v4h-2M7 15h4v2H7M15 15h2v2h-2"/>
    </svg>
  `;

    function getUser() {
      try {
        const session = JSON.parse(
          localStorage.getItem('terooka_session') || 'null'
        );
        return session?.username || session?.email || 'guest';
      } catch {
        return 'guest';
      }
    }

    const uid = getUser();

    const journeyKey = 'terooka_journeys_' + uid;
    const stampKey = 'terooka_stamps_' + uid;
    const photoKey = 'terooka_journey_photos_' + uid;
    const bookingKey = 'terooka_bookings_' + uid;

    const places = window.TerookaData?.places || [];

    const stampImages = {
      riverstory: 'riverfront_heritage_walk.png',
      laksa: 'rasa_sarawak_kitchen.png',
      beads: 'borneo_bead_studio.png',
      culturehouse: 'stories_of_borneo_gallery.png',
      weaving: 'anyaman_heritage_workshop.png',
      keklapis: 'kek_lapis_corner.png',
      baucraft: 'bau_heritage_craft_house.png',
      serian: 'serian_cultural_stories.png'
    };

    function read(key, fallback = []) {
      try {
        return JSON.parse(localStorage.getItem(key)) ?? fallback;
      } catch {
        return fallback;
      }
    }

    function write(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch {
        alert('Browser storage is full.');
        return false;
      }
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function fmt(value) {
      const date = new Date(value);
      return isNaN(date)
        ? 'Unknown date'
        : date.toLocaleDateString('en-GB', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });
    }

    function journeys() {
      return read(journeyKey);
    }

    function active() {
      return journeys().find(j =>
        j.status === 'active' ||
        j.status === 'ongoing' ||
        (!j.status && !j.endedAt)
      );
    }

    function past() {
      return journeys().filter(j =>
        j.status === 'completed' || j.endedAt
      );
    }

    function belongs(item, journey) {
      return String(item.journeyId ?? item.journey_id ?? '') ===
        String(journey.id);
    }

    function photos(journey) {
      return read(photoKey).filter(p => belongs(p, journey));
    }

    function stamps(journey) {
      return read(stampKey).filter(s => belongs(s, journey));
    }

    function bookings(journey) {
      return read(bookingKey).filter(b => belongs(b, journey));
    }

    function destinations(journey) {
      if (Array.isArray(journey.destinations) &&
        journey.destinations.length) {
        return journey.destinations;
      }

      return String(journey.destination || journey.city || 'Malaysia')
        .split(',')
        .map(x => x.trim())
        .filter(Boolean);
    }

    function travelDay(journey, photo) {
      const a = new Date(
        journey.startDate || journey.startedAt || journey.date
      );
      const b = new Date(
        photo.takenAt || photo.createdAt || photo.date
      );

      if (isNaN(a) || isNaN(b)) return 1;

      a.setHours(0, 0, 0, 0);
      b.setHours(0, 0, 0, 0);

      return Math.max(
        1,
        Math.round((b - a) / 86400000) + 1
      );
    }

    let view = 'active';
    let selected = null;
    let tab = 'photos';

    function emptyState(symbol, title, description, action = '') {
      return `
      <div class="empty">
        ${icon(symbol, 35)}
        <strong>${title}</strong>
        <p>${description}</p>
        ${action}
      </div>
    `;
    }

    function render() {
      if (view === 'pastList') {
        renderPast();
        return;
      }

      const old = view === 'pastDetail';
      const journey = old ? selected : active();

      if (!journey) {
        $('#main').innerHTML = `
        <div class="header">
          <div>
            <h1>My Journeys</h1>
            <p class="sub">Your cultural adventures in one place.</p>
          </div>
          <button class="linkbtn" data-action="past">See all</button>
        </div>

        ${emptyState(
          'map',
          'No active journey yet',
          'Start a journey to discover culture, collect stamps and save your memories.',
          '<button class="btn primary" data-action="start">Start Journey</button>'
        )}
      `;
        return;
      }

      $('#main').innerHTML = `
      ${old
        ? '<button class="back" data-action="past">← Past Journeys</button>'
        : ''
      }

      <div class="header">
        <div>
          <h1>${old ? 'Journey Memories' : 'My Journeys'}</h1>
          <p class="sub">
            ${old
        ? 'Revisit your cultural adventure.'
        : 'Capture every cultural experience.'}
          </p>
        </div>

        ${old
        ? ''
        : '<button class="linkbtn" data-action="past">See all</button>'
      }
      </div>

      <section class="hero">
        <span class="pill">
          ${old ? 'Completed Journey' : 'Active Journey'}
        </span>

        <h2>${esc(journey.name || journey.title || 'My Adventure')}</h2>

        <p class="sub">
          Started ${fmt(
        journey.startDate ||
        journey.startedAt ||
        journey.date
      )}
        </p>

        <div class="destinations">
          ${destinations(journey).map(destination => `
            <span class="destination">${esc(destination)}</span>
          `).join('')}
        </div>
      </section>

      ${old ? '' : `
        <div class="action-area">
          <button class="scan-btn" data-action="scan">
            ${qrIcon}
            Scan QR · Collect Stamp
          </button>
        </div>
      `}

      <div class="tabs">
        ${[
        ['photos', 'Photos', 'camera'],
        ['bookings', 'Bookings', 'bookings'],
        ['stamps', 'Stamps', 'stamp']
      ].map(([key, label, symbol]) => `
          <button
            class="tab ${tab === key ? 'active' : ''}"
            data-tab="${key}"
          >
            ${icon(symbol, 20)}
            ${label}
          </button>
        `).join('')}
      </div>

      <div id="tabContent"></div>

      ${old ? `
        <button class="delete-journey" data-action="delete">
          Delete Journey
        </button>
      ` : `
        <button class="btn danger" data-action="end">
          End Journey
        </button>

        <button class="delete-journey" data-action="delete">
          Delete Journey
        </button>
      `}
    `;

      renderTab(journey, old);
    }

    function renderTab(journey, old) {
      const target = $('#tabContent');

      if (tab === 'photos') {
        const list = photos(journey);

        if (!list.length) {
          target.innerHTML = emptyState(
            'camera',
            'No photos yet',
            'Your journey photos will appear here, organised by travel day.',
            old ? '' :
              '<button class="btn primary" data-action="photo">Add Photos</button>'
          );
          return;
        }

        const groups = {};

        list.forEach(photo => {
          const day = travelDay(journey, photo);
          (groups[day] ??= []).push(photo);
        });

        target.innerHTML = Object.keys(groups)
          .sort((a, b) => Number(b) - Number(a))
          .map(day => `
          <div class="day">
            <strong>Day ${day}</strong>
            <span>${groups[day].length} photos</span>
          </div>

          <div class="photos">
            ${groups[day].map(photo => `
              <button
                class="photo"
                data-preview="${esc(photo.id)}"
              >
                <img
                  src="${esc(photo.src || photo.image)}"
                  alt="Journey photo"
                >
              </button>
            `).join('')}
          </div>
        `).join('');

        return;
      }

      if (tab === 'bookings') {
        const list = bookings(journey);

        if (!list.length) {
          target.innerHTML = emptyState(
            'bookings',
            'No bookings yet',
            'Your booked cultural experiences and workshops will appear here.',
            old ? '' :
              '<button class="btn primary" data-action="discover">Explore Activities</button>'
          );
          return;
        }

        target.innerHTML = list.map(booking => `
        <div class="listcard">
          <div class="cardrow">
            <div class="cardicon">${icon('bookings')}</div>

            <div>
              <strong>
                ${esc(
          booking.placeName ||
          booking.activity ||
          booking.name ||
          'Cultural Experience'
        )}
              </strong>

              <p>
                ${fmt(
          booking.date ||
          booking.bookingDate ||
          booking.createdAt
        )}
                · ${esc(booking.time || 'Time not specified')}
              </p>

              <p>${esc(booking.status || 'Booked')}</p>
            </div>
          </div>
        </div>
      `).join('');

        return;
      }

      if (tab === 'stamps') {
        const list = stamps(journey);

        if (!list.length) {
          target.innerHTML = emptyState(
            'stamp',
            'No stamps collected',
            'Visit cultural places and collect their digital stamps.',
            old ? '' :
              '<button class="btn primary" data-action="scan">Scan QR</button>'
          );
          return;
        }

        target.innerHTML = `
        <div class="stamps">
          ${list.map(stamp => {
          const id = stamp.placeId || stamp.id;
          const place = places.find(p => p.id === id);
          const image = stampImages[id];

          return `
              <div class="stamp">
                ${image
            ? `<img src="img/${esc(image)}" alt="Digital stamp">`
            : icon('stamp', 50)
          }

                <strong>
                  ${esc(stamp.placeName || place?.name || 'Digital Stamp')}
                </strong>

                <span>
                  ${fmt(stamp.collectedAt || stamp.date)}
                </span>
              </div>
            `;
        }).join('')}
        </div>
      `;

        return;
      }
    }

    function renderPast() {
      const list = past().slice().reverse();

      $('#main').innerHTML = `
      <button class="back" data-action="home">
        ← My Journeys
      </button>

      <h1>Past Journeys</h1>

      <p class="sub" style="margin-bottom:22px">
        Your completed cultural adventures.
      </p>

      ${list.length
        ? list.map(journey => `
          <button
            class="pastitem"
            data-past="${esc(journey.id)}"
          >
            <div class="cardrow">
              <div class="cardicon">${icon('book')}</div>

              <div>
                <strong>
                  ${esc(journey.name || journey.title || 'My Adventure')}
                </strong>

                <p>
                  ${esc(destinations(journey).join(', '))}
                </p>

                <p>
                  ${fmt(journey.startedAt || journey.startDate)}
                  —
                  ${fmt(journey.endedAt)}
                </p>

                <p>
                  ${photos(journey).length} photos ·
                  ${stamps(journey).length} stamps
                </p>
              </div>

              <span class="chevron">›</span>
            </div>
          </button>
        `).join('')
        : emptyState(
          'book',
          'No past journeys yet',
          'Completed journeys will appear here.'
        )
      }
    `;
    }

    function openSheet(html) {
      $('#sheet').innerHTML = html;
      $('#overlay').classList.add('show');
    }

    function closeSheet() {
      $('#overlay').classList.remove('show');
    }

    $('#overlay').addEventListener('click', event => {
      if (event.target.id === 'overlay') closeSheet();
    });

    function startJourney() {
      openSheet(`
      <h2>Start a Journey</h2>

      <p class="sub">
        Where will your adventure take you?
      </p>

      <form id="startForm">
        <label class="form-label">Journey Name</label>

        <input
          class="field"
          name="name"
          maxlength="60"
          placeholder="e.g. Discover Sarawak"
          required
        >

        <label class="form-label">Destinations</label>

        <input
          class="field"
          name="destination"
          maxlength="200"
          placeholder="e.g. Kuching, Bau, Serian"
          required
        >

        <p class="sub">
          You can add multiple destinations separated by commas.
        </p>

        <button
          class="btn primary full"
          style="margin-top:15px"
          type="submit"
        >
          Start Journey
        </button>
      </form>
    `);

      $('#startForm').onsubmit = event => {
        event.preventDefault();

        if (active()) return;

        const data = new FormData(event.target);
        const name = String(data.get('name') || '').trim();

        const destinations = [
          ...new Set(
            String(data.get('destination') || '')
              .split(',')
              .map(value => value.trim())
              .filter(Boolean)
          )
        ];

        if (!name || !destinations.length) return;

        const journey = {
          id: 'J-' + Date.now(),
          name,
          destination: destinations.join(', '),
          destinations,
          startedAt: new Date().toISOString(),
          status: 'active',
          placeIds: []
        };

        const list = journeys();
        list.push(journey);

        if (write(journeyKey, list)) {
          closeSheet();
          view = 'active';
          tab = 'photos';
          render();
        }
      };
    }

    function scanQR() {
      const journey = active();
      if (!journey) return;

      const collected = new Set(
        stamps(journey).map(s => s.placeId || s.id)
      );

      openSheet(`
      <h2>Scan Location QR</h2>

      <p class="sub">
        Prototype: select the location you visited to collect its stamp.
      </p>

      ${places.map(place => `
        <button
          class="option"
          data-collect="${esc(place.id)}"
          ${collected.has(place.id) ? 'disabled' : ''}
        >
          <strong>
            ${esc(place.name)}
            ${collected.has(place.id) ? '✓' : ''}
          </strong>
          <small>${esc(place.city)}</small>
        </button>
      `).join('')}

      <button
        class="btn secondary full"
        data-action="close"
        style="margin-top:12px"
      >
        Cancel
      </button>
    `);
    }

    function collectStamp(id) {
      const journey = active();
      const place = places.find(p => p.id === id);

      if (!journey || !place) return;

      if (stamps(journey).some(s =>
        (s.placeId || s.id) === id
      )) return;

      const list = read(stampKey);

      list.push({
        placeId: id,
        placeName: place.name,
        city: place.city,
        journeyId: journey.id,
        collectedAt: new Date().toISOString(),
        verification: 'prototype-collection'
      });

      if (write(stampKey, list)) {
        closeSheet();
        tab = 'stamps';
        render();
      }
    }

    function addPhoto() {
      $('#photoInput').click();
    }

    function resizeImage(file) {
      return new Promise((resolve, reject) => {
        const image = new Image();
        const url = URL.createObjectURL(file);

        image.onload = () => {
          const scale = Math.min(
            1,
            650 / Math.max(image.width, image.height)
          );

          const canvas = document.createElement('canvas');

          canvas.width = Math.max(
            1,
            Math.round(image.width * scale)
          );

          canvas.height = Math.max(
            1,
            Math.round(image.height * scale)
          );

          canvas.getContext('2d').drawImage(
            image, 0, 0, canvas.width, canvas.height
          );

          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL('image/jpeg', 0.65));
        };

        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error('Invalid image'));
        };

        image.src = url;
      });
    }

    $('#photoInput').onchange = async event => {
      const journey = active();
      if (!journey) return;

      const files = [...event.target.files].slice(0, 6);
      event.target.value = '';

      const list = read(photoKey);

      for (const file of files) {
        try {
          const src = await resizeImage(file);

          list.push({
            id: 'P-' + Date.now() + '-' +
              Math.random().toString(36).slice(2, 7),
            journeyId: journey.id,
            src,
            takenAt: new Date().toISOString()
          });
        } catch (error) {
          console.error(error);
        }
      }

      if (write(photoKey, list)) {
        tab = 'photos';
        render();
      }
    };

    function previewPhoto(id) {
      const journey = view === 'pastDetail'
        ? selected
        : active();

      if (!journey) return;

      const photo = photos(journey).find(
        item => String(item.id) === String(id)
      );

      if (!photo) return;

      $('#previewImg').src = photo.src || photo.image;

      $('#previewText').textContent =
        'Day ' + travelDay(journey, photo) +
        ' · ' + fmt(photo.takenAt || photo.createdAt);

      $('#preview').classList.add('show');
    }

    $('#closePreview').onclick = () => {
      $('#preview').classList.remove('show');
    };

    function endJourney() {
      const journey = active();

      if (!journey) return;

      if (!confirm(
        'End this journey? Your memories will remain in Past Journeys.'
      )) return;

      const list = journeys();

      const target = list.find(
        item => String(item.id) === String(journey.id)
      );

      if (!target) return;

      target.status = 'completed';
      target.endedAt = new Date().toISOString();

      if (write(journeyKey, list)) {
        view = 'pastList';
        render();
      }
    }

    function deleteJourney() {
      const journey = view === 'pastDetail'
        ? selected
        : active();

      if (!journey) return;

      const confirmed = confirm(
        'Delete this journey permanently? Its photos, stamps and bookings will also be removed. This cannot be undone.'
      );

      if (!confirmed) return;

      const remainingJourneys = journeys().filter(
        item => String(item.id) !== String(journey.id)
      );

      const remainingPhotos = read(photoKey).filter(
        item => !belongs(item, journey)
      );

      const remainingStamps = read(stampKey).filter(
        item => !belongs(item, journey)
      );

      const remainingBookings = read(bookingKey).filter(
        item => !belongs(item, journey)
      );

      try {
        localStorage.setItem(
          journeyKey,
          JSON.stringify(remainingJourneys)
        );

        localStorage.setItem(
          photoKey,
          JSON.stringify(remainingPhotos)
        );

        localStorage.setItem(
          stampKey,
          JSON.stringify(remainingStamps)
        );

        localStorage.setItem(
          bookingKey,
          JSON.stringify(remainingBookings)
        );

        selected = null;
        view = 'active';
        tab = 'photos';

        render();

      } catch (error) {
        alert('Unable to delete journey. Please try again.');
        console.error(error);
      }
    }

    document.addEventListener('click', event => {
      const element = event.target.closest(
        '[data-action],[data-tab],[data-past],[data-collect],[data-preview]'
      );

      if (!element) return;

      if (element.dataset.tab) {
        tab = element.dataset.tab;
        render();
        return;
      }

      if (element.dataset.past) {
        selected = past().find(
          journey => String(journey.id) === element.dataset.past
        );

        if (selected) {
          view = 'pastDetail';
          tab = 'photos';
          render();
        }
        return;
      }

      if (element.dataset.collect) {
        collectStamp(element.dataset.collect);
        return;
      }

      if (element.dataset.preview) {
        previewPhoto(element.dataset.preview);
        return;
      }

      switch (element.dataset.action) {
        case 'home':
          view = 'active';
          selected = null;
          tab = 'photos';
          render();
          break;

        case 'past':
          view = 'pastList';
          selected = null;
          render();
          break;

        case 'start':
          startJourney();
          break;

        case 'scan':
          scanQR();
          break;

        case 'photo':
          addPhoto();
          break;

        case 'end':
          endJourney();
          break;

        case 'delete':
          deleteJourney();
          break;

        case 'close':
          closeSheet();
          break;

        case 'discover':
          location.href = 'discover.html';
          break;
      }
    });

    /* RESPONSIVE PHONE — NO FIXED SCALE(.88) */
    function resizePhone() {
      const stage = document.getElementById('stage');

      if (window.matchMedia('(max-width:500px)').matches) {
        stage.style.transform = 'none';
        return;
      }

      const scale = Math.min(
        (window.innerWidth - 24) / 414,
        (window.innerHeight - 24) / 868,
        1
      );

      stage.style.transform =
        `scale(${Math.max(0.35, scale)})`;
    }

    window.addEventListener('resize', resizePhone);

    resizePhone();
    render();

  })();
</script>

</body>
</html>
