<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Journeys — Terooka</title>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #5724a3;
      --pink: #d842a0;
      --ink: #32204b;
      --muted: #796b85;
      --line: #e8daf0;
      --gradient: linear-gradient(110deg,#5724a3,#a448b7,#d842a0);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #ede4f5;
      color: var(--ink);
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid var(--pink);
      outline-offset: 3px;
    }

    /* ======================================
       PHONE FRAME — MATCH HOME
    ====================================== */

    .stage {
      position: relative;
      width: 414px;
      height: 868px;
      flex-shrink: 0;
      margin: 0;
      transform-origin: center;
    }

    .phone {
      position: relative;
      width: 414px;
      height: 868px;
      padding: 12px;
      background: #111015;
      border-radius: 62px;
      box-shadow:
        0 24px 70px rgba(54,25,88,.23),
        0 0 0 2px #343039;
    }

    .phone::before,
    .phone::after {
      content: "";
      position: absolute;
      left: -5px;
      width: 4px;
      background: #302b35;
      border-radius: 4px;
    }

    .phone::before {
      top: 155px;
      height: 52px;
    }

    .phone::after {
      top: 228px;
      height: 69px;
    }

    .screen {
      position: relative;
      width: 390px;
      height: 844px;
      overflow: hidden;
      border-radius: 50px;
      background: linear-gradient(
        160deg,
        #f0e4fb 0%,
        #f9eaf5 35%,
        #fff9f7 70%,
        #ffece5 100%
      );
    }

    .glow { position:absolute; border-radius:50%; filter:blur(55px); pointer-events:none; z-index:0; }
    .glow-1 { width:240px;height:240px;top:-70px;right:-80px;background:rgba(216,66,160,.20); }
    .glow-2 { width:260px;height:260px;top:420px;left:-120px;background:rgba(136,52,185,.14); }

    .island {
      position: absolute;
      z-index: 30;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 118px;
      height: 34px;
      border-radius: 30px;
      background: #08070a;
    }

    .status {
      position: absolute;
      z-index: 29;
      top: 18px;
      left: 34px;
      right: 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      font-weight: 800;
    }

    .homebar {
      position: absolute;
      z-index: 30;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 5px;
      border-radius: 20px;
      background: #2f2837;
    }

    .scroll {
      position: absolute;
      inset: 0;
      z-index: 2;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 64px 20px 118px;
      scrollbar-width: none;
      scroll-behavior: smooth;
    }

    .scroll::-webkit-scrollbar { display: none; }

    /* ======================================
       TYPOGRAPHY
    ====================================== */

    h1, h2 {
      font-family: 'Fraunces', Georgia, serif;
      margin: 0;
    }

    h1 { font-size: 29px; }
    h2 { font-size: 23px; }

    .sub {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 20px;
    }

    .linkbtn {
      flex-shrink: 0;
      border: 0;
      border-radius: 13px;
      padding: 11px 14px;
      background: #f0e4f8;
      color: var(--purple);
      font-size: 11px;
      font-weight: 800;
    }

    /* ======================================
       JOURNEY CARD
    ====================================== */

    .hero {
      position: relative;
      padding: 22px;
      border-radius: 24px;
      background: var(--gradient);
      color: white;
      box-shadow: 0 12px 24px #6b2b9830;
    }

    .hero h2 {
      margin: 14px 0 6px;
      font-size: 25px;
    }

    .hero .sub { color: #ffffffdb; }

    .pill {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 30px;
      background: #ffffff32;
      font-size: 10px;
      font-weight: 800;
    }

    .hero-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .edit-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 7px 10px;
      border: 1px solid #ffffff65;
      border-radius: 12px;
      background: #ffffff25;
      color: white;
      font-size: 10px;
      font-weight: 800;
    }

    .edit-btn svg {
      width: 15px;
      height: 15px;
    }

    .destinations {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 18px;
    }

    .destination {
      padding: 8px 11px;
      border: 1px solid #ffffff50;
      border-radius: 30px;
      background: #ffffff25;
      font-size: 10px;
      font-weight: 700;
    }

    /* ======================================
       BUTTONS
    ====================================== */

    .btn {
      min-height: 48px;
      padding: 0 16px;
      border: 0;
      border-radius: 15px;
      font-size: 12px;
      font-weight: 800;
    }

    .primary {
      background: var(--gradient);
      color: white;
    }

    .secondary {
      border: 1px solid var(--line);
      background: white;
      color: var(--purple);
    }

    .full { width: 100%; }

    .action-area { margin-top: 15px; }

    .scan-btn {
      width: 100%;
      min-height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1.5px solid var(--purple);
      border-radius: 15px;
      background: white;
      color: var(--purple);
      font-size: 12px;
      font-weight: 800;
    }

    .scan-btn svg {
      width: 19px;
      height: 19px;
    }

    /* ======================================
       TABS
    ====================================== */

    .tabs {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      margin: 24px 0 18px;
      border-bottom: 1px solid var(--line);
    }

    .tab {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px 3px;
      border: 0;
      border-bottom: 3px solid transparent;
      background: transparent;
      color: #9c8bac;
      font-size: 11px;
      font-weight: 700;
    }

    .tab svg {
      width: 20px;
      height: 20px;
    }

    .tab.active {
      color: var(--purple);
      border-bottom-color: var(--pink);
    }

    /* ======================================
       EMPTY STATE
    ====================================== */

    .empty {
      padding: 29px 18px;
      border: 1px dashed #d9c4e9;
      border-radius: 20px;
      background: #ffffffaa;
      text-align: center;
    }

    .empty svg {
      width: 35px;
      height: 35px;
      margin-bottom: 12px;
      color: var(--purple);
    }

    .empty strong {
      display: block;
      font-size: 14px;
    }

    .empty p {
      margin: 9px 0 17px;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    /* ======================================
       PHOTOS
    ====================================== */

    .day {
      display: flex;
      justify-content: space-between;
      margin: 20px 0 10px;
      font-size: 12px;
    }

    .day span { color: var(--muted); }

    .photos {
      display: grid;
      grid-template-columns: repeat(3,1fr);
      gap: 5px;
    }

    .photo {
      aspect-ratio: 1;
      padding: 0;
      border: 0;
      border-radius: 8px;
      overflow: hidden;
      background: #eee1f3;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .add-photo-btn {
      width: 100%;
      margin-top: 15px;
    }

    /* ======================================
       STAMPS — 3 PER ROW
    ====================================== */

    .stamps {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 18px 8px;
      align-items: start;
    }

    .stamp {
      min-width: 0;
      text-align: center;
    }

    .stamp img {
      display: block;
      width: 100%;
      height: 112px;
      object-fit: contain;
    }

    .stamp > svg {
      width: 55px;
      height: 112px;
      padding: 20px 0;
      color: var(--purple);
    }

    .stamp strong {
      display: block;
      margin-top: 5px;
      font-size: 9px;
      line-height: 1.4;
    }

    .stamp span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 8px;
    }

    /* ======================================
       BOOKINGS / PAST JOURNEYS
    ====================================== */

    .listcard,
    .pastitem {
      display: block;
      width: 100%;
      margin-bottom: 11px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: white;
      color: var(--ink);
      text-align: left;
      text-decoration: none;
    }

    .listcard strong,
    .pastitem strong {
      font-size: 13px;
    }

    .listcard p,
    .pastitem p {
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.6;
    }

    .cardrow {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .cardrow > div:nth-child(2) {
      flex: 1;
      min-width: 0;
    }

    .cardicon {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #f2e8f9;
      color: var(--purple);
      flex-shrink: 0;
    }

    .cardicon svg {
      width: 24px;
      height: 24px;
    }

    .chevron {
      width: 18px;
      height: 18px;
      color: var(--purple);
    }

    .back { display:inline-flex; align-items:center; justify-content:center; width:42px; height:42px; margin-bottom:16px; padding:0; border:1px solid rgba(255,255,255,.88); border-radius:13px; background:rgba(255,255,255,.8); color:var(--purple); box-shadow:0 3px 12px #5724a312; }
    .back svg { width:22px; height:22px; stroke-width:2.4; }
    .destination-input-wrap { display:flex; flex-wrap:wrap; align-items:center; gap:7px; min-height:51px; padding:7px 10px; margin-top:9px; background:#fff; border:1px solid #e4d4ef; border-radius:13px; }
    .destination-input-wrap:focus-within { border-color:var(--purple); }
    .destination-chip { display:inline-flex; align-items:center; gap:6px; padding:7px 8px 7px 11px; border-radius:20px; background:#f0e4f8; color:var(--purple); font-size:11px; font-weight:800; }
    .destination-chip button { display:flex; align-items:center; justify-content:center; width:17px; height:20px; padding:0; border:0; border-radius:0; background:transparent; color:var(--purple); font-size:19px; font-weight:600; line-height:1; flex-shrink:0; }
    .destination-entry { flex:1 1 100px; width:100px; min-width:75px; padding:6px 3px; border:0; outline:0; background:transparent; font-size:12px; }
    .caption-sparkle { display:flex; align-items:center; justify-content:center; gap:7px; border:1px solid #e8d8f5; border-radius:13px; background:#fff; color:#5724a3; padding:10px 12px; font-weight:800; font-size:11px; }
    .caption-sparkle svg { width:19px;height:19px; }
    .caption-panel { position:absolute; z-index:65; left:18px; right:18px; bottom:67px; display:none; padding:17px; border-radius:20px; background:#fff9fd; color:#32204b; box-shadow:0 14px 35px #0006; }
    .caption-panel.show { display:block; }
    .caption-panel > strong { display:block; color:#32204b; font-size:14px; }
    .caption-panel > .sub { color:#796b85; opacity:1; }
    .caption-panel textarea { width:100%; min-height:82px; resize:vertical; margin-top:10px; padding:11px; border:1px solid #e4d4ef; border-radius:11px; font:12px/1.6 'Plus Jakarta Sans',sans-serif; }
    .caption-actions { display:flex; gap:8px; margin-top:10px; }
    .caption-actions button { flex:1; padding:10px 5px; border:0; border-radius:10px; background:#f0e4f8; color:#5724a3; font-weight:800; font-size:11px; }
    .caption-actions button:first-child { border: 1.5px solid #cbb1e1; background: #fff; }
    .caption-actions button { border-radius: 12px; min-height: 44px; display:inline-flex; align-items:center; justify-content:center; }
    .caption-actions button:last-child { background:linear-gradient(110deg,#5724a3,#d842a0); color:white; }
    .caption-actions button { gap:7px; border-radius:12px; min-width:0; }
    .caption-actions button svg { display:block; width:17px; height:17px; flex-shrink:0; }

    .danger {
      width: 100%;
      margin-top: 25px;
      border: 1px solid #f5d6e0;
      background: #fff0f3;
      color: #b33361;
    }

    .delete-journey {
      display: block;
      margin: 15px auto 4px;
      padding: 9px 14px;
      border: 0;
      background: transparent;
      color: #b33361;
      font-size: 11px;
      font-weight: 700;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    /* ======================================
       BOTTOM NAV — MATCH HOME
    ====================================== */

    .nav {
      position: absolute;
      z-index: 20;
      left: 16px;
      right: 16px;
      bottom: 22px;
      height: 66px;
      padding: 6px;
      display: grid;
      grid-template-columns: repeat(5,1fr);
      gap: 2px;
      background: rgba(255,255,255,.62);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 24px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      box-shadow: 0 14px 34px rgba(87,36,163,.16);
    }

    .nav a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      border-radius: 18px;
      color: #9886ab;
      text-decoration: none;
      font-size: 9px;
      font-weight: 700;
    }

    .nav a svg {
      width: 21px;
      height: 21px;
    }

    .nav a.active {
      background: #d842a01a;
      color: var(--purple);
    }

    /* ======================================
       START / EDIT / QR MODAL
    ====================================== */

    .overlay {
      position: absolute;
      z-index: 40;
      inset: 0;
      display: none;
      align-items: flex-end;
      background: #1c0d2c99;
    }

    .overlay.show { display: flex; }

    .sheet {
      width: 100%;
      max-height: 85%;
      overflow-y: auto;
      padding: 25px 22px 35px;
      border-radius: 28px 28px 0 0;
      background: #fff9fd;
    }

    .sheet h2 { margin-bottom: 9px; }

    .field {
      width: 100%;
      margin: 9px 0;
      padding: 13px;
      border: 1px solid #e4d4ef;
      border-radius: 13px;
      background: white;
      font-size: 13px;
      outline: none;
    }

    .field:focus {
      border-color: var(--purple);
    }

    .form-label {
      display: block;
      margin-top: 13px;
      font-size: 11px;
      font-weight: 800;
    }

    .option {
      width: 100%;
      margin: 5px 0;
      padding: 13px;
      border: 1px solid var(--line);
      border-radius: 13px;
      background: white;
      text-align: left;
      color: var(--ink);
      font-size: 12px;
    }

    .option strong { display: block; }

    .option small {
      display: block;
      margin-top: 5px;
      color: var(--muted);
    }

    .sheet-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .sheet-actions .btn { flex: 1; }

    /* ======================================
       PHOTO PREVIEW
    ====================================== */

    .preview {
      position: absolute;
      z-index: 50;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #180d25ed;
    }

    .preview.show { display: flex; }

    .preview img {
      max-width: 100%;
      max-height: 75%;
      object-fit: contain;
      border-radius: 10px;
    }

    .preview button {
      align-self: flex-end;
      margin-bottom: 20px;
      padding: 9px 15px;
      border: 0;
      border-radius: 30px;
      background: white;
    }

    .preview p {
      margin-top: 15px;
      color: white;
      font-size: 12px;
    }

    /* ======================================
       MOBILE
    ====================================== */

    @media (max-width:500px) {
      body {
        display: block;
        overflow: auto;
        background: white;
      }

      .stage,
      .phone {
        width: 100%;
        height: 100dvh;
        transform: none !important;
      }

      .phone {
        padding: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .phone::before,
      .phone::after,
      .island,
      .status,
      .homebar {
        display: none;
      }

      .screen {
        width: 100%;
        height: 100%;
        min-height: 650px;
        border-radius: 0;
      }

      .scroll {
        padding-top: 30px;
      }

      .nav {
        bottom: 13px;
      }
    }

    /* Saved camera photo with original Culture Lens information markers */
    .preview { justify-content: flex-start; overflow-y: auto; padding: 60px 22px 38px; gap: 10px; }
    .preview-toolbar { display:flex; width:100%; justify-content:space-between; align-items:center; gap:12px; }
    .preview-toolbar button { margin:0; align-self:auto; font-size:12px; font-weight:800; }
    .preview-toolbar .preview-delete { background:#ffe4ec; color:#ae2553; }
    .preview-toolbar button { width:42px; height:42px; padding:0; display:flex; align-items:center; justify-content:center; border-radius:13px; flex-shrink:0; }
    .preview-toolbar button svg { display:block; }
    #photoDetails { width:100%; }
    .preview-photo-area { position:relative; width:100%; max-width:350px; margin:0 auto; aspect-ratio:780 / 1688; }
    .preview-photo-area img { display:block; width:100%; height:100%; object-fit:fill; border-radius:14px; }
    .saved-marker { position:absolute; transform:translate(-50%,-50%); width:35px; height:35px; border:2px solid white; border-radius:50%; background:linear-gradient(110deg,#5724a3,#d842a0); color:white; font-size:17px; font-weight:800; box-shadow:0 0 0 5px #ffffff44; }
    .preview-info { margin-top:16px; font-size:12px; color:#f5eaff; line-height:1.6; text-align:center; }
    .preview-story-btn { display:block; width:100%; margin-top:14px; padding:14px; border:0; border-radius:14px; background:#fff; color:#5724a3; font-weight:800; }
    /* Compact full-screen photo viewer: no oversized gap or vertical scrolling */
    .preview {
      padding: 54px 16px 24px;
      gap: 8px;
      overflow: hidden;
      justify-content: flex-start;
    }
    .preview-toolbar { flex: 0 0 46px; }
    .preview-toolbar button { width:46px; height:46px; }
    #closePreview { font-size: 34px; line-height: 1; font-weight: 400; }
    #photoDetails {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .preview-photo-area {
      width: auto;
      max-width: 100%;
      height: 100%;
      max-height: 100%;
      aspect-ratio: 780 / 1688;
      flex: 0 1 auto;
      margin: 0 auto;
    }
    .preview-photo-area img { width:100%; height:100%; object-fit:fill; }
    .saved-marker {
      width:40px; height:40px; border:3px solid white;
      border-radius:50%; background:linear-gradient(115deg,#5724a3,#a448b7,#d842a0);
      color:white; font-size:18px; font-weight:800;
      box-shadow:0 0 0 7px #ffffff40,0 4px 14px #0008;
      display:flex; align-items:center; justify-content:center;
      padding:0; margin:0;
    }
    .preview-info { margin:0; flex-shrink:0; }
    .preview-story-btn { margin:0; flex-shrink:0; }
    #previewText { flex:0 0 auto; margin:0; padding:4px 0 0; text-align:center; }
    @media (max-width:500px) { .preview { padding:18px 16px 22px; } }

    /* Photo viewer: centred image, toolbar overlay, camera-matching markers */
    .preview.show { display:flex; }
    .preview {
      padding: 16px !important;
      overflow: hidden !important;
      justify-content: center !important;
      align-items: center !important;
      gap: 0 !important;
    }
    .preview-toolbar {
      position:absolute; z-index:4;
      top: max(16px, env(safe-area-inset-top));
      left:16px; right:16px; width:auto;
      display:flex; justify-content:space-between;
    }
    #photoDetails {
      position:absolute; inset: 76px 16px 64px;
      width:auto; min-height:0;
      display:flex; align-items:center; justify-content:center;
      padding:0; margin:0;
    }
    .preview-photo-area {
      position:relative; flex:none;
      width:min(100%, calc((100dvh - 180px) * 780 / 1688));
      height:auto; max-height:100%;
      aspect-ratio:780 / 1688;
      margin:0 auto;
    }
    .preview-photo-area img { width:100%; height:100%; object-fit:fill; }
    .preview .saved-marker {
      position:absolute; z-index:3;
      display:flex; align-items:center; justify-content:center;
      transform:translate(-50%,-50%);
      width:40px; height:40px; padding:0; margin:0;
      border:3px solid #fff; border-radius:50%;
      background:linear-gradient(115deg,#5724a3,#a448b7,#d842a0);

<script>
  (() => {
    'use strict';

    const $ = selector => document.querySelector(selector);

    /* =====================================
       SVG ICONS
    ===================================== */

    const icon = (name, size = 24) => {
      const paths = {
        camera:
          '<rect x="3" y="6" width="18" height="15" rx="3"/>' +
          '<circle cx="12" cy="13.5" r="3.5"/>' +
          '<path d="M8 6l1.5-3h5L16 6"/>',

        stamp:
          '<path d="M7 14h10l2 3v3H5v-3z' +
          'M9 14v-3c-2-2-2-6 3-6s5 4 3 6v3' +
          'M4 22h16"/>',

        bookings:
          '<path d="M3 6h18v4a2 2 0 0 0 0 4v4H3v-4a2 2 0 0 0 0-4z"/>' +
          '<path d="M12 6v12" stroke-dasharray="2 2"/>',

        map:
          '<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3z' +
          'M9 3v15M15 6v15"/>',

        book:
          '<path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5' +
          'A2.5 2.5 0 0 1 4 18.5Z"/>' +
          '<path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/>',

        edit:
          '<path d="M12 20h9"/>' +
          '<path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/>',

        back:
          '<path d="m15 18-6-6 6-6"/>',

        next:
          '<path d="m9 18 6-6-6-6"/>'
      };

      return `
      <svg width="${size}" height="${size}"
           viewBox="0 0 24 24"
           fill="none"
           stroke="currentColor"
           stroke-width="1.8"
           stroke-linecap="round"
           stroke-linejoin="round"
           aria-hidden="true">
        ${paths[name] || paths.map}
      </svg>
    `;
    };

    const qrIcon = `
    <svg viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3
               M16 3h3a2 2 0 0 1 2 2v3
               M3 16v3a2 2 0 0 0 2 2h3
               M21 16v3a2 2 0 0 1-2 2h-3"/>
      <rect x="7" y="7" width="4" height="4"/>
      <path d="M15 7h2v4h-2M7 15h4v2H7M15 15h2v2h-2"/>
    </svg>
  `;

    /* =====================================
       USER / STORAGE
    ===================================== */

    function getUser() {
      try {
        const session = JSON.parse(
          localStorage.getItem('terooka_session') || 'null'
        );

        return session?.username || session?.email || 'guest';
      } catch {
        return 'guest';
      }
    }

    const uid = getUser();

    const journeyKey = 'terooka_journeys_' + uid;
    const stampKey = 'terooka_stamps_' + uid;
    const photoKey = 'terooka_journey_photos_' + uid;
    const bookingKey = 'terooka_bookings_' + uid;
    const journalKey = 'terooka_travelogue_' + uid;

    const places = window.TerookaData?.places || [];

    const stampImages = {
      riverstory: 'riverfront_heritage_walk.png',
      laksa: 'rasa_sarawak_kitchen.png',
      beads: 'borneo_bead_studio.png',
      culturehouse: 'stories_of_borneo_gallery.png',
      weaving: 'anyaman_heritage_workshop.png',
      keklapis: 'kek_lapis_corner.png',
      baucraft: 'bau_heritage_craft_house.png',
      serian: 'serian_cultural_stories.png'
    };

    function read(key, fallback = []) {
      try {
        return JSON.parse(localStorage.getItem(key)) ?? fallback;
      } catch {
        return fallback;
      }
    }

    function write(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch {
        alert('Browser storage is full.');
        return false;
      }
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      }[char]));
    }

    function fmt(value) {
      const date = new Date(value);

      return isNaN(date)
        ? 'Unknown date'
        : date.toLocaleDateString('en-GB', {
          day: 'numeric',
          month: 'short',
          year: 'numeric'
        });
    }

    function journeys() {
      return read(journeyKey);
    }

    function active() {
      return journeys().find(j =>
        j.status === 'active' ||
        j.status === 'ongoing' ||
        (!j.status && !j.endedAt)
      );
    }

    function past() {
      return journeys().filter(j =>
        j.status === 'completed' || j.endedAt
      );
    }

    function belongs(item, journey) {
      return String(item.journeyId ?? item.journey_id ?? '') ===
        String(journey.id);
    }

    function photos(journey) {
      return read(photoKey).filter(p => belongs(p, journey));
    }

    function stamps(journey) {
      return read(stampKey).filter(s => belongs(s, journey));
    }

    function bookings(journey) {
      return read(bookingKey).filter(b => belongs(b, journey));
    }

    function destinations(journey) {
      if (
        Array.isArray(journey.destinations) &&
        journey.destinations.length
      ) {
        return journey.destinations;
      }

      return String(
        journey.destination || journey.city || 'Malaysia'
      )
        .split(',')
        .map(x => x.trim())
        .filter(Boolean);
    }

    function travelDay(journey, photo) {
      const a = new Date(
        journey.startDate || journey.startedAt || journey.date
      );

      const b = new Date(
        photo.takenAt || photo.createdAt || photo.date
      );

      if (isNaN(a) || isNaN(b)) return 1;

      a.setHours(0, 0, 0, 0);
      b.setHours(0, 0, 0, 0);

      return Math.max(
        1,
        Math.round((b - a) / 86400000) + 1
      );
    }

    let view = 'active';
    let selected = null;
    let tab = 'photos';

    /* =====================================
       EMPTY STATE
    ===================================== */

    function emptyState(symbol, title, description, action = '') {
      return `
      <div class="empty">
        ${icon(symbol, 35)}
        <strong>${title}</strong>
        <p>${description}</p>
        ${action}
      </div>
    `;
    }

    /* =====================================
       MAIN JOURNEY PAGE
    ===================================== */

    function render() {
      if (view === 'pastList') {
        renderPast();
        return;
      }

      const old = view === 'pastDetail';
      const journey = old ? selected : active();

      if (!journey) {
        $('#main').innerHTML = `
        <div class="header">
          <div>
            <h1>My Journeys</h1>
            <p class="sub">
              Your cultural adventures in one place.
            </p>
          </div>

          <button class="linkbtn" data-action="past">
            See all
          </button>
        </div>

        ${emptyState(
          'map',
          'No active journey yet',
          'Start a journey to discover culture, collect stamps and save your memories.',
          '<button class="btn primary" data-action="start">Start Journey</button>'
        )}
      `;
        return;
      }

      $('#main').innerHTML = `
      ${old ? `
        <button class="back" data-action="past">
          ${icon('back', 22)}
        </button>
      ` : ''}

      <div class="header">
        <div>

    function setupDestinations(wrapId, inputId, initial = []) {
      const wrap = document.getElementById(wrapId);
      const input = document.getElementById(inputId);
      let values = [];
      const tidy = value => String(value).trim().replace(/\s+/g,' ').toLowerCase().replace(/(^|[\s-])([a-z])/g, (_,sep,ch) => sep + ch.toUpperCase());
      function paint() {
        wrap.querySelectorAll('.destination-chip').forEach(el => el.remove());
        values.forEach((value,index) => {
          const chip=document.createElement('span'); chip.className='destination-chip';
          const text=document.createElement('span'); text.textContent=value;
          const remove=document.createElement('button'); remove.type='button'; remove.innerHTML='<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>'; remove.setAttribute('aria-label','Remove '+value);
          remove.onclick=()=>{values.splice(index,1);paint();input.focus();};
          chip.append(text,remove); wrap.insertBefore(chip,input);
        });
      }
      function add(value) { const formatted=tidy(value); if(formatted && !values.some(x=>x.toLowerCase()===formatted.toLowerCase()))values.push(formatted); input.value='';paint(); }
      initial.forEach(add);
      input.addEventListener('keydown',e=>{
        if(e.key==='Enter'||e.key===','){e.preventDefault();add(input.value);}
        if(e.key==='Backspace'&&!input.value&&values.length){values.pop();paint();}
      });
      input.addEventListener('input',()=>{if(input.value.includes(',')){input.value.split(',').forEach(add);}});
      input.addEventListener('blur',()=>{if(input.value.trim())add(input.value);});
      wrap.addEventListener('click',e=>{if(e.target===wrap)input.focus();});
      return ()=>{if(input.value.trim())add(input.value);return [...values];};
    }

    function collectStamp(id) {
      const journey = active();
      const place = places.find(p => p.id === id);

      if (!journey || !place) return;

      if (
        stamps(journey).some(s =>
          (s.placeId || s.id) === id
        )
      ) return;

      const list = read(stampKey);

      list.push({
        placeId: id,
        placeName: place.name,
        city: place.city,
        journeyId: journey.id,
        collectedAt: new Date().toISOString(),
        verification: 'prototype-collection'
      });

      if (write(stampKey, list)) {
        closeSheet();
        tab = 'stamps';
        render();

    /* =====================================
       PHOTO PREVIEW
    ===================================== */

    let previewedPhotoId = null;
    let previewPhotoIds = [];

    function navigatePhoto(direction) {
      if (!previewPhotoIds.length) return;
      const index = previewPhotoIds.findIndex(id => String(id) === String(previewedPhotoId));
      if (index < 0) return;
      const next = index + direction;
      if (next < 0 || next >= previewPhotoIds.length) return;
      previewPhoto(previewPhotoIds[next]);
    }
    $('#previousPhoto').onclick = () => navigatePhoto(-1);
    $('#nextPhoto').onclick = () => navigatePhoto(1);

    function previewPhoto(id) {
      const journey = view === 'pastDetail' ? selected : active();
      if (!journey) return;
      const photo = photos(journey).find(item => String(item.id) === String(id));
      if (!photo) return;
      // Follow the same day-descending order as the journey photo grid.
      previewPhotoIds = photos(journey).slice().sort((a, b) =>
        travelDay(journey, b) - travelDay(journey, a)
      ).map(item => item.id);
      previewedPhotoId = id;
      const currentIndex = previewPhotoIds.findIndex(photoId => String(photoId) === String(id));
      $('#previousPhoto').hidden = currentIndex <= 0;
      $('#nextPhoto').hidden = currentIndex >= previewPhotoIds.length - 1;
      $('#previewText').textContent = 'Day ' + travelDay(journey, photo) +
        ' · ' + fmt(photo.takenAt || photo.createdAt);

      const details = $('#photoDetails');
      const discoveries = Array.isArray(photo.discoveries) ? photo.discoveries : [];
      const pose = photo.poseInfo;
      details.innerHTML = '';
      const photoArea = document.createElement('div');
      photoArea.className = 'preview-photo-area';
      const photoImage = document.createElement('img');
      photoImage.src = photo.src || photo.image;
      photoImage.alt = 'Saved journey photo';
      photoArea.appendChild(photoImage);
      if (discoveries.length) {
        discoveries.forEach((discovery, index) => {
          const marker = document.createElement('button');
          marker.className = 'saved-marker';
          marker.textContent = 'i';
          marker.title = discovery.title || 'Cultural information';
          marker.style.left = Math.max(0, Math.min(100, Number(discovery.x) || 50)) + '%';
          marker.style.top = Math.max(0, Math.min(100, Number(discovery.y) || 50)) + '%';
          marker.onclick = () => showPhotoStory(discovery);
          photoArea.appendChild(marker);
        });
      }
      details.appendChild(photoArea);
      if (pose && !discoveries.length) {
        const marker = document.createElement('button');
        marker.className = 'saved-marker';
        marker.textContent = 'i';
        marker.title = 'Cultural inspiration';
        marker.setAttribute('aria-label', 'Learn about this pose');
        marker.style.left = '55%';
        marker.style.top = '60%';
        marker.onclick = () => showPhotoStory(pose);
        photoArea.appendChild(marker);
      }
      $('#captionPanel').classList.remove('show');
      $('#preview').classList.add('show');
    }

    let captionVariation=0;
    function suggestCaption() {
      const journey=view==='pastDetail'?selected:active();
      const photo=journey&&photos(journey).find(p=>String(p.id)===String(previewedPhotoId));
      const locationName=photo?.placeName||photo?.location||destinations(journey||{}).join(' & ');
      const where=String(locationName||'Malaysia').replace(/[<>]/g,'');
      const options=[
        `A little moment from ${where}, a memory worth keeping. ✨ #Terooka #TravelMemories`,
        `Exploring ${where}, one photo and one beautiful memory at a time. 💜 #Terooka`,
        `New places, lovely memories, and stories to remember. 📸 ${where} #Terooka`,
        `Collecting moments, not just destinations. 🌸 Greetings from ${where}!`
      ];
      document.getElementById('captionText').value=options[captionVariation++%options.length];
      document.getElementById('captionPanel').classList.add('show');
    }
    $('#captionSparkle').onclick=()=>{if($('#captionPanel').classList.contains('show'))$('#captionPanel').classList.remove('show');else suggestCaption();};
    $('#refreshCaption').onclick=suggestCaption;
    $('#shareCaption').onclick=async()=>{
      const caption=$('#captionText').value.trim();
      const journey=view==='pastDetail'?selected:active();
      const photo=journey&&photos(journey).find(p=>String(p.id)===String(previewedPhotoId));
      const src=photo?.src||photo?.image;
      let file=null;
      if(src){
        try{
          const response=await fetch(src);
          if(!response.ok) throw new Error('Image unavailable');
          const blob=await response.blob();
          const extension=blob.type==='image/jpeg'?'jpg':'png';
          file=new File([blob],`terooka-journey-photo.${extension}`,{type:blob.type||'image/png'});
        }catch(e){ console.warn('Could not prepare photo for sharing',e); }
      }
      try{
        if(file && navigator.share && navigator.canShare?.({files:[file]})){
          await navigator.share({files:[file],text:caption,title:'My Terooka Memory'});
          return;
        }
        if(navigator.share){
          await navigator.share({text:caption,title:'My Terooka Memory'});
          return;
        }
        if(file){
          const url=URL.createObjectURL(file);
          const link=document.createElement('a');
          link.href=url;link.download=file.name;
          document.body.appendChild(link);link.click();link.remove();
          setTimeout(()=>URL.revokeObjectURL(url),2000);
        }
        try{await navigator.clipboard.writeText(caption);}
        catch{const el=$('#captionText');el.focus();el.select();document.execCommand('copy');}
        alert(file?'Photo downloaded and caption copied. Ready to share!':'Caption copied. You can share it now!');
      }catch(error){
        if(error?.name!=='AbortError') alert('Sharing was not available. Please try again.');
      }
    };

    const cultureSavedKey = 'terooka_culture_saved_' + uid;
    let currentStoryId = null;
    function updateStoryBookmark() {
      const saved = currentStoryId && read(cultureSavedKey).includes(currentStoryId);
      const button = $('#storyBookmark');
      button.classList.toggle('saved', Boolean(saved));
      button.setAttribute('aria-pressed', String(Boolean(saved)));
      button.setAttribute('aria-label', saved ? 'Remove saved story' : 'Save cultural story');
      button.title = saved ? 'Remove Saved Story' : 'Save Story';
    }
    $('#storyBookmark').onclick = () => {
      if (!currentStoryId) return;
      const ids = read(cultureSavedKey);
      const next = ids.includes(currentStoryId) ? ids.filter(id => id !== currentStoryId) : [currentStoryId, ...ids];
      if (write(cultureSavedKey, next)) updateStoryBookmark();
    };

    function showPhotoStory(data) {
      const url = String(data.storyUrl || '');
      const isNgajat = /(?:ngajat|pose)/i.test([data.title, data.id, url].join(' '));
      const clean = value => String(value || '')
        .split(/\n\s*\n/)
        .map(p => p.trim())
        .filter(p => p && !/prototype marker|specific motif.*confirm|terooka demo|verification pending|specific decoration.*verified|illustrated pose|follow the illustration|creative guide|artistic pose|artistic interpretation|formal instruction in traditional dance/i.test(p))
        .join('\n\n');
      $('#storyCategory').textContent = isNgajat ? 'Music & Dance' : (data.category || 'Cultural information');
      $('#storyTitle').textContent = isNgajat ? 'Ngajat Traditional Dance' : (data.title || 'Cultural Story');
      $('#storyDescription').textContent = isNgajat
        ? 'Ngajat is a traditional Iban dance from Sarawak, performed at celebrations such as Gawai Dayak. Its movements, music and attire reflect Iban cultural heritage.'
        : [clean(data.description), clean(data.note)].filter(Boolean).join('\n\n');
      // Do not show outdated prototype or unverified source labels from saved photos.
      $('#storySource').textContent = '';
      $('#storySource').style.display = 'none';
      const link = $('#storyLinkSaved');
      const storyUrl = isNgajat ? 'cultural-story.html?id=ngajat' : url;
      if (/^cultural-story\.html\?id=[a-zA-Z0-9_-]+$/.test(storyUrl)) {
        link.href = storyUrl + '&from=journey';
        link.hidden = false;
        currentStoryId = new URLSearchParams(storyUrl.split('?')[1]).get('id');
      } else {
        link.hidden = true;
        currentStoryId = null;
      }
      $('#storyActions').style.display = currentStoryId ? 'flex' : 'none';
      updateStoryBookmark();
      $('#photoStory').classList.add('show');
    }

    $('#closeStory').onclick = () => $('#photoStory').classList.remove('show');
    $('#closePreview').onclick = () => {
      $('#photoStory').classList.remove('show');
      $('#captionPanel').classList.remove('show');
      $('#preview').classList.remove('show');
    };
    $('#deletePhoto').onclick = () => {
      const journey = view === 'pastDetail' ? selected : active();
      if (!journey || previewedPhotoId == null) return;
      if (!confirm('Delete this photo from your journey? This cannot be undone.')) return;
      const remaining = read(photoKey).filter(p =>
        !(belongs(p, journey) && String(p.id) === String(previewedPhotoId))
      );
      if (write(photoKey, remaining)) {
        $('#photoStory').classList.remove('show');
        $('#captionPanel').classList.remove('show');
        $('#preview').classList.remove('show');
        previewedPhotoId = null;
        render();
      }
    };

    /* =====================================
       END JOURNEY
    ===================================== */

    function endJourney() {
      const journey = active();

      if (!journey) return;

      if (!confirm(
        'End this journey? Your memories will remain in Past Journeys.'
      )) return;

      const list = journeys();

      const target = list.find(
        item => String(item.id) === String(journey.id)
      );

      if (!target) return;

      target.status = 'completed';
      target.endedAt = new Date().toISOString();

      if (write(journeyKey, list)) {
        view = 'pastList';
        render();
      }
    }

    /* =====================================
       DELETE JOURNEY
    ===================================== */

    function deleteJourney() {
      const journey = view === 'pastDetail'
        ? selected
        : active();

      if (!journey) return;

      const confirmed = confirm(
        'Delete this journey permanently? Its linked journal, photos and stamps will also be deleted. This cannot be undone.'
      );

      if (!confirmed) return;

      const remainingJourneys = journeys().filter(
        item => String(item.id) !== String(journey.id)
      );

      const remainingPhotos = read(photoKey).filter(
        item => !belongs(item, journey)
      );

      const remainingStamps = read(stampKey).filter(
        item => !belongs(item, journey)
      );

      const remainingBookings = read(bookingKey).filter(
        item => !belongs(item, journey)
      );

      const remainingJournals = read(journalKey).filter(
        book => String(book.journeyId ?? '') !== String(journey.id)
      );

      try {
        localStorage.setItem(
          journeyKey,
          JSON.stringify(remainingJourneys)
        );

        localStorage.setItem(
          photoKey,
          JSON.stringify(remainingPhotos)
        );

        localStorage.setItem(
          stampKey,
          JSON.stringify(remainingStamps)
        );

        localStorage.setItem(
          bookingKey,
          JSON.stringify(remainingBookings)
        );

        localStorage.setItem(
          journalKey,
          JSON.stringify(remainingJournals)
        );

        selected = null;
        view = 'active';
        tab = 'photos';

        render();

      } catch (error) {
        alert('Unable to delete journey. Please try again.');
        console.error(error);
      }
    }

    /* =====================================
       BUTTON EVENTS
    ===================================== */

    document.addEventListener('click', event => {
      const element = event.target.closest(
        '[data-action],[data-tab],[data-past],' +
        '[data-collect],[data-preview]'
      );

      if (!event.target.closest('.journey-menu-wrap')) {
        const menu = document.getElementById('journeyMenu');
        if (menu) menu.hidden = true;
        const more = document.querySelector('.journey-more');
        if (more) more.setAttribute('aria-expanded', 'false');
      }
      if (!element) return;

      if (element.dataset.tab) {
        tab = element.dataset.tab;
        render();
        return;
      }

      if (element.dataset.past) {
        selected = past().find(
          journey =>
            String(journey.id) === element.dataset.past
        );

        if (selected) {
          view = 'pastDetail';
          tab = 'photos';
          render();
        }

        return;
      }

      if (element.dataset.collect) {
        collectStamp(element.dataset.collect);
        return;
      }

      if (element.dataset.preview) {
        previewPhoto(element.dataset.preview);
        return;
      }

      switch (element.dataset.action) {
        case 'home':
          view = 'active';
          selected = null;
          tab = 'photos';
          render();
          break;

        case 'past':
          view = 'pastList';
          selected = null;
          render();
          break;

        case 'start':
          startJourney();
          break;

        case 'edit':
          editJourney();
          break;

        case 'scan':
          scanQR();
          break;

        case 'end':
          endJourney();
          break;

        case 'menu': {
          const menu = document.getElementById('journeyMenu');
          if (menu) {
            menu.hidden = !menu.hidden;
            element.setAttribute('aria-expanded', String(!menu.hidden));
          }
          break;
        }

        case 'delete':
          deleteJourney();
          break;

        case 'close':
          closeSheet();
          break;

        case 'discover':
          location.href = 'discover.html';
          break;
      }
    });

    /* =====================================
       PHONE SCALING — MATCH HOME
    ===================================== */

    function resizePhone() {
      const stage = document.querySelector('.stage');

      if (window.innerWidth <= 500) {
        stage.style.transform = '';
        return;
      }

      const scale = Math.min(
        1,
        (window.innerHeight - 28) / 868,
        (window.innerWidth - 28) / 414
      );

      stage.style.transform = 'scale(' + scale + ')';
    }

    window.addEventListener('resize', resizePhone);

    resizePhone();
    render();

  })();
</script>

</body>
</html>
