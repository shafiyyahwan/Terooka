<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Journal — Terooka</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      --purple:#5724A3;
      --pink:#D842A0;
      --ink:#32204B;
      --muted:#796B85;
      --outer:#EDE4F5;
      --serif:'Fraunces',Georgia,serif;
      --sans:'Plus Jakarta Sans',sans-serif;
      --grad:linear-gradient(105deg,#5724A3,#8834B9 52%,#D842A0);
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%}
    button,input,select{font-family:inherit}
    body{
      background:var(--outer);
      font-family:var(--sans);
      color:var(--ink);
      display:grid;
      place-items:center;
      overflow:hidden;
    }
    .stage{
      width:414px;
      height:868px;
      flex-shrink:0;
      transform-origin:center center;
    }
    .phone{
      width:414px;
      height:868px;
      padding:12px;
      background:#111015;
      border-radius:62px;
      box-shadow:0 24px 70px #3619583b,0 0 0 2px #343039;
    }
    .phone{position:relative}
    .phone::before,.phone::after{
      content:"";position:absolute;left:-5px;width:4px;
      background:#302b35;border-radius:4px;
    }
    .phone::before{top:155px;height:52px}
    .phone::after{top:228px;height:69px}
    .screen{
      position:relative;
      width:390px;
      height:844px;
      overflow:hidden;
      border-radius:50px;
      background:linear-gradient(160deg,#F0E4FB,#F9EAF5 35%,#FFF9F7 70%,#FFECE5);
    }
    .island{
      position:absolute;
      z-index:50;
      top:11px;
      left:50%;
      transform:translateX(-50%);
      width:118px;
      height:34px;
      border-radius:30px;
      background:#08070a;
    }
    .status{
      position:absolute;
      z-index:49;
      top:18px;
      left:34px;
      right:30px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      font-size:14px;
      font-weight:800;
    }
    .homebar{
      position:absolute;
      bottom:8px;
      left:50%;
      transform:translateX(-50%);
      width:126px;
      height:5px;
      border-radius:20px;
      background:#2F2837;
      z-index:60;
    }
    .scroll{
      position:absolute;
      inset:0;
      padding:64px 22px 118px;
      overflow-y:auto;
      scrollbar-width:none;
    }
    .scroll::-webkit-scrollbar{display:none}
    h1{
      margin:0;
      font:600 30px/1.1 var(--serif);
      letter-spacing:-.025em;
      color:#32145B;
    }
    .sub{
      font-size:12px;
      color:var(--muted);
      line-height:1.5;
      margin:8px 0 0;
    }
    .count{
      margin:18px 2px 12px;
      font-size:11px;
      font-weight:700;
      color:var(--muted);
    }
    .shelf{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:24px 20px;
      perspective:900px;
    }
    .journal-entry{min-width:0;display:flex;flex-direction:column;gap:10px}
    .journal-actions{display:flex;justify-content:center;align-items:center;gap:12px}
    .journal-icon-btn{width:36px;height:36px;border:1px solid #e5d6f0;border-radius:50%;background:#fffafeee;color:var(--purple);display:grid;place-items:center;cursor:pointer;box-shadow:0 3px 9px #5724a315}
    .journal-icon-btn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .journal-icon-btn.delete{color:#b33361}
    .journal-icon-btn:hover{background:#f1e7fa}
    .colour-options{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:22px 0 10px}
    .colour-choice{aspect-ratio:1;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 1px #d7c6e6;cursor:pointer}
    .colour-choice.selected{box-shadow:0 0 0 3px var(--purple)}
    .colour-note{font-size:11px;color:var(--muted);line-height:1.6}
    .book{
      position:relative;
      width:100%;
      aspect-ratio:3/4.1;
      border:0;
      border-radius:4px 14px 14px 4px;
      overflow:hidden;
      padding:18px 12px 12px 24px;
      color:white;
      text-align:left;
      cursor:pointer;
      display:flex;
      flex-direction:column;
      box-shadow:0 14px 22px #5724a33d,inset 0 0 0 1px #ffffff24;
      transition:transform .3s;
      transform-origin:left center;
    }
    .book:hover{transform:rotateY(-8deg) translateY(-3px)}
    .book .spine{
      position:absolute;
      top:0;
      left:0;
      bottom:0;
      width:14px;
      background:#0004;
      border-right:2px dashed #ffffff55;
    }
    .book .bookmark{
      position:absolute;
      top:0;
      right:20px;
      bottom:0;
      width:9px;
      background:#FFD166;
      box-shadow:-1px 0 3px #0003;
    }
    .plate{
      position:relative;
      z-index:1;
      margin:12px 30px 0 0;
      padding:9px 8px;
      background:#fffdf8ef;
      color:#32145B;
      border-radius:4px;
      transform:rotate(-2deg);
      box-shadow:0 2px 5px #0003;
    }
    .plate b{
      display:block;
      font:600 14px/1.2 var(--serif);
      overflow-wrap:anywhere;
    }
    .bmeta{
      position:relative;
      z-index:1;
      margin-top:auto;
      font-size:10px;
      font-weight:700;
      line-height:1.4;
      white-space:pre-line;
      overflow-wrap:anywhere;
      text-shadow:0 1px 4px #0005;
    }
    .newbook{
      width:100%;
      aspect-ratio:3/4.1;
      border:2px dashed #C9B4E2;
      border-radius:14px;
      background:#ffffff73;
      color:var(--purple);
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:12px;
      font-size:13px;
      font-weight:700;
      cursor:pointer;
    }
    .plus-icon{
      display:flex;
      align-items:center;
      justify-content:center;
      width:48px;
      height:48px;
      border-radius:50%;
      background:rgba(87,36,163,.1);
      color:var(--purple);
      font-size:34px;
      font-weight:400;
      line-height:1;
    }
    .newbook:hover{
      background:#ffffffc9;
      border-color:var(--purple);
    }
    .nav{
      position:absolute;
      z-index:20;
      left:16px;
      right:16px;
      bottom:22px;
      height:66px;
      padding:6px;
      display:grid;
      grid-template-columns:repeat(5,1fr);
      gap:2px;
      border:1px solid white;
      border-radius:24px;
      background:#ffffffb3;
      backdrop-filter:blur(24px);
      box-shadow:0 14px 34px #5724a329;
    }
    .nav a{
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:3px;
      border-radius:18px;
      text-decoration:none;
      color:#7D6B92;
      font-size:9px;
      font-weight:700;
    }
    .nav svg{width:21px;height:21px}
    .nav a[aria-current="page"]{
      color:var(--purple);
      background:#d842a01a;
    }
    .overlay{
      position:absolute;
      z-index:70;
      inset:0;
      display:flex;
      align-items:flex-end;
      background:#28124261;
      opacity:0;
      pointer-events:none;
      transition:opacity .3s;
    }
    .overlay.open{
      opacity:1;
      pointer-events:auto;
    }
    .sheet{
      width:100%;
      max-height:90%;
      overflow-y:auto;
      padding:12px 22px 34px;
      border-radius:30px 30px 0 0;
      background:linear-gradient(170deg,#FBF4FF,#FFF7F5);
      transform:translateY(100%);
      transition:transform .35s;
    }
    .overlay.open .sheet{transform:none}
    .grab{
      width:40px;
      height:4px;
      margin:0 auto 16px;
      border-radius:4px;
      background:#D8C8E8;
    }
    .sheet h2{
      margin:0 0 5px;
      font:600 24px var(--serif);
    }
    .field{margin:15px 0}
    .field label{
      display:block;
      margin-bottom:6px;
      font-size:11px;
      font-weight:700;
    }
    .field input,.field select{
      width:100%;
      height:46px;
      padding:0 14px;
      border:1.5px solid #E5D6F0;
      border-radius:14px;
      background:white;
      color:var(--ink);
      outline:none;
    }
    .btn{
      width:100%;
      min-height:50px;
      margin-top:10px;
      border:0;
      border-radius:16px;
      background:var(--grad);
      color:white;
      font-size:13px;
      font-weight:800;
      cursor:pointer;
    }
    .error{
      margin:8px 0;
      font-size:12px;
      color:#C0224F;
    }
    @media(max-width:500px){
      body{display:block;overflow:auto}
      .stage,.phone{
        width:100%;
        height:100dvh;
        transform:none!important;
      }
      .phone{
        padding:0;
        border-radius:0;
        box-shadow:none;
      }
      .screen{
        width:100%;
        height:100%;
        border-radius:0;
      }
      .phone::before,.phone::after,.island,.status,.homebar{display:none}
      .scroll{padding-top:30px}
    }
  </style>
</head>
<body>

<div class="stage" id="stage">
  <div class="phone">
    <div class="screen">

      <div class="island"></div>
      <div class="status">
        <span>9:41</span>
        <svg width="70" height="15" viewBox="0 0 70 15" fill="none" aria-label="Signal, Wi-Fi and battery">
          <g fill="#32204B">
            <rect x="0" y="10" width="3" height="5" rx="1"/>
            <rect x="5" y="7" width="3" height="8" rx="1"/>
            <rect x="10" y="4" width="3" height="11" rx="1"/>
            <rect x="15" y="1" width="3" height="14" rx="1"/>
          </g>
          <g stroke="#32204B" stroke-width="1.8" stroke-linecap="round">
            <path d="M27 5Q34-1 41 5"/>
            <path d="M30 9Q34 5 38 9"/>
          </g>
          <circle cx="34" cy="12" r="1.5" fill="#32204B"/>
          <rect x="48" y="2" width="19" height="11" rx="3" stroke="#32204B" stroke-width="1.3"/>
          <rect x="50" y="4" width="15" height="7" rx="1.6" fill="#32204B"/>
          <path d="M69 5v5" stroke="#32204B" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </div>

      <main class="scroll">
        <h1>My Journal</h1>
        <p class="sub">
          Each journal is a book you can flip through.
          Tap one to open it.
        </p>
        <p class="count" id="count"></p>
        <div class="shelf" id="shelf"></div>
      </main>

      <nav class="nav">
        <a href="home.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
            <path d="m3 11 9-8 9 8M5 10v10h14V10"/>
          </svg>
          Home
        </a>
        <a href="discover.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
            <circle cx="12" cy="12" r="9"/>
            <path d="m15 9-2 4-4 2 2-4z"/>
          </svg>
          Discover
        </a>
        <a href="camera.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
            <rect x="3" y="6" width="18" height="15" rx="3"/>
            <circle cx="12" cy="13.5" r="3.5"/>
            <path d="M8 6l1.5-3h5L16 6"/>
          </svg>
          Camera
        </a>
        <a href="journal.html" aria-current="page">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
            <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5Z"/>
            <path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/>
          </svg>
          Journal
        </a>
        <a href="profile.html">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c0-5 16-5 16 0"/>
          </svg>
          Profile
        </a>
      </nav>

      <div class="overlay" id="overlay">
        <div class="sheet" id="sheet"></div>
      </div>

      <div class="homebar"></div>
    </div>
  </div>
</div>

<script src="journal-store.js"></script>
<script>
  (function(){
    'use strict';

    const stage=document.getElementById('stage');
    const shelf=document.getElementById('shelf');
    const overlay=document.getElementById('overlay');
    const sheet=document.getElementById('sheet');

    // Same scaling and centre alignment as journal-edit.html
    function fitPhone(){
      if(window.innerWidth<=500){
        stage.style.transform='none';
        return;
      }
      const scale=Math.min(
        1,
        (window.innerHeight-28)/868,
        (window.innerWidth-28)/414
      );
      stage.style.transform='scale('+scale+')';
    }

    fitPhone();
    window.addEventListener('resize',fitPhone);

    if(typeof session==='undefined'||!session)return;

    function getJourneys(){
      try{
        const data=JSON.parse(
          localStorage.getItem('terooka_journeys_'+uid)
        )||[];
        return Array.isArray(data)?data:[];
      }catch(e){
        return [];
      }
    }

    function destinations(j){
      if(Array.isArray(j.destinations)&&j.destinations.length){
        return j.destinations.map(d=>{
          if(typeof d==='string')return d;
          return d.name||d.title||d.city||d.destination||'';
        }).filter(Boolean);
      }
      return [j.destination||j.city||''].filter(Boolean);
    }

    function closeSheet(){
      overlay.classList.remove('open');
    }

    overlay.addEventListener('click',e=>{
      if(e.target===overlay)closeSheet();
    });

    function openSheet(content){
      sheet.innerHTML='';
      const grab=document.createElement('div');
      grab.className='grab';
      sheet.appendChild(grab);
      sheet.appendChild(content);
      overlay.classList.add('open');
    }

    function render(){
      shelf.innerHTML='';

      document.getElementById('count').textContent=
        books.length+' '+(books.length===1?'journal':'journals');

      books.forEach(b=>{
        const button=document.createElement('button');
        button.type='button';
        button.className='book';
        button.style.background=b.customCoverColor || cover(b);

        const spine=document.createElement('span');
        spine.className='spine';

        const bookmark=document.createElement('span');
        bookmark.className='bookmark';

        const plate=document.createElement('span');
        plate.className='plate';

        const title=document.createElement('b');
        title.textContent=b.title||'Untitled Journal';
        plate.appendChild(title);

        const meta=document.createElement('span');
        meta.className='bmeta';
        meta.textContent=
          (b.place||'')+'\n'+
          ((b.pages||[]).length)+' pages';

        button.append(spine,bookmark,plate,meta);
        button.onclick=()=>{
          location.href='journal-edit.html?id='+
            encodeURIComponent(b.id);
        };

        const entry=document.createElement('div');
        entry.className='journal-entry';
        entry.appendChild(button);

        const actions=document.createElement('div');
        actions.className='journal-actions';

        const pencil=document.createElement('button');
        pencil.type='button';
        pencil.className='journal-icon-btn';
        pencil.setAttribute('aria-label','Change journal cover colour');
        pencil.title='Change cover colour';
        pencil.innerHTML='<svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L9 17l-4 1 1-4Z"/></svg>';
        pencil.onclick=()=>changeJournalColour(b);

        const bin=document.createElement('button');
        bin.type='button';
        bin.className='journal-icon-btn delete';
        bin.setAttribute('aria-label','Delete journal');
        bin.title='Delete journal';
        bin.innerHTML='<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M5 6l1 15h12l1-15M10 10v7M14 10v7"/></svg>';
        bin.onclick=()=>deleteJournal(b);

        actions.append(pencil,bin);
        entry.appendChild(actions);
        shelf.appendChild(entry);
      });

      // Visible + symbol for New Journal
      const newBook=document.createElement('button');
      newBook.type='button';
      newBook.className='newbook';

      const plus=document.createElement('span');
      plus.className='plus-icon';
      plus.textContent='+';
      plus.setAttribute('aria-hidden','true');

      const label=document.createElement('span');
      label.textContent='New journal';

      newBook.append(plus,label);
      newBook.onclick=createJournal;
      shelf.appendChild(newBook);
    }

    function changeJournalColour(book){
      const colours=[
        ['Lavender','#9B75D0'],['Rose','#D86D9D'],
        ['Peach','#EBA27E'],['Sage','#78A993'],
        ['Sky','#78A8D7'],['Plum','#7453A9'],
        ['Coral','#D87976'],['Sunshine','#D9AE57'],
        ['Teal','#5D9EAB'],['Midnight','#4B567F']
      ];
      const content=document.createElement('div');
      const heading=document.createElement('h2');
      heading.textContent='Change Cover Colour';
      const description=document.createElement('p');
      description.className='sub';
      description.textContent=book.title||'Your journal';
      const palette=document.createElement('div');
      palette.className='colour-options';
      colours.forEach(([name,colour])=>{
        const choice=document.createElement('button');
        choice.type='button';
        choice.className='colour-choice'+(book.customCoverColor===colour?' selected':'');
        choice.style.background=colour;
        choice.title=name;
        choice.setAttribute('aria-label',name);
        choice.onclick=()=>{
          const previous=book.customCoverColor;
          book.customCoverColor=colour;
          if(!save()){
            book.customCoverColor=previous;
            alert('Could not save cover colour.');
            return;
          }
          closeSheet();
          render();
        };
        palette.appendChild(choice);
      });
      const note=document.createElement('p');
      note.className='colour-note';
      note.textContent='Choose a colour to update this journal cover. Your pages and photos stay the same.';
      content.append(heading,description,palette,note);
      openSheet(content);
    }

    function deleteJournal(book){
      if(!confirm('Delete "'+(book.title||'Untitled Journal')+'" permanently? All pages in this journal will be lost.'))return;
      const index=books.findIndex(item=>String(item.id)===String(book.id));
      if(index<0)return;
      const removed=books.splice(index,1)[0];
      if(!save()){
        books.splice(index,0,removed);
        alert('Could not delete journal.');
        return;
      }
      render();
    }

    function createJournal(){
      const journeys=getJourneys();
      const content=document.createElement('div');

      if(!journeys.length){
        content.innerHTML=`
        <h2>Start a Journey</h2>
        <p class="sub">
          Create a journey first to start your memory book.
        </p>
        <button class="btn" id="goJourney">
          Go to My Journeys
        </button>
      `;

        openSheet(content);

        content.querySelector('#goJourney').onclick=()=>{
          location.href='journey.html';
        };
        return;
      }

      const heading=document.createElement('h2');
      heading.textContent='New Journal';

      const description=document.createElement('p');
      description.className='sub';
      description.textContent=
        'Create a memory book for your journey.';

      const form=document.createElement('form');

      const journeyField=document.createElement('div');
      journeyField.className='field';

      const journeyLabel=document.createElement('label');
      journeyLabel.textContent='Link to journey';

      const select=document.createElement('select');
      select.required=true;

      const empty=document.createElement('option');
      empty.value='';
      empty.textContent='Select a journey';
      select.appendChild(empty);

      journeys.forEach(j=>{
        const option=document.createElement('option');
        option.value=String(j.id);
        option.textContent=
          (j.name||j.title||'Journey')+
          ' — '+destinations(j).join(', ');
        select.appendChild(option);
      });

      journeyField.append(journeyLabel,select);

      const titleField=document.createElement('div');
      titleField.className='field';

      const titleLabel=document.createElement('label');
      titleLabel.textContent='Journal title';

      const input=document.createElement('input');
      input.placeholder='e.g. My Sarawak Adventure';
      input.maxLength=60;
      input.required=true;

      titleField.append(titleLabel,input);

      const error=document.createElement('p');
      error.className='error';

      const submit=document.createElement('button');
      submit.className='btn';
      submit.type='submit';
      submit.textContent='Create journal';

      form.append(journeyField,titleField,error,submit);
      content.append(heading,description,form);

      form.onsubmit=e=>{
        e.preventDefault();

        const j=journeys.find(
          x=>String(x.id)===select.value
        );

        if(!j||!input.value.trim()){
          error.textContent=
            'Please select a journey and enter a title.';
          return;
        }

        const places=destinations(j);

        const book={
          id:Date.now(),
          title:input.value.trim(),
          journeyId:String(j.id),
          destinations:places,
          place:places.join(', '),
          date:new Date().toISOString(),
          pages:[
            {caption:'',items:[]},
            {caption:'',items:[]}
          ]
        };

        books.unshift(book);

        if(!save()){
          books.shift();
          error.textContent='Could not save journal.';
          return;
        }

        location.href='journal-edit.html?id='+
          encodeURIComponent(book.id);
      };

      openSheet(content);
    }

    render();
  })();
</script>
</body>
</html>
