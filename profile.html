<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EDE4F5">
  <title>Profile — Terooka</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--purple:#5724A3;--pink:#D842A0;--ink:#32204B;--muted:#796B85;--outer:#EDE4F5;--error:#C0224F;--serif:'Fraunces',Georgia,serif;--sans:'Plus Jakarta Sans',sans-serif;--grad:linear-gradient(105deg,var(--purple),#8834B9 52%,var(--pink))}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}button,input,textarea{font-family:inherit}
    body{background:var(--outer);font-family:var(--sans);color:var(--ink);min-height:100dvh;display:grid;place-items:center;overflow:hidden}
    .stage{width:414px;height:868px;flex-shrink:0;transform-origin:center}
    .phone{width:414px;height:868px;padding:12px;background:#111015;border-radius:62px;position:relative;box-shadow:0 24px 70px rgba(54,25,88,.23),0 0 0 2px #343039}
    .screen{width:390px;height:844px;border-radius:50px;position:relative;overflow:hidden;background:linear-gradient(160deg,#F0E4FB 0%,#F9EAF5 35%,#FFF9F7 70%,#FFECE5 100%)}
    .island{position:absolute;z-index:50;top:11px;left:50%;transform:translateX(-50%);height:34px;width:118px;background:#08070a;border-radius:30px}
    .status{position:absolute;top:18px;left:34px;z-index:49;font-size:14px;font-weight:800}
    .homebar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:126px;height:5px;background:#2F2837;border-radius:20px;z-index:60}
    .scroll{position:absolute;inset:0;z-index:2;overflow-y:auto;scrollbar-width:none;padding:64px 22px 118px}
    .scroll::-webkit-scrollbar{display:none}
    h1{font:600 30px/1.1 var(--serif);letter-spacing:-.025em;color:#32145B;margin:0}
    .sub{font-size:12px;color:var(--muted);margin:8px 0 0;line-height:1.5}
    button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
    .book{position:relative;aspect-ratio:3/4.1;border:0;color:#fff;text-align:left;cursor:pointer;display:flex;flex-direction:column;padding:18px 12px 12px 24px;border-radius:4px 14px 14px 4px;overflow:hidden;box-shadow:0 14px 22px rgba(87,36,163,.24),inset 0 0 0 1px rgba(255,255,255,.14);transition:transform .3s;transform-origin:left center}
    .book:hover{transform:rotateY(-12deg) translateY(-3px)}
    .book i{position:absolute;left:0;top:0;bottom:0;width:14px;background:rgba(0,0,0,.25);border-right:2px dashed rgba(255,255,255,.35)}
    .book u{position:absolute;right:20px;top:0;bottom:0;width:9px;background:rgba(255,209,102,.92);box-shadow:-1px 0 3px rgba(0,0,0,.2)}
    .plate{background:rgba(255,253,248,.94);color:#32145B;border-radius:4px;padding:9px 8px;margin:12px 34px 0 0;transform:rotate(-2deg);box-shadow:0 2px 5px rgba(0,0,0,.18)}
    .plate b{display:block;font:600 14px/1.2 var(--serif);word-break:break-word}
    .bmeta{margin-top:auto;font-size:10px;font-weight:700;line-height:1.4;white-space:pre-line;text-shadow:0 1px 4px rgba(0,0,0,.3)}
    .sticker{position:absolute;right:38px;bottom:12px;font-size:26px;transform:rotate(12deg)}
    .btn{display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;min-height:50px;padding:0 24px;border-radius:16px;background:var(--grad);color:#fff;font:800 13.5px var(--sans);box-shadow:0 12px 24px rgba(112,42,159,.2)}
    .btn.full{width:100%}
    /* NAV */
    .nav{position:absolute;z-index:20;left:16px;right:16px;bottom:22px;height:66px;padding:6px;display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:rgba(255,255,255,.62);border:1px solid #fff;border-radius:24px;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 14px 34px rgba(87,36,163,.16)}
    .nav a{border-radius:18px;color:#7D6B92;text-decoration:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font:700 9px var(--sans)}
    .nav a svg{width:21px;height:21px}
    .nav a[aria-current="page"]{color:var(--purple);background:rgba(216,66,160,.1)}
    .toast{position:absolute;z-index:80;left:50%;top:58px;transform:translate(-50%,-20px);background:#32204B;color:#fff;font-size:12px;font-weight:700;padding:11px 16px;border-radius:14px;opacity:0;pointer-events:none;transition:.3s;max-width:86%;text-align:center}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    @media(max-width:500px){body{display:block;overflow:auto}.stage,.phone{width:100%;height:100dvh;transform:none!important}.phone{padding:0;border-radius:0;box-shadow:none}.island,.status,.homebar{display:none}.screen{width:100%;height:100%;border-radius:0}.scroll{padding-top:30px}.viewer{padding-top:24px}.toast{top:24px}}
    @media(prefers-reduced-motion:reduce){.book,.sheet,.overlay,.toast,.viewer{transition:none}}

    h1{font-size:28px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--pink);margin:0 0 6px}
    .card{background:rgba(255,255,255,.62);border:1px solid #fff;border-radius:24px;padding:18px;box-shadow:0 10px 26px rgba(87,36,163,.1);margin-top:16px}
    .hd{display:flex;gap:14px;align-items:center}
    .av{width:72px;height:72px;border-radius:50%;background:var(--grad);color:#fff;font:600 32px var(--serif);display:grid;place-items:center;flex:none;box-shadow:0 8px 18px rgba(112,42,159,.3);border:3px solid #fff}
    .hd h1{font-size:22px}.hd p{margin:3px 0 0;font-size:12px;color:var(--muted);line-height:1.4}
    .ghost{border:1.5px solid #D9C5F0;background:#fff;color:var(--purple);font:800 12px var(--sans);border-radius:12px;min-height:44px;padding:0 14px;cursor:pointer}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px;text-align:center}
    .stats b{display:block;font:600 24px var(--serif);color:#32145B}.stats span{font-size:10px;font-weight:700;color:var(--muted)}
    .sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 10px}
    .sec h2{font:600 19px var(--serif);margin:0;color:#32145B}.sec a,.sec span{font-size:11px;font-weight:700;color:var(--purple);text-decoration:none}
    .bar{height:8px;border-radius:8px;background:#E9DDF2;overflow:hidden;margin:2px 0 14px}.bar i{display:block;height:100%;background:var(--grad)}
    .stamps{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
    .sm{aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;font:800 8px var(--sans);color:var(--purple);position:relative;border:0;background:none;padding:0;cursor:pointer}
    .sm img{width:100%;height:100%;object-fit:contain}.sm.lock{opacity:.35;filter:grayscale(1)}
    .sm .fb{width:100%;height:100%;border:2px double var(--purple);border-radius:50%;display:flex;align-items:center;justify-content:center;padding:6px}
    .row{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none;perspective:900px}
    .row .book{width:112px;flex:none;padding:12px 8px 8px 20px}.row .plate{margin-right:24px;padding:6px}.row .plate b{font-size:11px}
    .trav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .trav div{background:rgba(255,255,255,.62);border:1px solid #fff;border-radius:18px;padding:14px}
    .trav small{font-size:10px;font-weight:700;color:var(--muted);display:block;margin-bottom:4px}.trav b{font:600 15px/1.25 var(--serif);color:#32145B}
    .set{list-style:none;margin:0;padding:0}.set li{border-top:1px solid #EBDDF5}.set li:first-child{border:0}
    .set button{width:100%;min-height:50px;background:none;border:0;text-align:left;font:700 13px var(--sans);color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center}
    .set .out{color:var(--error)}
  </style>
</head>
<body>
<div class="stage" id="stage"><div class="phone"><div class="screen">
  <div class="island"></div><div class="status">9:41</div>
  <main class="scroll" id="main"></main>
  <nav class="nav" aria-label="Main navigation">
    <a href="home.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="m3 11 9-8 9 8M5 10v10h14V10"/></svg>Home</a>
    <a href="discover.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="12" r="9"/><path d="m15 9-2 4-4 2 2-4z"/></svg>Discover</a>
    <a href="journey.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 19c4-2 2-7 7-8s4-5 9-6M16 5h4v4"/><circle cx="4" cy="19" r="2"/></svg>Journey</a>
    <a href="journal.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v18H6.5A2.5 2.5 0 0 1 4 18.5Z"/><path d="M4 18.5A2.5 2.5 0 0 1 6.5 16H20"/></svg>Journal</a>
    <a href="profile.html" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 16-5 16 0"/></svg>Profile</a>
  </nav>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <div class="homebar"></div>
</div></div></div>
<script src="journal-store.js"></script>
<script>
  (function(){
    'use strict';
    if(!session)return;
    var PK='terooka_profile_'+uid,prof={};try{prof=JSON.parse(localStorage.getItem(PK))||{}}catch(e){}
    function visited(){var v=[];try{v=JSON.parse(localStorage.getItem('terooka_visited_'+uid))||[]}catch(e){}
      if(typeof window.terookaVisited==='function'){try{v=v.concat(window.terookaVisited()||[])}catch(e){}}
      books.forEach(function(b){if(b.place)v.push(b.place)});return v.map(function(x){return String(x).trim().toLowerCase()})}
    function stat(n,l){return el('div',{},el('b',{text:String(n)}),el('span',{text:l}))}
    function sec(t,link){return el('div',{class:'sec'},el('h2',{text:t}),link||null)}
    function render(){
      var m=$('#main');m.innerHTML='';
      var name=prof.name||String(uid).split('@')[0],v=visited(),got=STAMP_LIB.filter(function(s){return v.indexOf(s.id)>-1||v.indexOf(s.name.toLowerCase())>-1});
      var places={};books.forEach(function(b){if(b.place)places[b.place.toLowerCase()]=(places[b.place.toLowerCase()]||0)+1});
      var top=Object.keys(places).sort(function(a,b){return places[b]-places[a]})[0];
      m.appendChild(el('p',{class:'eyebrow',text:'Your passport'}));
      m.appendChild(el('div',{class:'card',style:'margin-top:0'},
        el('div',{class:'hd'},el('div',{class:'av','aria-hidden':'true',text:name.charAt(0).toUpperCase()}),
          el('div',{style:'flex:1;min-width:0'},el('h1',{text:name}),el('p',{text:prof.bio||'Add a short bio about how you travel.'}))),
        el('div',{class:'stats'},stat(Object.keys(places).length,'Places'),stat(books.length,'Journals'),stat(got.length,'Stamps')),
        el('button',{class:'ghost',type:'button',style:'width:100%;margin-top:14px',text:'Edit profile',onclick:function(){
            var n=prompt('Display name',name);if(n===null)return;var b=prompt('Short bio',prof.bio||'');
            prof.name=n.trim()||name;prof.bio=(b||'').trim();try{localStorage.setItem(PK,JSON.stringify(prof))}catch(e){}render()}})));
      m.appendChild(sec('Stamp collection',el('span',{text:got.length+' of '+STAMP_LIB.length})));
      var bar=el('div',{class:'bar'},el('i',{style:'width:'+Math.round(got.length/STAMP_LIB.length*100)+'%'}));
      var g=el('div',{class:'stamps'});
      STAMP_LIB.forEach(function(s){
        var ok=got.indexOf(s)>-1,im=el('img',{src:'stamps/'+s.id+'.png',alt:''});
        im.onerror=function(){im.replaceWith(el('span',{class:'fb',text:s.name}))};
        g.appendChild(el('button',{class:'sm'+(ok?'':' lock'),type:'button','aria-label':s.name+(ok?' stamp':' stamp, locked'),onclick:function(){toast(ok?s.name+' — collected!':'Visit '+s.name+' to unlock.')}},im));
      });
      m.appendChild(el('div',{class:'card'},bar,g));
      m.appendChild(sec('My journals',el('a',{href:'journal.html',text:'See all'})));
      if(!books.length)m.appendChild(el('div',{class:'card',style:'margin:0;text-align:center'},el('p',{class:'sub',text:'No journals yet. Start your first one.'}),el('a',{class:'btn',href:'journal.html',style:'text-decoration:none;margin-top:12px',text:'New journal'})));
      else{
        var row=el('div',{class:'row'});
        books.slice(0,4).forEach(function(b,i){row.appendChild(el('a',{class:'book',href:'journal-edit.html?id='+b.id,'aria-label':'Open '+b.title,style:'background:'+cover(b)+';text-decoration:none'},el('i'),el('u'),el('span',{class:'plate'},el('b',{text:b.title})),el('span',{class:'bmeta',text:b.pages.length+' pg'})))});
        m.appendChild(row);
        m.appendChild(el('a',{class:'btn full',href:'journal-edit.html?id='+books[0].id,style:'text-decoration:none',text:'Continue writing: '+books[0].title}));
      }
      m.appendChild(sec('Travel summary'));
      m.appendChild(el('div',{class:'trav'},
        el('div',{},el('small',{text:'Latest trip'}),el('b',{text:books[0]?books[0].title:'None yet'})),
        el('div',{},el('small',{text:'Most written about'}),el('b',{text:top?top.replace(/\b\w/g,function(c){return c.toUpperCase()}):'—'}))));
      m.appendChild(sec('Settings'));
      m.appendChild(el('div',{class:'card',style:'margin:0;padding:6px 18px'},el('ul',{class:'set'},
        el('li',{},el('button',{type:'button',onclick:function(){toast('Language switch coming soon.')}},'Language',el('span',{text:'English'}))),
        el('li',{},el('button',{type:'button',onclick:function(){var a=el('a',{href:URL.createObjectURL(new Blob([JSON.stringify(books)],{type:'application/json'})),download:'terooka-journals.json'});document.body.appendChild(a);a.click();a.remove()}},'Export my journals',el('span',{text:'JSON'}))),
        el('li',{},el('button',{class:'out',type:'button',onclick:function(){try{localStorage.removeItem('terooka_session')}catch(e){}location.replace('auth.html')}},'Log out')))));
    }
    render();
    var stage=$('#stage');function fit(){if(innerWidth<=500){stage.style.transform='';return}stage.style.transform='scale('+Math.min(1,(innerHeight-28)/868,(innerWidth-28)/414)+')'}
    fit();addEventListener('resize',fit);
  })();
</script>
</body>
</html>
