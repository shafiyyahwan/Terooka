<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EDE4F5">
  <title>Sign In — Terooka</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..700;1,9..144,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple: #5724A3;
      --pink: #D842A0;
      --ink: #32204B;
      --muted: #796B85;
      --outer: #EDE4F5;
      --error: #C0224F;
      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Plus Jakarta Sans', sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
    }

    body {
      background: var(--outer);
      font-family: var(--sans);
      color: var(--ink);
      min-height: 100dvh;
      display: grid;
      place-items: center;
      overflow: hidden;
    }

    /* PHONE FRAME */
    .stage {
      width: 414px;
      height: 868px;
      flex-shrink: 0;
      transform-origin: center;
    }

    .phone {
      width: 414px;
      height: 868px;
      padding: 12px;
      background: #111015;
      border-radius: 62px;
      position: relative;
      box-shadow: 0 24px 70px rgba(54,25,88,.23),
      0 0 0 2px #343039;
    }

    .phone::before,
    .phone::after {
      content: "";
      position: absolute;
      left: -5px;
      width: 4px;
      background: #302b35;
      border-radius: 4px;
    }

    .phone::before {
      top: 155px;
      height: 52px;
    }

    .phone::after {
      top: 228px;
      height: 69px;
    }

    .screen {
      width: 390px;
      height: 844px;
      border-radius: 50px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(
        160deg,
        #F0E4FB 0%,
        #F9EAF5 35%,
        #FFF9F7 70%,
        #FFECE5 100%
      );
    }

    .screen::before,
    .screen::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      filter: blur(50px);
      pointer-events: none;
    }

    .screen::before {
      width: 240px;
      height: 240px;
      top: -70px;
      right: -80px;
      background: rgba(216,66,160,.20);
    }

    .screen::after {
      width: 260px;
      height: 260px;
      bottom: 60px;
      left: -110px;
      background: rgba(136,52,185,.15);
    }

    /* HIBISCUS BACKGROUND */
    .bloom {
      position: absolute;
      z-index: 1;
      pointer-events: none;
      height: auto;
      object-fit: contain;
      user-select: none;
    }

    .bloom-top {
      width: 195px;
      top: 72px;
      right: -80px;
      opacity: 0.27;
      transform: rotate(23deg) scaleX(-1);
    }

    .bloom-bottom {
      width: 270px;
      bottom: -65px;
      left: -105px;
      opacity: 0.31;
      transform: rotate(-22deg);
    }

    /* PHONE DETAILS */
    .island {
      position: absolute;
      z-index: 10;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      height: 34px;
      width: 118px;
      background: #08070a;
      border-radius: 30px;
    }

    .status {
      position: absolute;
      top: 18px;
      left: 34px;
      right: 30px;
      z-index: 9;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 14px;
      font-weight: 800;
    }

    .homebar {
      position: absolute;
      bottom: 8px;
      left: 50%;
      transform: translateX(-50%);
      width: 126px;
      height: 5px;
      background: #2F2837;
      border-radius: 20px;
      z-index: 5;
    }

    /* CONTENT */
    .content {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 62px 28px 30px;
      overflow-y: auto;
      scrollbar-width: none;
    }

    .content::-webkit-scrollbar {
      display: none;
    }

    .logo {
      display: block;
      width: 150px;
      height: 70px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .heading {
      text-align: center;
      margin-top: 12px;
    }

    .eyebrow {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--pink);
      margin: 0 0 8px;
    }

    h1 {
      font-family: var(--serif);
      font-size: 31px;
      font-weight: 600;
      line-height: 1.1;
      letter-spacing: -.025em;
      color: #32145B;
      margin: 0;
    }

    h1 em {
      font-style: italic;
      font-weight: 500;
      padding-right: .06em;
      background: linear-gradient(
        100deg,
        var(--purple),
        var(--pink)
      );
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sub {
      font-size: 12px;
      color: var(--muted);
      margin: 8px 0 0;
      line-height: 1.5;
    }

    /* TABS */
    .tabs {
      position: relative;
      display: grid;
      grid-template-columns: 1fr 1fr;
      width: 100%;
      margin-top: 18px;
      padding: 4px;
      background: rgba(255,255,255,.45);
      border: 1px solid rgba(255,255,255,.7);
      border-radius: 16px;
      flex-shrink: 0;
    }

    .tab {
      position: relative;
      z-index: 1;
      border: 0;
      background: none;
      cursor: pointer;
      font: 700 13px var(--sans);
      color: var(--muted);
      padding: 10px 0;
      border-radius: 12px;
      transition: color .25s;
    }

    .tab[aria-selected="true"] {
      color: #fff;
    }

    .pill {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      border-radius: 12px;
      background: linear-gradient(
        105deg,
        var(--purple),
        #8834B9 52%,
        var(--pink)
      );
      box-shadow: 0 6px 14px rgba(112,42,159,.25);
      transition: transform .3s cubic-bezier(.2,.7,.2,1);
    }

    .tabs[data-mode="signup"] .pill {
      transform: translateX(100%);
    }

    /* FORM */
    form {
      width: 100%;
      margin-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .field label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      margin: 0 0 5px 3px;
      color: #4a3566;
    }

    .input-wrap {
      position: relative;
    }

    .input-wrap input {
      width: 100%;
      height: 46px;
      padding: 0 14px;
      font: 500 14px var(--sans);
      color: var(--ink);
      background: rgba(255,255,255,.6);
      border: 1.5px solid rgba(255,255,255,.9);
      border-radius: 14px;
      outline: none;
      box-shadow: 0 4px 14px rgba(87,36,163,.04);
      transition: border-color .2s,
      box-shadow .2s,
      background .2s;
    }

    .input-wrap input::placeholder {
      color: #aa9db6;
    }

    .input-wrap input:focus {
      background: rgba(255,255,255,.85);
      border-color: #B77BDB;
      box-shadow: 0 0 0 4px rgba(184,123,219,.18);
    }

    .field.invalid input {
      border-color: var(--error);
    }

    .has-toggle input {
      padding-right: 46px;
    }

    .toggle {
      position: absolute;
      top: 50%;
      right: 6px;
      transform: translateY(-50%);
      width: 34px;
      height: 34px;
      border: 0;
      background: none;
      cursor: pointer;
      display: grid;
      place-items: center;
      color: var(--muted);
      border-radius: 10px;
    }

    .toggle svg {
      width: 19px;
      height: 19px;
    }

    .err {
      display: block;
      font-size: 10.5px;
      font-weight: 600;
      color: var(--error);
      margin: 4px 0 0 3px;
    }

    .err:empty {
      display: none;
    }

    .signup-only {
      display: none;
    }

    form[data-mode="signup"] .signup-only {
      display: block;
    }

    /* PRIVACY POLICY */
    .policy {
      font-size: 10.5px;
      color: var(--muted);
      line-height: 1.6;
    }

    .policy label {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      cursor: pointer;
    }

    .policy input {
      accent-color: var(--purple);
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      margin-top: 2px;
    }

    .policy a {
      color: var(--purple);
      font-weight: 700;
    }

    /* FORGOT PASSWORD */
    .forgot-line {
      text-align: right;
      margin-top: -4px;
    }

    .forgot-line button {
      border: 0;
      background: none;
      color: var(--purple);
      font: 700 11px var(--sans);
      cursor: pointer;
    }

    /* MESSAGES */
    .form-msg {
      font-size: 12px;
      font-weight: 600;
      text-align: center;
      color: var(--error);
      background: rgba(192,34,79,.07);
      border-radius: 12px;
      padding: 10px 12px;
    }

    .form-msg:empty {
      display: none;
    }

    .form-msg.ok {
      color: #1F7A4D;
      background: rgba(31,122,77,.09);
    }

    /* BUTTON */
    .cta {
      border-radius: 999px;
      margin-top: 2px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 54px;
      width: 100%;
      border: 0;
      border-radius: 17px;
      cursor: pointer;
      background: linear-gradient(
        105deg,
        var(--purple),
        #8834B9 52%,
        var(--pink)
      );
      color: #fff;
      font: 800 14px var(--sans);
      letter-spacing: .01em;
      box-shadow: 0 12px 24px rgba(112,42,159,.2);
      transition: transform .25s,
      filter .25s,
      opacity .25s;
    }

    .cta:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .cta:disabled {
      opacity: .65;
      cursor: wait;
    }

    .switch {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin: 14px 0 6px;
      flex-shrink: 0;
    }

    .switch button {
      border: 0;
      background: none;
      padding: 0;
      cursor: pointer;
      font: 800 12px var(--sans);
      color: var(--purple);
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    .back {
      position: absolute;
      z-index: 6;
      top: 56px;
      left: 20px;
      width: 36px;
      height: 36px;
      display: grid;
      place-items: center;
      background: rgba(255,255,255,.55);
      border: 1px solid rgba(255,255,255,.8);
      border-radius: 12px;
      color: var(--purple);
      text-decoration: none;
    }

    .back svg {
      width: 18px;
      height: 18px;
    }

    /* RESPONSIVE */
    @media (max-width: 500px) {
      body {
        display: block;
        overflow: auto;
      }

      .stage,
      .phone {
        width: 100%;
        height: 100dvh;
        transform: none !important;
      }

      .phone {
        padding: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .phone::before,
      .phone::after,
      .island,
      .status,
      .homebar {
        display: none;
      }

      .screen {
        width: 100%;
        height: 100%;
        min-height: 650px;
        border-radius: 0;
      }

      .content {
        padding-top: 40px;
      }

      .back {
        top: 22px;
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .heading,
      .tabs,
      form {
        opacity: 0;
        transform: translateY(12px);
        animation: rise .6s cubic-bezier(.2,.7,.2,1) forwards;
      }

      .tabs {
        animation-delay: .1s;
      }

      form {
        animation-delay: .2s;
      }
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .pill,
      .cta,
      .tab {
        transition: none;
      }
    }

    /* Sign-in extras */
    .remember-forgot { display:flex;align-items:center;justify-content:space-between;gap:8px;margin:1px 0 5px; }
    .remember-row { display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer; }
    .remember-row input { width:15px;height:15px;accent-color:var(--purple); }
    .remember-forgot .forgot-line { margin:0; }
    .divider-row { display:flex;align-items:center;gap:10px;margin:7px 0 1px; }
    .divider-line { height:1px;flex:1;background:rgba(87,36,163,.16); }
    .divider-text {font-size:11px;font-weight:600;color:var(--muted);white-space:nowrap;}
    .social-row {display:grid;grid-template-columns:1fr 1fr;gap:9px;}
    .btn-social {min-height:45px;border-radius:999px;border:1px solid rgba(87,36,163,.13);background:rgba(255,255,255,.7);font:700 12px var(--sans);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px;}
    .btn-social:hover {background:white;}
    .btn-social svg {width:17px;height:17px;}
  </style>
</head>

<script>
  (function () {
    'use strict';

    /* STORAGE */
    const USERS_KEY = 'terooka_users';
    const SESSION_KEY = 'terooka_session';
    const HOME = 'home.html';

    const $ = (selector, root = document) =>
      root.querySelector(selector);

    const $$ = (selector, root = document) =>
      Array.from(root.querySelectorAll(selector));

    function readUsers() {
      try {
        return JSON.parse(localStorage.getItem(USERS_KEY)) || [];
      } catch {
        return [];
      }
    }

    function writeUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }

    function setSession(user) {
      localStorage.setItem(
        SESSION_KEY,
        JSON.stringify({
          email: user.email,
          name: user.name,
          at: Date.now()
        })
      );
    }

    function getSession() {
      try {
        return JSON.parse(localStorage.getItem(SESSION_KEY));
      } catch {
        return null;
      }
    }

    /* PROTOTYPE PASSWORD HASHING */
    function makeSalt() {
      if (window.crypto && crypto.getRandomValues) {
        return Array.from(
          crypto.getRandomValues(new Uint8Array(12)),
          byte => byte.toString(16).padStart(2, '0')
        ).join('');
      }

      return Math.random().toString(36).slice(2);
    }

    async function hashPassword(password, salt) {
      const text = salt + password;

      if (window.crypto && crypto.subtle && window.TextEncoder) {
        const buffer = await crypto.subtle.digest(
          'SHA-256',
          new TextEncoder().encode(text)
        );

        return Array.from(
          new Uint8Array(buffer),
          byte => byte.toString(16).padStart(2, '0')
        ).join('');
      }

      let hash = 5381;

      for (let i = 0; i < text.length; i++) {
        hash = ((hash << 5) + hash + text.charCodeAt(i)) | 0;
      }

      return 'f' + (hash >>> 0).toString(16);
    }

    /* LOCAL DEMO ACCOUNT — prototype only */
    async function ensureDemoUser() {
      const users = readUsers();
      if (users.some(u => u.email === 'demo@terooka.app')) return;
      const salt = makeSalt();
      const hash = await hashPassword('Demo1234', salt);
      users.push({ name: 'Demo Traveller', email: 'demo@terooka.app', salt, hash, createdAt: Date.now() });
      writeUsers(users);
    }

    /* REDIRECT IF SIGNED IN */
    if (getSession()) {
      window.location.replace(HOME);
      return;
    }

    /* PASSWORD VISIBILITY */
    const EYE = `
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/>
          <circle cx="12" cy="12" r="3"/>
        </svg>
      `;

    const EYE_OFF = `
        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.9"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M17.9 17.9A10.4 10.4 0 0 1 12 19C5.6 19 2 12 2 12a18.6 18.6 0 0 1 4.1-5.2M9.9 5.2A9.9 9.9 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2M1 1l22 22"/>
        </svg>
      `;

    $$('.toggle').forEach(button => {
      button.innerHTML = EYE;

      button.addEventListener('click', () => {
        const input = document.getElementById(
          button.dataset.target
        );

        const show = input.type === 'password';

        input.type = show ? 'text' : 'password';
        button.innerHTML = show ? EYE_OFF : EYE;
        button.setAttribute(
          'aria-label',
          show ? 'Hide password' : 'Show password'
        );
      });
    });

    /* FORM MODES */
    const form = $('#form');
    const tabs = $('#tabs');
    const msg = $('#msg');
    const submitBtn = $('#submit');

    const COPY = {
      signin: {
        eyebrow: 'Welcome back',
        title: 'Good to see <em>you again.</em>',
        sub: 'Sign in to continue your cultural journey.',
        btn: 'Sign In',
        sw: 'New to Terooka? ',
        swBtn: 'Create an account',
        pwAuto: 'current-password',
        doc: 'Sign In — Terooka'
      },

      signup: {
        eyebrow: 'Join the journey',
        title: 'Create your <em>account.</em>',
        sub: 'Save places, plan experiences and keep your travelogue.',
        btn: 'Create Account',
        sw: 'Already have an account? ',
        swBtn: 'Sign in',
        pwAuto: 'new-password',
        doc: 'Sign Up — Terooka'
      }
    };

    function clearErrors() {
      $$('.field').forEach(field => {
        field.classList.remove('invalid');
      });

      $$('.err').forEach(error => {
        error.textContent = '';
      });

      msg.textContent = '';
      msg.className = 'form-msg';
    }

    function setMode(mode) {
      const content = COPY[mode];

      const previousMode = form.dataset.mode;
      form.dataset.mode = mode;
      tabs.dataset.mode = mode;
      if (previousMode !== mode) {
        $('#password').value = mode === 'signin' ? 'Demo1234' : '';
        $('#email').value = mode === 'signin' ? (localStorage.getItem('terooka_remembered_email') || 'demo@terooka.app') : '';
      }
      form.setAttribute('aria-labelledby', 'tab-' + mode);

      $$('.tab').forEach(tab => {
        tab.setAttribute(
          'aria-selected',
          String(tab.dataset.mode === mode)
        );
      });

      $('#eyebrow').textContent = content.eyebrow;
      $('#title').innerHTML = content.title;
      $('#sub').textContent = content.sub;

      submitBtn.textContent = content.btn;

      $('#switch').firstChild.nodeValue = content.sw;
      $('#switch-btn').textContent = content.swBtn;

      $('#password').setAttribute(
        'autocomplete',
        content.pwAuto
      );

      $('#policy-row').style.display =
        mode === 'signup' ? 'block' : 'none';

      $$('.signin-only').forEach(node => {
        node.style.display = mode === 'signin' ? (node.classList.contains('social-row') ? 'grid' : node.classList.contains('remember-forgot') || node.classList.contains('divider-row') ? 'flex' : 'block') : 'none';
      });

      document.title = content.doc;

      clearErrors();

      history.replaceState(null, '', '#' + mode);
    }

    $$('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        setMode(tab.dataset.mode);
      });
    });

    $('#switch-btn').addEventListener('click', () => {
      setMode(
        form.dataset.mode === 'signin' ? 'signup' : 'signin'
      );
    });

    /* FORGOT PASSWORD — DEMO */
    $('#forgot').addEventListener('click', () => {
      msg.className = 'form-msg';
      msg.textContent =
        'Password reset requires a verified email service. ' +
        'This prototype cannot securely reset passwords yet.';

      msg.scrollIntoView({
        block: 'nearest',
        behavior: 'smooth'
      });
    });

    /* VALIDATION */
    const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;

    function fieldError(name, message) {
      const field = document.querySelector(
        '[data-field="' + name + '"]'
      );

      if (field) {
        field.classList.add('invalid');
      }

      const error = $('#err-' + name);

      if (error) {
        error.textContent = message;
      }
    }

    function validate(mode, values) {
      let valid = true;

      if (mode === 'signup') {
        if (values.name.length < 2) {
          fieldError('name', 'Please enter your full name.');
          valid = false;
        }

        if (!EMAIL_RE.test(values.email)) {
          fieldError('email', 'Enter a valid email address.');
          valid = false;
        }

        if (!$('#policy').checked) {
          $('#err-policy').textContent =
            'Please agree to the Privacy Policy and Terms of Use.';
          valid = false;
        }

        if (values.password.length < 8) {
          fieldError(
            'password',
            'Password must contain at least 8 characters.'
          );
          valid = false;
        } else if (
          !/[A-Za-z]/.test(values.password) ||
          !/\d/.test(values.password)
        ) {
          fieldError(
            'password',
            'Include at least one letter and one number.'
          );
          valid = false;
        }

        if (values.confirm !== values.password) {
          fieldError('confirm', 'Passwords do not match.');
          valid = false;
        }

      } else {
        if (!EMAIL_RE.test(values.email)) {
          fieldError('email', 'Enter a valid email address.');
          valid = false;
        }

        if (!values.password) {
          fieldError('password', 'Enter your password.');
          valid = false;
        }
      }

      return valid;
    }

    /* SUBMIT BUTTON STATE */
    function busy(isBusy) {
      submitBtn.disabled = isBusy;

      if (isBusy) {
        submitBtn.textContent = 'Please wait…';
      } else {
        submitBtn.textContent = COPY[form.dataset.mode].btn;
      }
    }

    /* SUCCESS */
    function finish(user) {
      msg.className = 'form-msg ok';

      msg.textContent =
        'Welcome, ' +
        user.name.split(' ')[0] +
        '! Taking you in…';

      setTimeout(() => {
        window.location.href = HOME;
      }, 700);
    }

    /* SIGN IN / SIGN UP */
    form.addEventListener('submit', async event => {
      event.preventDefault();

      clearErrors();

      const mode = form.dataset.mode;

      const values = {
        name: $('#name').value.trim(),
        email: $('#email').value.trim().toLowerCase(),
        password: $('#password').value,
        confirm: $('#confirm').value
      };

      if (!validate(mode, values)) {
        const firstInvalid = $('.field.invalid input');

        if (firstInvalid) {
          firstInvalid.focus();
        }

        return;
      }

      busy(true);

      try {
        await ensureDemoUser();
        const users = readUsers();

        const existing = users.find(
          user => user.email === values.email
        );

        if (mode === 'signup') {

          if (users.some(
            user => user.email === values.email
          )) {
            fieldError(
              'email',
              'An account with this email already exists.'
            );
            return;
          }

          const salt = makeSalt();
          const hash = await hashPassword(
            values.password,
            salt
          );

          const user = {
            name: values.name,
            email: values.email,
            salt,
            hash,
            createdAt: Date.now()
          };

          users.push(user);
          writeUsers(users);
          setSession(user);
          finish(user);

        } else {

          if (!existing) {
            msg.textContent = 'Incorrect email or password.';
            return;
          }

          const hash = await hashPassword(
            values.password,
            existing.salt
          );

          if (hash !== existing.hash) {
            msg.textContent = 'Incorrect email or password.';
            return;
          }

          setSession(existing);
          finish(existing);
        }

      } catch (error) {
        msg.textContent =
          'Something went wrong. Please check that browser storage is enabled.';
        console.error(error);

      } finally {
        busy(false);
      }
    });

    /* CLEAR INPUT ERRORS */
    $$('input').forEach(input => {
      input.addEventListener('input', () => {
        const field = input.closest('.field');

        if (field) {
          field.classList.remove('invalid');

          const error = $('.err', field);

          if (error) {
            error.textContent = '';
          }
        }

        if (input.id === 'policy') {
          $('#err-policy').textContent = '';
        }

        msg.textContent = '';
      });
    });

    $('#policy').addEventListener('change', () => {
      $('#err-policy').textContent = '';
    });

    ensureDemoUser().catch(console.error);

    // Remember the email only, never the password.
    const rememberedEmail = localStorage.getItem('terooka_remembered_email');
    if (rememberedEmail) $('#email').value = rememberedEmail;
    $$('.btn-social').forEach(button => button.addEventListener('click', () => {
      msg.className = 'form-msg';
      msg.textContent = button.dataset.social + ' sign-in is a demo placeholder. Connect OAuth to enable it.';
    }));

    /* INITIAL TAB */
    setMode(
      window.location.hash === '#signup'
        ? 'signup'
        : 'signin'
    );

    /* DESKTOP PHONE SCALING */
    const stage = $('#stage');

    function fit() {
      if (window.innerWidth <= 500) {
        stage.style.transform = '';
        return;
      }

      const scale = Math.min(
        1,
        (window.innerHeight - 28) / 868,
        (window.innerWidth - 28) / 414
      );

      stage.style.transform = `scale(${scale})`;
    }

    fit();
    window.addEventListener('resize', fit);

  })();
</script>
</body>
</html>
